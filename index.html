<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>bananasrlowkeygood</title>
  <link rel="icon" type="image/x-icon" href="static/assets/favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Klee+One:wght@400;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main id="home">
    <div class="intro">
      <div class="graphic" role="img" aria-label="two sloths hanging on a banana"></div>
      <h1>bananasrlowkeygood</h1>

      <div class="badges">
        <a class="badge" href="https://github.com/bananasrlowkeygood/bananasrlowkeygood.github.io/issues">
          <span class="badge-k">banana status</span><span class="badge-v v-amber">lowkey good</span>
        </a>
        <a class="badge" href="https://github.com/bananasrlowkeygood/bananasrlowkeygood.github.io/">
          <span class="badge-k">version</span><span class="badge-v v-violet">v3.14.15</span>
        </a>
        <a class="badge" href="https://github.com/bananasrlowkeygood/bananasrlowkeygood.github.io/blob/main/LICENSE">
          <span class="badge-k">license</span><span class="badge-v v-rose">MIT</span>
        </a>
      </div>

      <p>personal file hosting.</p>

      <form class="cmd" onsubmit="redirectToURL(event)" autocomplete="off">
        <span class="cmd-prompt">bananas:~$</span>
        <div class="cmd-field">
          <input type="text" id="input-path" placeholder="" autocomplete="off" autocapitalize="off" spellcheck="false" autofocus />
          <span class="cmd-cursor" id="cmdCursor">▌</span>
        </div>
        <button type="submit" aria-label="go">go</button>
        <div class="cmd-suggest" id="suggest" hidden></div>
      </form>
      <div class="cmd-msg" id="cmdMsg" aria-live="polite"></div>

      <a class="jump" href="jeff/">jeff</a>
    </div>
  </main>

  <script>
    const REPO = "bananasrlowkeygood/bananasrlowkeygood.github.io";
    const baseURL = "https://bananasrlowkeygood.github.io/";
    let allPaths = [];

    const input = document.getElementById("input-path");
    const suggest = document.getElementById("suggest");
    const cmdMsg = document.getElementById("cmdMsg");
    const cmdCursor = document.getElementById("cmdCursor");

    async function loadTree() {
      try {
        const res = await fetch(`https://api.github.com/repos/${REPO}/git/trees/main?recursive=1`);
        const data = await res.json();
        allPaths = data.tree
          .filter(i => i.type === "blob")
          .map(i => i.path)
          .filter(p => !p.split("/").some(seg => seg.startsWith("."))); // skip dotfiles/dirs
        index();
      } catch (e) { /* autocomplete is a nice-to-have */ }
    }

    // Pages are folders with an index.html; they come first and open as ./name/.
    const SHOWN = /\.(pdf|png|jpe?g|gif|mp4|html)$/i;
    let pages = [], files = [], items = [], active = -1;

    function index() {
      pages = allPaths.filter(p => /^[^/]+\/index\.html$/.test(p)).map(p => p.replace(/index\.html$/, ""));
      files = allPaths.filter(p => SHOWN.test(p) && !p.endsWith("index.html") && !p.startsWith("static/"));
    }

    function clean(v) { return v.trim().replace(/^\.?\//, "").toLowerCase(); }

    function matches(v) {
      if (!v) return pages;
      const score = p => {
        const name = p.replace(/\/$/, "").split("/").pop().toLowerCase();
        const page = p.endsWith("/") ? 0 : 4;
        if (name.startsWith(v)) return page;
        if (name.includes(v)) return page + 1;
        if (p.toLowerCase().includes(v)) return page + 2;
        return -1;
      };
      return [...pages, ...files]
        .map(p => [p, score(p)])
        .filter(([, sc]) => sc >= 0)
        .sort((x, y) => x[1] - y[1] || x[0].length - y[0].length)
        .slice(0, 7)
        .map(([p]) => p);
    }

    function render() {
      if (!items.length) { suggest.hidden = true; return; }
      suggest.innerHTML = items.map((p, i) =>
        `<button type="button" class="sg${i === active ? " on" : ""}" data-p="${p}">./${p}</button>`).join("");
      suggest.hidden = false;
    }

    function show(v) {
      items = matches(clean(v));
      active = items.length && v.trim() ? 0 : -1;
      render();
    }

    function go(path) { window.location.href = baseURL + path; }

    input.addEventListener("input", () => { updateCursor(); show(input.value); });
    input.addEventListener("mousedown", () => { if (!input.value) show(""); });

    input.addEventListener("keydown", e => {
      if (e.key === "ArrowDown" || e.key === "ArrowUp") {
        e.preventDefault();
        if (suggest.hidden) { show(input.value); return; }
        const n = items.length;
        active = (active + (e.key === "ArrowDown" ? 1 : -1) + n) % n;
        render();
      } else if (e.key === "Tab" && !suggest.hidden && items.length) {
        e.preventDefault();
        input.value = "./" + items[Math.max(active, 0)];
        show(input.value);
      } else if (e.key === "Escape") {
        suggest.hidden = true;
      }
    });

    suggest.addEventListener("click", e => {
      const b = e.target.closest(".sg");
      if (b) go(b.dataset.p);
    });

    document.addEventListener("click", e => {
      if (!e.target.closest(".cmd")) suggest.hidden = true;
    });

    function say(text) {
      cmdMsg.textContent = text;
      cmdMsg.classList.remove("wiggle");
      void cmdMsg.offsetWidth;
      cmdMsg.classList.add("wiggle");
    }

    function redirectToURL(event) {
      event.preventDefault();
      const v = clean(input.value);
      if (!suggest.hidden && active >= 0) { go(items[active]); return; }
      suggest.hidden = true;
      if (!v) { say("you didn't type anything, silly \u{1F34C}"); return; }
      // Exact path or page name first, then the best match, then try it as typed.
      const exact = [...pages, ...files].find(p => p.toLowerCase() === v || p.toLowerCase() === v + "/");
      const best = exact || matches(v)[0];
      if (best) { go(best); return; }
      if (!allPaths.length) { go(v); return; }
      say(`nothing called ${v} here`);
    }

    function updateCursor() {
      cmdCursor.hidden = (document.activeElement === input || !!input.value);
    }
    input.addEventListener("focus", updateCursor);
    input.addEventListener("blur", updateCursor);
    updateCursor();

    // The prompt should behave like a real terminal: land on the page and type.
    function focusInput() {
      try { input.focus({ preventScroll: true }); } catch (e) { input.focus(); }
      updateCursor();
    }
    focusInput();
    window.addEventListener("pageshow", focusInput);

    // ...and if focus wandered off (a click on the background, a badge), the
    // next keystroke pulls it back. The character that triggered this is
    // appended by hand — refocusing mid-keydown does not reliably carry it.
    document.addEventListener("keydown", e => {
      if (e.metaKey || e.ctrlKey || e.altKey) return;
      if (document.activeElement === input) return;
      const t = e.target;
      if (t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA" || t.isContentEditable)) return;

      if (e.key === "Backspace") { e.preventDefault(); focusInput(); return; }
      if (e.key.length !== 1) return;

      e.preventDefault();
      focusInput();
      input.value += e.key;
      input.dispatchEvent(new Event("input", { bubbles: true }));
    });

    loadTree();
  </script>
</body>
</html>

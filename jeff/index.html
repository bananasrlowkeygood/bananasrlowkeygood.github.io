<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>jeff — bananasrlowkeygood</title>
  <link rel="icon" type="image/x-icon" href="../static/assets/favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Klee+One&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after {
      margin: 0; padding: 0; box-sizing: border-box;
      font-family: "Klee One", cursive;
    }

    body {
      background-color: #eae6f0;
      color: #14111a;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    a { color: inherit; text-decoration: none; }

    .topbar {
      background: #f0ecf8;
      border-bottom: 1px solid #c5bee0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.7rem 1.5rem;
      position: sticky;
      top: 0;
      z-index: 10;
      gap: 1rem;
      width: 100%;
    }

    .topbar-left { display: flex; align-items: center; gap: 1rem; }

    .back-link {
      font-size: 0.85rem;
      color: #5c4f7a;
      opacity: 0.7;
      transition: opacity 0.15s;
      white-space: nowrap;
    }
    .back-link:hover { opacity: 1; }

    .topbar-title { font-size: 0.95rem; color: #14111a; }

    .content {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1.5rem 4rem;
    }

    .blocks {
      display: flex;
      flex-direction: column;
      gap: 0.65rem;
      width: 100%;
      max-width: 720px;
    }

    .block-card {
      border: 1px solid #c5bee0;
      border-radius: 10px;
      padding: 0.65rem 1rem;
      background: #f0ecf8;
      display: flex;
      flex-direction: column;
      gap: 0;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .block-card:hover {
      border-color: #5c4f7a;
      box-shadow: 0 4px 16px rgba(92,79,122,0.1);
    }

    .block-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }

    .block-left {
      display: flex;
      align-items: baseline;
      flex-wrap: wrap;
      gap: 0.6rem;
      min-width: 0;
    }

    .block-name { font-size: 1rem; color: #14111a; }

    .block-count {
      font-size: 0.78rem;
      color: #5c4f7a;
      opacity: 0.7;
      white-space: nowrap;
    }

    .block-actions {
      display: flex;
      gap: 0.4rem;
      flex-shrink: 0;
    }

    button {
      background-color: #5c4f7a;
      color: #f0ecf8;
      border: none;
      padding: 0 12px;
      height: 30px;
      font-size: 0.78rem;
      cursor: pointer;
      border-radius: 6px;
      font-family: "Klee One", cursive;
      transition: background-color 0.2s ease;
    }
    button:hover  { background-color: #6e5f90; }
    button:active { background-color: #3e3456; }

    .btn-outline {
      background: transparent;
      border: 1px solid #c5bee0;
      color: #5c4f7a;
    }
    .btn-outline:hover { border-color: #5c4f7a; background: rgba(92,79,122,0.06); }

    .lecture-list {
      display: none;
      flex-direction: column;
      gap: 0.25rem;
      margin-top: 0.5rem;
      padding-top: 0.5rem;
      border-top: 1px solid #c5bee0;
    }
    .lecture-list.open { display: flex; }

    .lecture-link {
      font-size: 0.82rem;
      color: #5c4f7a;
      padding: 0.3rem 0.5rem;
      border-radius: 5px;
      background: rgba(92,79,122,0.06);
      transition: background 0.15s;
    }
    .lecture-link:hover { background: rgba(92,79,122,0.14); }

    /* ── Week groups ──
       Weeks come from the block's weeks.json; each is a header you open. */
    .week-group {
      display: flex;
      flex-direction: column;
    }

    .week-head {
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    /* Only the disclosure is a button — the shuffle chip sits beside it, since
       a button can't legally contain another one. */
    .week-toggle {
      display: flex;
      align-items: baseline;
      gap: 0.5rem;
      flex: 1 1 auto;
      min-width: 0;
      height: auto;
      padding: 0.35rem 0.5rem;
      border: none;
      border-radius: 5px;
      background: transparent;
      color: #14111a;
      font-family: "Klee One", cursive;
      font-size: 0.85rem;
      text-align: left;
      cursor: pointer;
      transition: background 0.15s;
    }
    .week-toggle:hover  { background: rgba(92,79,122,0.10); }
    .week-toggle:active { background: rgba(92,79,122,0.16); }

    .week-caret {
      font-size: 0.55rem;
      color: #5c4f7a;
      opacity: 0.6;
      width: 0.7rem;
      flex-shrink: 0;
      transition: transform 0.15s;
    }
    .week-group.open .week-caret { transform: rotate(90deg); }

    .week-name  { white-space: nowrap; }
    .week-dates {
      font-size: 0.74rem;
      color: #5c4f7a;
      opacity: 0.6;
      white-space: nowrap;
    }
    .week-count {
      margin-left: auto;
      font-size: 0.72rem;
      color: #5c4f7a;
      opacity: 0.55;
      flex-shrink: 0;
      white-space: nowrap;
    }

    /* Narrow screens keep the name, the dates and the shuffle; the tally is
       the first thing to go. */
    @media (max-width: 560px) {
      .week-count { display: none; }
      .week-dates { margin-left: auto; }

      /* The actions can't shrink, so side by side they ran off the card.
         Stacked, they get the full width and a thumb-sized target each. */
      .block-row {
        flex-direction: column;
        align-items: stretch;
        gap: 0.55rem;
      }
      .block-actions > * { flex: 1 1 0; }
    }

    .week-shuffle {
      height: 22px;
      padding: 0 9px;
      font-size: 0.68rem;
      border-radius: 5px;
      flex-shrink: 0;
      background: transparent;
      border: 1px solid #c5bee0;
      color: #5c4f7a;
      transition: background-color 0.15s, border-color 0.15s, color 0.15s;
    }
    .week-shuffle:hover {
      background: #5c4f7a;
      border-color: #5c4f7a;
      color: #f0ecf8;
    }

    .week-lectures {
      display: none;
      flex-direction: column;
      gap: 0.25rem;
      padding: 0.15rem 0 0.4rem 1.2rem;
    }
    .week-group.open .week-lectures { display: flex; }

    .empty-msg {
      font-size: 0.8rem;
      opacity: 0.45;
      font-style: italic;
    }
  </style>
</head>
<body>
  <div class="topbar">
    <div class="topbar-left">
      <a class="back-link" href="../index.html">← bananasrlowkeygood</a>
      <div class="topbar-title">jeff</div>
    </div>
  </div>

  <div class="content">
    <div class="blocks" id="blocks"></div>
  </div>

  <script>
    // Files in a block folder that describe it rather than hold questions.
    const MANIFESTS = ['index.json', 'weeks.json'];

    const BLOCKS = [
      { id: 'neuro',     name: 'Neurology'   },
      { id: 'endorepro', name: 'Endo / Repro' },
      { id: 'msk',       name: 'MSK'          },
    ];

    async function loadBlock(block) {
      try {
        const apiUrl = `https://api.github.com/repos/bananasrlowkeygood/bananasrlowkeygood.github.io/contents/jeff/${block.id}`;
        const res = await fetch(apiUrl);
        if (!res.ok) return [];
        const entries = await res.json();
        const files = entries.filter(e => e.type === 'file' && e.name.endsWith('.json') && !MANIFESTS.includes(e.name)).map(e => e.name);
        const lectures = await Promise.all(files.map(async name => {
          const r = await fetch(`${block.id}/${name}?t=${Date.now()}`);
          if (!r.ok) return null;
          const d = await r.json();
          return { file: name, name: d.lecture || name, count: (d.questions || []).length };
        }));
        return lectures.filter(Boolean);
      } catch { return []; }
    }

    // The course calendar for a block, if it has one. Optional — a block with
    // no weeks.json just shows a flat list of its lectures.
    async function loadWeeks(block) {
      try {
        const r = await fetch(`${block.id}/weeks.json?t=${Date.now()}`);
        if (!r.ok) return [];
        const d = await r.json();
        return Array.isArray(d.weeks) ? d.weeks : [];
      } catch { return []; }
    }

    // Slot each lecture into its week, keeping the calendar's order. Anything
    // the calendar doesn't mention still shows up, under its own heading, so a
    // lecture can never go missing just because the manifest is behind.
    function groupByWeek(lectures, weeks) {
      const byFile = new Map(lectures.map(l => [l.file, l]));
      const groups = [];

      weeks.forEach(w => {
        const items = (w.lectures || []).map(f => byFile.get(f)).filter(Boolean);
        items.forEach(l => byFile.delete(l.file));
        if (items.length) groups.push({ id: w.id, name: w.name, dates: w.dates, items });
      });

      const leftover = [...byFile.values()];
      if (leftover.length) groups.push({ id: null, name: 'Not yet scheduled', dates: '', items: leftover });
      return groups;
    }

    const esc = t => String(t).replace(/[&<>"]/g, c =>
      ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);

    function lectureLink(block, l) {
      return `<a class="lecture-link" href="quiz.html?block=${block.id}&lecture=${encodeURIComponent(l.file)}">${esc(l.name)} (${l.count || 0} Qs)</a>`;
    }

    function weekGroup(block, g) {
      const qs = g.items.reduce((s, l) => s + (l.count || 0), 0);
      const shuffle = g.id
        ? `<button class="week-shuffle" title="Shuffle every question in ${esc(g.name)}" onclick="location.href='quiz.html?block=${block.id}&week=${encodeURIComponent(g.id)}'">shuffle</button>`
        : '';
      return `
        <div class="week-group">
          <div class="week-head">
            <button class="week-toggle" onclick="toggleWeek(this)" aria-expanded="false">
              <span class="week-caret">&#9654;</span>
              <span class="week-name">${esc(g.name)}</span>
              ${g.dates ? `<span class="week-dates">${esc(g.dates)}</span>` : ''}
              <span class="week-count">${g.items.length} lecture${g.items.length !== 1 ? 's' : ''} \u00b7 ${qs} q</span>
            </button>
            ${shuffle}
          </div>
          <div class="week-lectures">
            ${g.items.map(l => lectureLink(block, l)).join('')}
          </div>
        </div>`;
    }

    async function init() {
      const container = document.getElementById('blocks');
      for (const block of BLOCKS) {
        const [lectures, weeks] = await Promise.all([loadBlock(block), loadWeeks(block)]);
        const total = lectures.reduce((s, l) => s + (l.count || 0), 0);
        const groups = weeks.length ? groupByWeek(lectures, weeks) : null;

        const card = document.createElement('div');
        card.className = 'block-card';
        card.innerHTML = `
          <div class="block-row">
            <div class="block-left">
              <div class="block-name">${block.name}</div>
              <div class="block-count">${total} q · ${lectures.length} lecture${lectures.length !== 1 ? 's' : ''}</div>
            </div>
            <div class="block-actions">
              ${lectures.length ? `<button class="btn-outline" onclick="toggleLectures(this)">By Lecture ▾</button>` : ''}
              <button onclick="location.href='quiz.html?block=${block.id}'">Shuffle All</button>
            </div>
          </div>
          <div class="lecture-list">
            ${!lectures.length
              ? '<span class="empty-msg">no lectures yet</span>'
              : groups
                ? groups.map(g => weekGroup(block, g)).join('')
                : lectures.map(l => lectureLink(block, l)).join('')
            }
          </div>
        `;
        container.appendChild(card);
      }
    }

    function toggleWeek(btn) {
      const open = btn.closest('.week-group').classList.toggle('open');
      btn.setAttribute('aria-expanded', open ? 'true' : 'false');
    }

    function toggleLectures(btn) {
      const list = btn.closest('.block-card').querySelector('.lecture-list');
      list.classList.toggle('open');
      btn.textContent = list.classList.contains('open') ? 'By Lecture ▴' : 'By Lecture ▾';
    }

    init();
  </script>
</body>
</html>

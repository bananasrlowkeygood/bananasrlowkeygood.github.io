<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>jeff — bananasrlowkeygood</title>
  <link rel="icon" type="image/x-icon" href="../static/assets/favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Klee+One&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after {
      margin: 0; padding: 0; box-sizing: border-box;
      font-family: "Klee One", cursive;
    }

    body {
      background-color: #eae6f0;
      color: #14111a;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    a { color: inherit; text-decoration: none; }

    .topbar {
      background: #f0ecf8;
      border-bottom: 1px solid #c5bee0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.7rem 1.5rem;
      position: sticky;
      top: 0;
      z-index: 10;
      gap: 1rem;
      width: 100%;
    }

    .topbar-left { display: flex; align-items: center; gap: 1rem; }

    .back-link {
      font-size: 0.85rem;
      color: #5c4f7a;
      opacity: 0.7;
      transition: opacity 0.15s;
      white-space: nowrap;
    }
    .back-link:hover { opacity: 1; }

    .topbar-title { font-size: 0.95rem; color: #14111a; }

    .content {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1.5rem 4rem;
    }

    .lock-btn {
      height: 26px;
      padding: 0 10px;
      font-size: 0.72rem;
      opacity: 0.55;
      transition: opacity 0.15s, border-color 0.15s, background 0.15s;
    }
    .lock-btn:hover { opacity: 1; }

    .topbar-right { display: flex; align-items: center; gap: 0.7rem; min-width: 0; }

    /* A way somewhere, so it looks like one: boxed like the buttons, and ruled
       off from the account beside it. */
    .history-link {
      display: inline-flex;
      align-items: center;
      height: 26px;
      padding: 0 10px;
      border: 1px solid #c5bee0;
      border-radius: 6px;
      font-size: 0.72rem;
      color: #5c4f7a;
      white-space: nowrap;
      transition: border-color 0.15s, background 0.15s;
    }
    .history-link:hover { border-color: #5c4f7a; background: rgba(92,79,122,0.06); }
    .bar-rule { align-self: stretch; width: 1px; margin: 0.15rem 0.1rem; background: #c5bee0; }

    /* Who is signed in — lowercase, like everything else up here. */
    .who {
      font-size: 0.78rem;
      color: #5c4f7a;
      opacity: 0.7;
      text-transform: lowercase;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .who:empty { display: none; }

    .blocks {
      display: flex;
      flex-direction: column;
      gap: 0.65rem;
      width: 100%;
      max-width: 720px;
    }

    /* A side card looks the same but is not a block: the inbox, the ids box. */
    .block-card, .side-card {
      border: 1px solid #c5bee0;
      border-radius: 10px;
      padding: 0.65rem 1rem;
      background: #f0ecf8;
      display: flex;
      flex-direction: column;
      gap: 0;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .block-card:hover, .side-card:hover {
      border-color: #5c4f7a;
      box-shadow: 0 4px 16px rgba(92,79,122,0.1);
    }

    .block-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }

    .block-left {
      display: flex;
      align-items: baseline;
      flex-wrap: wrap;
      gap: 0.6rem;
      min-width: 0;
    }

    .block-name { font-size: 1rem; color: #14111a; }

    .block-count {
      font-size: 0.78rem;
      color: #5c4f7a;
      opacity: 0.7;
      white-space: nowrap;
    }

    .block-actions {
      display: flex;
      gap: 0.4rem;
      flex-shrink: 0;
    }

    button {
      background-color: #5c4f7a;
      color: #f0ecf8;
      border: none;
      padding: 0 12px;
      height: 30px;
      font-size: 0.78rem;
      cursor: pointer;
      border-radius: 6px;
      font-family: "Klee One", cursive;
      transition: background-color 0.2s ease;
    }
    button:hover  { background-color: #6e5f90; }
    button:active { background-color: #3e3456; }

    .btn-outline {
      background: transparent;
      border: 1px solid #c5bee0;
      color: #5c4f7a;
    }
    .btn-outline:hover { border-color: #5c4f7a; background: rgba(92,79,122,0.06); }

    .lecture-list {
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
      margin-top: 0.5rem;
      padding-top: 0.5rem;
      border-top: 1px solid #c5bee0;
    }

    .lecture-link {
      font-size: 0.82rem;
      color: #5c4f7a;
      padding: 0.3rem 0.5rem;
      border-radius: 5px;
      background: rgba(92,79,122,0.06);
      transition: background 0.15s;
    }
    .lecture-link:hover { background: rgba(92,79,122,0.14); }

    /* Where you stand on a lecture: tried / total, and how the last try at
       each went. Empty until you have tried something. */
    .lecture-link {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 0.75rem;
    }
    .lecture-stat {
      font-size: 0.72rem;
      opacity: 0.65;
      white-space: nowrap;
      flex-shrink: 0;
    }

    /* Figures side by side are set apart by space alone. */
    .lecture-stat, .week-count, .block-stat { display: inline-flex; gap: 0.7em; }
    .week-pct:empty { display: none; }

    /* ── Due for review ──
       Beside history, and only there on a day something is due. */
    .history-link[hidden] { display: none; }
    .history-link { gap: 0.4em; }

    /* ── Inbox ──
       Questions other people sent you. Only there when there are some. */
    .inbox[hidden] { display: none; }
    .inbox .lecture-list { margin-top: 0.4rem; }
    .inbox-row { display: flex; align-items: center; gap: 0.4rem; }
    .inbox-row .lecture-link { flex: 1 1 auto; min-width: 0; }

    /* ── Questions by id ── */
    .ids-row { flex-direction: row; align-items: center; gap: 0.4rem; }
    .ids-row input {
      flex: 1 1 auto;
      min-width: 0;
      height: 30px;
      padding: 0 0.6rem;
      border: 1px solid #c5bee0;
      border-radius: 6px;
      background: #fbf9fe;
      color: #14111a;
      font-size: 0.82rem;
      outline: none;
    }
    .ids-row input:focus { border-color: #5c4f7a; }
    .ids-row input::placeholder { color: #5c4f7a; opacity: 0.5; }
    .ids-row button:disabled, .ids-row button:disabled:hover {
      background: #e4e4e4;
      border-color: #e4e4e4;
      color: #9a9a9a;
      cursor: default;
    }
    .ids-row button[hidden] { display: none; }

    /* ── Custom sets ──
       Every lecture has a box to tick, and every week one that ticks the lot.
       Tick any and the bar at the bottom says what you have and starts it. */
    .tick {
      flex-shrink: 0;
      align-self: center;
      width: 0.8rem; height: 0.8rem;
      margin: -0.3rem 0;
      padding: 0.3rem;
      box-sizing: content-box;
      background: none;
      border: none;
      border-radius: 0;
      cursor: pointer;
    }
    .tick:hover, .tick:active { background: none; }
    .tick::before {
      content: '';
      display: block;
      width: 100%; height: 100%;
      box-sizing: border-box;
      border: 1px solid #5c4f7a;
      border-radius: 3px;
      opacity: 0.55;
      transition: background 0.12s, opacity 0.12s;
    }
    .tick:hover::before { opacity: 1; }
    .picked > .tick::before, .tick.on::before { background: #5c4f7a; opacity: 1; }
    .lecture-link.picked { background: rgba(92,79,122,0.16); }
    .lecture-link > .lecture-name { flex: 1 1 auto; min-width: 0; }

    .pickbar {
      position: fixed;
      left: 50%; bottom: 1rem;
      transform: translateX(-50%);
      z-index: 20;
      display: none;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: 0.6rem 0.8rem;
      width: max-content;
      max-width: calc(100% - 2rem);
      padding: 0.6rem 0.8rem;
      background: #fbf9fe;
      border: 1px solid #c5bee0;
      border-radius: 12px;
      box-shadow: 0 10px 34px rgba(92,79,122,0.22);
    }
    .pickbar.open { display: flex; }
    body.picking .content { padding-bottom: 8rem; }

    .pick-count { font-size: 0.8rem; color: #5c4f7a; white-space: nowrap; }

    .seg {
      display: flex;
      border: 1px solid #c5bee0;
      border-radius: 6px;
      overflow: hidden;
    }
    .seg button {
      height: 28px;
      padding: 0 10px;
      border-radius: 0;
      background: transparent;
      color: #5c4f7a;
      font-size: 0.74rem;
      white-space: nowrap;
    }
    .seg button + button { border-left: 1px solid #c5bee0; }
    .seg button:hover { background: rgba(92,79,122,0.08); }
    .seg button.on, .seg button.on:hover { background: #5c4f7a; color: #f0ecf8; }

    /* Nothing to start is plain grey, not a faded purple. */
    .seg button:disabled, .seg button:disabled:hover,
    .pickbar > button:disabled, .pickbar > button:disabled:hover {
      background: transparent;
      color: #b5b5b5;
      cursor: default;
    }
    .pickbar > button:disabled, .pickbar > button:disabled:hover { background: #e4e4e4; color: #9a9a9a; }

    /* ── Week groups ──
       Weeks come from the block's weeks.json; each heads its lectures. */
    .week-group {
      display: flex;
      flex-direction: column;
    }

    .week-head {
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .week-title {
      display: flex;
      align-items: baseline;
      gap: 0.5rem;
      flex: 1 1 auto;
      min-width: 0;
      padding: 0.35rem 0.5rem;
      color: #14111a;
      font-size: 0.85rem;
    }

    .week-name  { white-space: nowrap; }
    .week-dates {
      font-size: 0.74rem;
      color: #5c4f7a;
      opacity: 0.6;
      white-space: nowrap;
    }
    .week-count {
      margin-left: auto;
      font-size: 0.72rem;
      color: #5c4f7a;
      opacity: 0.55;
      flex-shrink: 0;
      white-space: nowrap;
    }

    /* Narrow screens keep the name, the dates and the shuffle; the tally is
       the first thing to go. */
    @media (max-width: 560px) {
      .week-group .week-count { display: none; }
      .week-dates { margin-left: auto; }

      /* The actions can't shrink, so side by side they ran off the card.
         Stacked, they get the full width and a thumb-sized target each. */
      .block-row {
        flex-direction: column;
        align-items: stretch;
        gap: 0.55rem;
      }
      .block-actions > * { flex: 1 1 0; }
    }

    .week-shuffle {
      height: 22px;
      padding: 0 9px;
      font-size: 0.68rem;
      border-radius: 5px;
      flex-shrink: 0;
      background: transparent;
      border: 1px solid #c5bee0;
      color: #5c4f7a;
      transition: background-color 0.15s, border-color 0.15s, color 0.15s;
    }
    .week-shuffle:hover {
      background: #5c4f7a;
      border-color: #5c4f7a;
      color: #f0ecf8;
    }

    .week-lectures {
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
      padding: 0.15rem 0 0.4rem 1.2rem;
    }

    .empty-msg {
      font-size: 0.8rem;
      opacity: 0.45;
      font-style: italic;
    }
  </style>
</head>
<body>
  <div class="topbar">
    <div class="topbar-left">
      <a class="back-link" href="../index.html">← bananasrlowkeygood</a>
      <div class="topbar-title">jeff</div>
    </div>
    <div class="topbar-right">
      <a class="history-link" id="dueRow" title="Due for review" hidden><span>due</span><span id="dueCount"></span></a>
      <a class="history-link" href="history.html">history</a>
      <span class="bar-rule"></span>
      <span class="who" id="who"></span>
      <button class="btn-outline lock-btn" id="lockBtn" onclick="GATE.forget()" title="Forget this browser — ask for the password again">lock</button>
    </div>
  </div>

  <div class="content">
    <div class="blocks">
      <div class="side-card inbox" id="inbox" hidden>
        <div class="block-left">
          <div class="block-name">inbox</div>
          <div class="block-count" id="inboxCount"></div>
        </div>
        <div class="lecture-list" id="inboxList"></div>
      </div>
    </div>
    <div class="blocks" id="blocks" style="margin-top:0.65rem"></div>
    <div class="blocks" style="margin-top:0.65rem">
      <form class="side-card ids-row" id="idsRow" onsubmit="goIds(event)">
        <input id="idsInput" type="text" placeholder="question ids" aria-label="question ids"
               autocomplete="off" autocapitalize="none" spellcheck="false">
        <button type="submit" id="idsGo" disabled>start</button>
        <button type="button" class="btn-outline" id="idsSend" onclick="SHARE.pick(this, typedIds())" disabled hidden>send</button>
      </form>
    </div>
  </div>

  <div class="pickbar" id="pickbar">
    <span class="pick-count" id="pickCount"></span>
    <div class="seg" id="pickOnly">
      <button type="button" data-only="all"></button>
      <button type="button" data-only="due"></button>
      <button type="button" data-only="missed"></button>
      <button type="button" data-only="unseen"></button>
      <button type="button" data-only="flagged"></button>
    </div>
    <button type="button" id="pickGo" onclick="goPick()">start</button>
    <button type="button" class="btn-outline" onclick="clearPick()">clear</button>
  </div>

  <script src="firebase-config.js"></script>
  <script src="gate.js"></script>
  <script src="store.js"></script>
  <script src="share.js"></script>
  <script>
    // Files in a block folder that describe it rather than hold questions.
    const MANIFESTS = ['index.json', 'weeks.json', 'gate.json'];

    // The block this page is for. Neurology is parked rather than gone: its
    // questions and everyone's history with them are still there, and adding
    // { id: 'neuro', name: 'Neurology' } here brings it back.
    const BLOCKS = [
      { id: 'endorepro', name: 'Endo / Repro' },
    ];

    // A block's lectures, from its index.json (rebuilt on every push by
    // build_index.py). The GitHub API is only a fallback: it is rate-limited
    // per IP, which a shared network runs through.
    async function loadBlock(block) {
      try {
        const r = await fetch(`${block.id}/index.json?t=${Date.now()}`);
        if (r.ok) return (await r.json()).lectures || [];
      } catch { /* fall through */ }
      try {
        const apiUrl = `https://api.github.com/repos/bananasrlowkeygood/bananasrlowkeygood.github.io/contents/jeff/${block.id}`;
        const res = await fetch(apiUrl);
        if (!res.ok) return [];
        const entries = await res.json();
        const files = entries.filter(e => e.type === 'file' && e.name.endsWith('.json') && !MANIFESTS.includes(e.name)).map(e => e.name);
        const lectures = await Promise.all(files.map(async name => {
          const r = await fetch(`${block.id}/${name}?t=${Date.now()}`);
          if (!r.ok) return null;
          const d = await r.json();
          return { file: name, name: d.lecture || name, count: (d.questions || []).length };
        }));
        return lectures.filter(Boolean);
      } catch { return []; }
    }

    // The course calendar for a block, if it has one. Optional — a block with
    // no weeks.json just shows a flat list of its lectures.
    async function loadWeeks(block) {
      try {
        const r = await fetch(`${block.id}/weeks.json?t=${Date.now()}`);
        if (!r.ok) return [];
        const d = await r.json();
        return Array.isArray(d.weeks) ? d.weeks : [];
      } catch { return []; }
    }

    // Slot each lecture into its week, keeping the calendar's order. Anything
    // the calendar doesn't mention still shows up, under its own heading, so a
    // lecture can never go missing just because the manifest is behind.
    function groupByWeek(lectures, weeks) {
      const byFile = new Map(lectures.map(l => [l.file, l]));
      const groups = [];

      weeks.forEach(w => {
        const items = (w.lectures || []).map(f => byFile.get(f)).filter(Boolean);
        items.forEach(l => byFile.delete(l.file));
        if (items.length) groups.push({ id: w.id, name: w.name, dates: w.dates, items });
      });

      const leftover = [...byFile.values()];
      if (leftover.length) groups.push({ id: null, name: 'Not yet scheduled', dates: '', items: leftover });
      return groups;
    }

    const esc = t => String(t).replace(/[&<>"]/g, c =>
      ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);

    function lectureLink(block, l) {
      return `<a class="lecture-link" data-block="${block.id}" data-file="${esc(l.file)}" href="quiz.html?block=${block.id}&lecture=${encodeURIComponent(l.file)}">` +
        `<button class="tick" type="button" role="checkbox" aria-checked="false" aria-label="Add to a custom set"></button>` +
        `<span class="lecture-name">${esc(l.name)} (${l.count || 0} Qs)</span>` +
        `<span class="lecture-stat" data-doc="${esc(STORE.docId(block.id, l.file))}" data-count="${l.count || 0}"></span></a>`;
    }

    // tried / total, and how many of those were right on the last try.
    function standing(stats) {
      const total = stats.reduce((s, el) => s + Number(el.dataset.count), 0);
      let seen = 0, right = 0, due = 0, flagged = 0;
      stats.forEach(el => {
        const st = STORE.stats(el.dataset.doc);
        seen += Math.min(st.seen, Number(el.dataset.count));
        right += Math.min(st.right, st.seen, Number(el.dataset.count));
        due += st.due;
        flagged += st.flagged;
      });
      return { total, seen, right, due, flagged, pct: seen ? Math.round(right / seen * 100) : 0 };
    }

    const statsIn = el => [...el.querySelectorAll('.lecture-stat')];

    // Each lecture, then the same rolled up for its week and its block.
    function paintStats() {
      document.querySelectorAll('.lecture-stat').forEach(el => {
        const s = standing([el]);
        el.innerHTML = s.seen ? `<span>${s.seen}/${s.total}</span><span>${s.pct}%</span>` : '';
      });
      document.querySelectorAll('.week-group').forEach(g => {
        const s = standing(statsIn(g));
        g.querySelector('.week-pct').textContent = s.seen ? `${s.pct}%` : '';
      });
      document.querySelectorAll('.block-card').forEach(card => {
        const s = standing(statsIn(card));
        card.querySelector('.block-stat').innerHTML = s.seen ? `<span>${s.seen} tried</span><span>${s.pct}%</span>` : '';
      });
      paintDue();
      paintPick();
    }

    // A set's lectures as the quiz page reads them: block/file-name, no .json.
    const setOf = links => links
      .map(a => `${a.dataset.block}/${encodeURIComponent(a.dataset.file.replace(/\.json$/, ''))}`).join(',');

    // Everything due for review today, across every block, as one set.
    function paintDue() {
      const links = [...document.querySelectorAll('.lecture-link')]
        .filter(a => STORE.stats(a.querySelector('.lecture-stat').dataset.doc).due);
      const due = standing(links.map(a => a.querySelector('.lecture-stat'))).due;
      const row = document.getElementById('dueRow');
      row.hidden = !due;
      row.href = `quiz.html?set=${setOf(links)}&only=due`;
      document.getElementById('dueCount').textContent = due;
    }

    // ── Custom sets ──
    let pickOnly = 'all';   // which of the ticked lectures' questions to play

    function setPicked(link, on) {
      link.classList.toggle('picked', on);
      link.querySelector('.tick').setAttribute('aria-checked', on ? 'true' : 'false');
    }

    // A lecture's box ticks it; anywhere else on the row opens it as before.
    // A week's box ticks, or unticks, everything in the week.
    document.getElementById('blocks').addEventListener('click', e => {
      const tick = e.target.closest('.tick');
      if (!tick) return;
      e.preventDefault();
      const link = tick.closest('.lecture-link');
      if (link) setPicked(link, !link.classList.contains('picked'));
      else {
        const links = [...tick.closest('.week-group').querySelectorAll('.lecture-link')];
        const all = links.every(a => a.classList.contains('picked'));
        links.forEach(a => setPicked(a, !all));
      }
      paintPick();
    });

    function clearPick() {
      pickedLinks().forEach(a => setPicked(a, false));
      paintPick();
    }

    const pickedLinks = () => [...document.querySelectorAll('.lecture-link.picked')];

    function paintPick() {
      const links = pickedLinks();
      document.getElementById('pickbar').classList.toggle('open', !!links.length);
      document.body.classList.toggle('picking', !!links.length);
      document.querySelectorAll('.week-group').forEach(g => {
        const all = [...g.querySelectorAll('.lecture-link')];
        const on = all.length && all.every(a => a.classList.contains('picked'));
        const tick = g.querySelector('.week-head .tick');
        tick.classList.toggle('on', !!on);
        tick.setAttribute('aria-checked', on ? 'true' : 'false');
      });
      if (!links.length) { pickOnly = 'all'; return; }

      const s = standing(links.map(a => a.querySelector('.lecture-stat')));
      const counts = { all: s.total, due: s.due, missed: s.seen - s.right, unseen: s.total - s.seen, flagged: s.flagged };
      if (!counts[pickOnly]) pickOnly = 'all';

      document.getElementById('pickCount').textContent =
        `${links.length} lecture${links.length !== 1 ? 's' : ''}`;
      document.querySelectorAll('#pickOnly button').forEach(b => {
        const key = b.dataset.only;
        b.textContent = `${key} ${counts[key]}`;
        b.disabled = !counts[key];
        b.classList.toggle('on', key === pickOnly && !!counts[key]);
      });
      document.getElementById('pickGo').disabled = !counts[pickOnly];
    }

    document.getElementById('pickOnly').addEventListener('click', e => {
      const b = e.target.closest('button');
      if (!b || b.disabled) return;
      pickOnly = b.dataset.only;
      paintPick();
    });

    function goPick() {
      const links = pickedLinks();
      if (!links.length) return;
      // One lecture is just that lecture, so it shares the lecture's own tests.
      const what = links.length === 1
        ? `block=${links[0].dataset.block}&lecture=${encodeURIComponent(links[0].dataset.file)}`
        : `set=${setOf(links)}`;
      location.href = `quiz.html?${what}` + (pickOnly !== 'all' ? `&only=${pickOnly}` : '');
    }

    // ── Questions by id ──
    // Ids typed or pasted, however they are separated.
    const typedIds = () => [...new Set(document.getElementById('idsInput').value
      .toLowerCase().split(/[^a-z0-9]+/).filter(Boolean))];

    document.getElementById('idsInput').addEventListener('input', () => {
      const none = !typedIds().length;
      document.getElementById('idsGo').disabled = none;
      document.getElementById('idsSend').disabled = none;
    });

    function goIds(e) {
      e.preventDefault();
      const ids = typedIds();
      if (ids.length) location.href = `quiz.html?q=${ids.join(',')}`;
    }

    // ── Inbox ──
    async function paintInbox() {
      const mail = await STORE.inbox(15000);
      const list = document.getElementById('inboxList');
      list.innerHTML = mail.map(m => {
        const day = m.t ? new Date(m.t).toLocaleDateString(undefined, { month: 'short', day: 'numeric' }) : '';
        const ids = m.qids.map(q => String(q).toLowerCase().replace(/[^a-z0-9]/g, '')).filter(Boolean);
        return `<div class="inbox-row">` +
          `<a class="lecture-link" href="quiz.html?q=${ids.join(',')}">` +
            `<span class="lecture-name">${esc(String(m.name || 'someone').toLowerCase())}</span>` +
            `<span class="lecture-stat"><span>${ids.length} q</span><span>${esc(day)}</span></span></a>` +
          `<button class="week-shuffle" type="button" data-drop="${esc(m.id)}">clear</button></div>`;
      }).join('');
      const n = mail.reduce((s, m) => s + m.qids.length, 0);
      document.getElementById('inboxCount').textContent = `${n} q`;
      document.getElementById('inbox').hidden = !mail.length;
    }

    document.getElementById('inboxList').addEventListener('click', async e => {
      const b = e.target.closest('[data-drop]');
      if (!b) return;
      await STORE.dropInbox(b.dataset.drop);
      paintInbox();
    });

    function weekGroup(block, g) {
      const qs = g.items.reduce((s, l) => s + (l.count || 0), 0);
      const shuffle = g.id
        ? `<button class="week-shuffle" title="Shuffle every question in ${esc(g.name)}" onclick="location.href='quiz.html?block=${block.id}&week=${encodeURIComponent(g.id)}'">shuffle</button>`
        : '';
      return `
        <div class="week-group">
          <div class="week-head">
            <button class="tick" type="button" role="checkbox" aria-checked="false" aria-label="Add all of ${esc(g.name)} to a custom set"></button>
            <div class="week-title">
              <span class="week-name">${esc(g.name)}</span>
              ${g.dates ? `<span class="week-dates">${esc(g.dates)}</span>` : ''}
              <span class="week-count"><span>${g.items.length} lecture${g.items.length !== 1 ? 's' : ''}</span><span>${qs} q</span><span class="week-pct"></span></span>
            </div>
            ${shuffle}
          </div>
          <div class="week-lectures">
            ${g.items.map(l => lectureLink(block, l)).join('')}
          </div>
        </div>`;
    }

    async function init() {
      const container = document.getElementById('blocks');
      for (const block of BLOCKS) {
        const [lectures, weeks] = await Promise.all([loadBlock(block), loadWeeks(block)]);
        const total = lectures.reduce((s, l) => s + (l.count || 0), 0);
        // Lectures with no week still get a group, so they can be ticked together.
        const groups = groupByWeek(lectures, weeks);

        const card = document.createElement('div');
        card.className = 'block-card';
        card.innerHTML = `
          <div class="block-row">
            <div class="block-left">
              <div class="block-name">${block.name}</div>
              <div class="block-count">${total} q</div>
              <div class="block-count">${lectures.length} lecture${lectures.length !== 1 ? 's' : ''}</div>
              <div class="block-count block-stat"></div>
            </div>
            <div class="block-actions">
              <button onclick="location.href='quiz.html?block=${block.id}'">Shuffle All</button>
            </div>
          </div>
          <div class="lecture-list">
            ${lectures.length
              ? groups.map(g => weekGroup(block, g)).join('')
              : '<span class="empty-msg">no lectures yet</span>'}
          </div>
        `;
        container.appendChild(card);
      }
    }


    GATE.ready().then(async user => {
      STORE.open(user, GATE.cloud());
      if (user) {
        document.getElementById('who').textContent = user.name;
        const btn = document.getElementById('lockBtn');
        btn.textContent = 'sign out';
        btn.title = `Sign out ${user.email}`;
      }
      if (user) {
        paintInbox();
        SHARE.able().then(ok => { document.getElementById('idsSend').hidden = !ok; });
      }
      await init();
      paintStats();
      // What this device has shows at once; the account's copy fills in after.
      // The tests list comes too: a test deleted elsewhere takes its answers.
      const got = await Promise.all([STORE.pull(null, 15000), STORE.pullTests(15000)]);
      if (got.some(Boolean)) paintStats();
    });
  </script>
</body>
</html>

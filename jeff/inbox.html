<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>jeff — inbox</title>
  <link rel="icon" type="image/x-icon" href="../static/assets/favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Klee+One&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after {
      margin: 0; padding: 0; box-sizing: border-box;
      font-family: "Klee One", cursive;
    }

    body {
      background-color: #eae6f0;
      color: #14111a;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    a { color: inherit; text-decoration: none; }

    .topbar {
      background: #f0ecf8;
      border-bottom: 1px solid #c5bee0;
      display: flex;
      align-items: center;
      padding: 0.7rem 1.5rem;
      position: sticky;
      top: 0;
      z-index: 10;
      gap: 1rem;
      width: 100%;
    }

    .back-link {
      font-size: 0.85rem;
      color: #5c4f7a;
      opacity: 0.7;
      transition: opacity 0.15s;
      white-space: nowrap;
    }
    .back-link:hover { opacity: 1; }

    .topbar-title { font-size: 0.95rem; color: #14111a; }

    .content {
      width: 100%;
      max-width: 720px;
      display: flex;
      flex-direction: column;
      gap: 1.6rem;
      padding: 2rem 1.5rem 4rem;
    }

    /* ── Lists ── */
    section { display: flex; flex-direction: column; gap: 0.3rem; }
    section[hidden] { display: none; }

    h2 {
      display: flex;
      gap: 0.7em;
      font-size: 0.78rem;
      font-weight: 400;
      color: #5c4f7a;
      opacity: 0.7;
      margin-bottom: 0.2rem;
    }
    h2 span:empty { display: none; }

    .list { display: flex; flex-direction: column; gap: 0.3rem; }

    /* A person: a card with their row, and under it the lectures their
       questions are from, with a chip per question: its number in the
       lecture. The ones done since are struck out, and a person with all of
       theirs done is read. */
    .inbox-item {
      padding: 0.4rem 0.4rem 0.5rem;
      background: #f0ecf8;
      border: 1px solid #c5bee0;
      border-radius: 8px;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    .inbox-item:hover { border-color: #5c4f7a; box-shadow: 0 4px 16px rgba(92,79,122,0.1); }
    .inbox-row { display: flex; align-items: center; gap: 0.4rem; }
    .lecture-link {
      flex: 1 1 auto;
      min-width: 0;
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 0.75rem;
      padding: 0.3rem 0.5rem;
      border-radius: 5px;
      background: rgba(92,79,122,0.06);
      font-size: 0.85rem;
      color: #5c4f7a;
      transition: background 0.15s;
    }
    .lecture-link:hover { background: rgba(92,79,122,0.14); }
    .lecture-name { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .lecture-stat { display: inline-flex; gap: 0.7em; flex-shrink: 0; font-size: 0.72rem; opacity: 0.65; white-space: nowrap; }
    .inbox-qs { display: flex; flex-wrap: wrap; align-items: baseline; gap: 0.3rem; margin-top: 0.3rem; padding: 0 0.5rem; }
    .inbox-lec { margin-right: 0.3rem; font-size: 0.76rem; color: #5c4f7a; }
    .inbox-lec:hover { text-decoration: underline; }
    .inbox-week { margin-right: 0.5rem; font-size: 0.72rem; color: #9a9a9a; }
    .inbox-q {
      padding: 0.05rem 0.4rem;
      border: 1px solid #c5bee0;
      border-radius: 4px;
      font-size: 0.68rem;
      color: #5c4f7a;
    }
    .inbox-q:hover { background: rgba(92,79,122,0.14); }
    .inbox-q.done { border-color: #dcdcdc; color: #9a9a9a; text-decoration: line-through; }
    .inbox-q.right { background: #edf7f1; border-color: #2e7d4f; color: #2e7d4f; }
    .inbox-q.wrong { background: #fdf0f0; border-color: #b03030; color: #b03030; }
    .inbox-item.read .lecture-link { background: transparent; color: #9a9a9a; }

    .clear {
      flex-shrink: 0;
      height: 22px;
      padding: 0 9px;
      border: 1px solid #c5bee0;
      border-radius: 5px;
      background: transparent;
      color: #5c4f7a;
      font-size: 0.68rem;
      cursor: pointer;
      transition: background-color 0.15s, border-color 0.15s, color 0.15s;
    }
    .clear:hover { background: #5c4f7a; border-color: #5c4f7a; color: #f0ecf8; }

    .empty-msg { font-size: 0.8rem; opacity: 0.45; font-style: italic; }
    .empty-msg[hidden] { display: none; }
  </style>
</head>
<body>
  <div class="topbar">
    <a class="back-link" href="index.html">← jeff</a>
    <div class="topbar-title">inbox</div>
  </div>

  <div class="content">
    <p class="empty-msg" id="nothing">…</p>

    <section id="inboxSec" hidden><h2><span>inbox</span><span id="inboxCount"></span></h2><div class="list" id="inboxList"></div></section>
    <section id="sentSec" hidden><h2><span>sent</span></h2><div class="list" id="sentList"></div></section>
  </div>

  <script src="firebase-config.js"></script>
  <script src="gate.js"></script>
  <script src="store.js"></script>
  <script>
    const esc = t => String(t).replace(/[&<>"]/g, c =>
      ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);

    // The course calendar for a block, if it has one.
    async function loadWeeks(block) {
      try {
        const r = await fetch(`${block}/weeks.json?t=${Date.now()}`);
        if (!r.ok) return [];
        const d = await r.json();
        return Array.isArray(d.weeks) ? d.weeks : [];
      } catch { return []; }
    }

    let mail = [];        // what is in the inbox
    let sent = [];        // what you sent
    let receipts = [];    // and what became of it
    let located = {};     // short id -> where it is from, and where its history is filed

    // Find the questions named: qids.json says which lecture each is in, the
    // lecture gives its name and the long id attempts are filed under, and
    // the block's weeks say where the lecture falls.
    async function locate(ids) {
      const found = {};
      try {
        const where = await (await fetch(`qids.json?t=${Date.now()}`)).json();
        const files = Object.keys(where).filter(f => where[f].some(id => ids.includes(id)));
        const weeks = {};
        await Promise.all([...new Set(files.map(f => f.split('/')[0]))].map(async b => {
          weeks[b] = await loadWeeks(b);
        }));
        await Promise.all(files.map(async f => {
          const cut = f.indexOf('/'), block = f.slice(0, cut), file = f.slice(cut + 1);
          const data = await (await fetch(f)).json();
          const qs = data.questions.filter(q => q.id);
          const w = weeks[block].findIndex(x => (x.lectures || []).includes(file));
          const lec = {
            key: f, name: data.lecture || file, week: w < 0 ? '' : weeks[block][w].name,
            // Blocks, then weeks, then lectures, as the home page lists them.
            order: [block, w < 0 ? 1e6 : w, w < 0 ? 0 : weeks[block][w].lectures.indexOf(file), file]
          };
          where[f].forEach((id, i) => {
            if (qs[i]) found[id] = { doc: STORE.docId(block, file), id: qs[i].id, n: i + 1, lec };
          });
        }));
      } catch (e) {}
      return found;
    }

    const byOrder = (a, b) => {
      for (let i = 0; i < a.order.length; i++) {
        if (a.order[i] !== b.order[i]) return a.order[i] < b.order[i] ? -1 : 1;
      }
      return 0;
    };

    const idsOf = m => m.qids.map(q => String(q).toLowerCase().replace(/[^a-z0-9]/g, '')).filter(Boolean);

    // Done means answered since it was sent, not at some time before.
    const doneSince = (id, t) => !!located[id] &&
      STORE.attempts(located[id].doc, located[id].id).some(a => a.t >= (t || 0));

    async function load() {
      [mail, sent, receipts] = await Promise.all([STORE.inbox(15000), STORE.sent(15000), STORE.receipts(15000)]);
      located = await locate([...mail.flatMap(idsOf), ...sent.flatMap(idsOf), ...receipts.map(r => r.qid)]);
    }

    function paint() {
      paintMail();
      paintSent();
      document.getElementById('nothing').textContent = 'nothing yet';
      document.getElementById('nothing').hidden = !!(mail.length || sent.length || receipts.length);
    }

    // A person's questions, a line per lecture in the home page's order, each
    // a chip made by `chip(id, itsNumberInTheLecture)`. Ones no longer on the
    // site go last, under their ids.
    function lectureLines(ids, chip) {
      const lecs = [...new Set(ids.map(id => located[id] && located[id].lec).filter(Boolean))].sort(byOrder);
      const lost = ids.filter(id => !located[id]);
      return lecs.map(lec => {
        const mine = ids.filter(id => located[id] && located[id].lec === lec).sort((a, b) => located[a].n - located[b].n);
        return `<div class="inbox-qs"><a class="inbox-lec" href="quiz.html?q=${mine.join(',')}">` +
          `${lec.week ? `<span class="inbox-week">${esc(lec.week)}</span>` : ''}${esc(lec.name)}</a>` +
          `${mine.map(id => chip(id, located[id].n)).join('')}</div>`;
      }).join('') + (lost.length ? `<div class="inbox-qs">${lost.map(id => chip(id, id)).join('')}</div>` : '');
    }

    const dayOf = t => t ? new Date(t).toLocaleDateString(undefined, { month: 'short', day: 'numeric' }).toLowerCase() : '';

    function personRow(name, ids, stat, t, drop) {
      return `<div class="inbox-row">` +
        `<a class="lecture-link" href="quiz.html?q=${ids.join(',')}">` +
          `<span class="lecture-name">${esc(String(name || 'someone').toLowerCase())}</span>` +
          `<span class="lecture-stat">${stat}<span>${esc(dayOf(t))}</span></span></a>` +
        (drop ? `<button class="clear" type="button" data-drop="${esc(drop.join(' '))}">clear</button>` : '') + `</div>`;
    }

    function paintMail() {
      // One card per person, however many times they sent: every question of
      // theirs once, dated by the last time it was sent.
      const from = {};
      mail.forEach(m => {
        const g = from[m.from || m.name] || (from[m.from || m.name] = { name: m.name, t: 0, at: {}, drop: [] });
        g.drop.push(m.id);
        if ((m.t || 0) >= g.t) { g.t = m.t || 0; g.name = m.name; }
        idsOf(m).forEach(id => { g.at[id] = Math.max(g.at[id] || 0, m.t || 0); });
      });
      let left = 0;
      document.getElementById('inboxList').innerHTML = Object.values(from).sort((a, b) => b.t - a.t).map(g => {
        const ids = Object.keys(g.at);
        const done = ids.filter(id => doneSince(id, g.at[id]));
        left += ids.length - done.length;
        return `<div class="inbox-item${done.length === ids.length ? ' read' : ''}">` +
          personRow(g.name, ids, `<span>${done.length}/${ids.length} done</span>`, g.t, g.drop) +
          lectureLines(ids, (id, label) =>
            `<a class="inbox-q${done.includes(id) ? ' done' : ''}" href="quiz.html?q=${id}">${label}</a>`) + `</div>`;
      }).join('');
      document.getElementById('inboxCount').textContent = left ? `${left} q left` : '';
      document.getElementById('inboxSec').hidden = !mail.length;
    }

    // What you sent, a card per person: each question as sent, then opened,
    // then how the first answer went. Sending one again starts it over.
    function paintSent() {
      const to = {};
      const row = (uid, name) => to[uid] || (to[uid] = { name, t: 0, at: {}, of: {} });
      sent.forEach(m => {
        const g = row(m.to, m.name);
        g.t = Math.max(g.t, m.t || 0);
        idsOf(m).forEach(id => { g.at[id] = Math.max(g.at[id] || 0, m.t || 0); });
      });
      receipts.forEach(r => {
        const g = row(r.from, r.name);
        g.of[r.qid] = r;
        g.at[r.qid] = g.at[r.qid] || 0;
        g.t = Math.max(g.t, r.opened || 0, r.done || 0);
        if (r.name) g.name = r.name;
      });
      document.getElementById('sentList').innerHTML = Object.values(to).sort((a, b) => b.t - a.t).map(g => {
        const state = id => {
          const r = g.of[id] || {};
          if ((r.done || 0) >= g.at[id] && r.done) return r.ok ? 'right' : 'wrong';
          return (r.opened || 0) >= g.at[id] && r.opened ? 'opened' : 'sent';
        };
        return `<div class="inbox-item">` + personRow(g.name, Object.keys(g.at), '', g.t) +
          lectureLines(Object.keys(g.at), (id, label) =>
            `<a class="inbox-q ${state(id)}" href="quiz.html?q=${id}">${label} ${state(id)}</a>`) + `</div>`;
      }).join('');
      document.getElementById('sentSec').hidden = !sent.length && !receipts.length;
    }

    document.getElementById('inboxList').addEventListener('click', async e => {
      const b = e.target.closest('[data-drop]');
      if (!b) return;
      const gone = b.dataset.drop.split(' ');
      await Promise.all(gone.map(id => STORE.dropInbox(id)));
      mail = mail.filter(m => !gone.includes(m.id));
      paint();
    });

    GATE.ready().then(async user => {
      STORE.open(user, GATE.cloud());
      await load();
      paint();
      // Done-ness reads answers: this device's show at once, the account's after.
      if (await STORE.pull(null, 15000)) paint();
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>jeff — quiz</title>
  <link rel="icon" type="image/x-icon" href="../static/assets/favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Klee+One&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after {
      margin: 0; padding: 0; box-sizing: border-box;
    }

    /* Topbar keeps Klee One */
    .topbar, .topbar * {
      font-family: "Klee One", cursive;
    }

    /* Everything else: clean system font */
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      background-color: #eae6f0;
      color: #1a1a1a;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    a { color: inherit; text-decoration: none; }

    /* ── Topbar (unchanged) ── */
    .topbar {
      background: #f0ecf8;
      border-bottom: 1px solid #c5bee0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.7rem 1.5rem;
      position: sticky;
      top: 0;
      z-index: 10;
      gap: 1rem;
    }

    .topbar-left { display: flex; align-items: center; gap: 1rem; }

    .back-link {
      font-size: 0.85rem;
      color: #5c4f7a;
      opacity: 0.7;
      transition: opacity 0.15s;
      white-space: nowrap;
    }
    .back-link:hover { opacity: 1; }

    .quiz-title   { font-size: 0.95rem; color: #14111a; }
    .quiz-subtitle { font-size: 0.75rem; color: #5c4f7a; opacity: 0.7; }

    .progress-wrap {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 0.3rem;
      min-width: 160px;
    }

    .progress-label { font-size: 0.75rem; color: #5c4f7a; opacity: 0.7; }

    .progress-bar-bg {
      width: 160px;
      height: 5px;
      background: #c5bee0;
      border-radius: 99px;
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 100%;
      background: #5c4f7a;
      border-radius: 99px;
      transition: width 0.3s ease;
    }

    /* ── Main ── */
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1rem 4rem;
    }

    .state-msg {
      color: #555;
      font-size: 0.95rem;
      text-align: center;
      padding: 4rem 2rem;
    }

    /* ── Card ── */
    .card {
      background: #fff;
      border: 1px solid #d0d0d0;
      border-radius: 6px;
      width: 100%;
      max-width: 820px;
      padding: 1.75rem 2rem;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }

    .q-meta {
      font-size: 0.72rem;
      color: #777;
      letter-spacing: 0.03em;
      text-transform: uppercase;
    }

    /* The question's number on the left; its id and a way to send it on the
       right. */
    .q-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
    }
    .q-tools { display: flex; align-items: center; gap: 0.35rem; }
    .q-tools button {
      height: 22px;
      padding: 0 8px;
      border: 1px solid #d0d0d0;
      border-radius: 5px;
      background: transparent;
      color: #777;
      font-family: inherit;
      font-size: 0.7rem;
      cursor: pointer;
      white-space: nowrap;
    }
    .q-tools button:hover { border-color: #3a6ea8; color: #3a6ea8; }
    .q-tools button[hidden] { display: none; }

    /* Optional 1:30 per question; it only runs once clicked. */
    .q-tools .q-timer { font-variant-numeric: tabular-nums; min-width: 42px; }
    .q-tools .q-timer.running { border-color: #3a6ea8; color: #3a6ea8; }
    .q-tools .q-timer.done { border-color: #b03030; color: #b03030; background: #fdf0f0; }

    /* ── History ──
       Every earlier try at this question, oldest first. */
    .q-history {
      display: flex;
      flex-wrap: wrap;
      gap: 0.3rem;
      margin: 0.5rem 0 0.35rem;
    }
    .q-history:empty { display: none; }

    .try {
      font-size: 0.7rem;
      padding: 0.1rem 0.5rem;
      border-radius: 99px;
      border: 1px solid #c8c8c8;
      white-space: nowrap;
    }
    .try.ok  { border-color: #2e7d4f; background: #edf7f1; color: #2e7d4f; }
    .try.bad { border-color: #b03030; background: #fdf0f0; color: #b03030; }

    /* ── Highlighting ──
       A highlight is a pair of character offsets into the block's plain text,
       stored on the response record. Nothing depends on the live DOM, so a
       highlight survives re-render, back-navigation and a refresh. */
    mark.hl {
      background: #ffee9c;
      color: inherit;
      border-radius: 2px;
      padding: 0.06em 0;
      box-decoration-break: clone;
      -webkit-box-decoration-break: clone;
      cursor: pointer;
    }

    .hl-pop {
      position: absolute;
      display: none;
      gap: 0.2rem;
      z-index: 30;
      background: #2c2733;
      border-radius: 5px;
      padding: 0.22rem;
      box-shadow: 0 3px 12px rgba(0,0,0,0.25);
      transform: translate(-50%, calc(-100% - 7px));
    }
    .hl-pop.visible { display: flex; }
    .hl-pop.below { transform: translate(-50%, 7px); }

    .hl-pop button {
      display: inline-flex;
      align-items: center;
      gap: 0.34rem;
      border: none;
      background: transparent;
      color: #f2eefa;
      font-family: inherit;
      font-size: 0.76rem;
      padding: 0.26rem 0.5rem;
      border-radius: 3px;
      cursor: pointer;
      white-space: nowrap;
    }
    .hl-pop button:hover { background: #453d54; }
    .hl-pop button[hidden] { display: none; }
    .hl-pop .dot {
      width: 10px; height: 10px;
      border-radius: 2px;
      background: #ffee9c;
      flex-shrink: 0;
    }

    .q-text {
      font-size: 0.97rem;
      line-height: 1.75;
      color: #1a1a1a;
    }

    /* ── Lab table ── */
    .lab-table {
      width: auto;
      border-collapse: collapse;
      font-size: 0.82rem;
      margin-top: 0.75rem;
    }
    .lab-table th, .lab-table td {
      padding: 0.3rem 0.85rem;
      border: 1px solid #bbb;
      text-align: left;
      color: #1a1a1a;
    }
    .lab-table th {
      background: #f0f0f0;
      font-weight: 600;
    }
    .lab-table tr:nth-child(even) td { background: #fafafa; }

    /* ── Question images ── */
    .q-figure { margin: 0.75rem 0 0; }
    .q-figure img {
      display: block;
      max-width: 100%;
      max-height: 380px;
      border: 1px solid #ddd;
      border-radius: 3px;
      cursor: zoom-in;
    }
    .q-figure figcaption {
      margin-top: 0.3rem;
      font-size: 0.75rem;
      line-height: 1.45;
      color: #777;
    }

    /* ── Answers ── */
    .answers {
      display: flex;
      flex-direction: column;
      gap: 0.45rem;
    }

    .answer-btn {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      background: #fff;
      border: 1px solid #c8c8c8;
      border-radius: 4px;
      padding: 0.6rem 0.9rem;
      cursor: pointer;
      text-align: left;
      color: #1a1a1a;
      font-size: 0.93rem;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      line-height: 1.5;
      transition: border-color 0.12s, background 0.12s;
      width: 100%;
      position: relative;
    }

    .answer-btn:not(.locked):hover {
      border-color: #888;
      background: #f7f7f7;
    }

    .answer-btn.selected {
      border-color: #3a6ea8;
      background: #edf3fb;
    }

    .answer-btn.correct {
      border-color: #2e7d4f;
      background: #edf7f1;
    }

    .answer-btn.incorrect {
      border-color: #b03030;
      background: #fdf0f0;
    }

    /* Buttons are user-select:none in WebKit — the choice text opts back in
       so it can be highlighted like the stem. */
    .answer-text {
      -webkit-user-select: text;
      user-select: text;
    }

    .answer-btn.struck .answer-text {
      text-decoration: line-through;
      opacity: 0.45;
    }

    .answer-letter {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 26px;
      height: 26px;
      border-radius: 50%;
      background: #e0e0e0;
      color: #333;
      font-size: 0.78rem;
      font-weight: 700;
      flex-shrink: 0;
      transition: background 0.12s, color 0.12s;
    }

    .answer-btn.selected  .answer-letter { background: #3a6ea8; color: #fff; }
    .answer-btn.correct   .answer-letter { background: #2e7d4f; color: #fff; }
    .answer-btn.incorrect .answer-letter { background: #b03030; color: #fff; }

    .strike-hint {
      font-size: 0.68rem;
      color: #aaa;
      margin-left: auto;
      flex-shrink: 0;
      display: none;
    }
    .answer-btn:hover .strike-hint { display: block; }

    /* ── Explanations ── */
    .explanations {
      display: none;
      flex-direction: column;
      gap: 0.4rem;
      border-top: 1px solid #ddd;
      padding-top: 1rem;
    }
    .explanations.visible { display: flex; }

    .exp-title {
      font-size: 0.72rem;
      color: #777;
      text-transform: uppercase;
      letter-spacing: 0.03em;
      margin-bottom: 0.1rem;
    }

    /* The lecture's notes and slides, offered once you have answered. */
    .exp-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      margin-bottom: 0.1rem;
    }
    .exp-head .exp-title { margin-bottom: 0; }
    .exp-links { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 0.3rem; }
    .exp-link {
      font-size: 0.72rem;
      padding: 0.12rem 0.55rem;
      border: 1px solid #c8c8c8;
      border-radius: 99px;
      color: #3a6ea8;
      white-space: nowrap;
      transition: border-color 0.12s, background 0.12s;
    }
    .exp-link:hover { border-color: #3a6ea8; background: #edf3fb; }

    .exp-item {
      display: flex;
      gap: 0.6rem;
      padding: 0.55rem 0.8rem;
      border-radius: 3px;
      font-size: 0.85rem;
      line-height: 1.55;
      background: #f8f8f8;
      border: 1px solid #e0e0e0;
      color: #1a1a1a;
    }

    .exp-item.correct-exp {
      border-color: #2e7d4f;
      background: #edf7f1;
    }

    .exp-letter {
      font-weight: 700;
      min-width: 16px;
      color: #888;
      flex-shrink: 0;
    }
    .exp-item.correct-exp .exp-letter { color: #2e7d4f; }

    /* ── Actions ── */
    .actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.75rem;
      border-top: 1px solid #e0e0e0;
      padding-top: 0.9rem;
    }

    .score-inline { font-size: 0.82rem; color: #555; }
    .score-inline strong { color: #2e7d4f; }

    /* Reset this question — a neutral sibling of the flag, not a call to
       action, so it stays grey until you hover it. */
    .nav-btn.reset-q {
      border-color: #c8c8c8;
      color: #888;
      font-size: 1.15rem;
    }
    .nav-btn.reset-q:not(:disabled):hover {
      border-color: #5c4f7a;
      background: #f3f0fa;
      color: #5c4f7a;
    }
    .nav-btn.reset-q:disabled { border-color: #e2e2e2; color: #cfcfcf; background: transparent; }

    /* Reset the run — sits with the progress it clears. */
    .topbar-right { display: flex; align-items: center; gap: 0.85rem; }

    .topbar-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      height: 28px;
      padding: 0 0.45rem;
      border: 1px solid transparent;
      border-radius: 5px;
      background: none;
      color: #5c4f7a;
      font-family: inherit;
      font-size: 1.05rem;
      line-height: 1;
      opacity: 0.5;
      cursor: pointer;
      transition: opacity 0.15s, background 0.15s, color 0.15s, border-color 0.15s;
    }
    .topbar-btn:not(:disabled):hover { opacity: 1; background: #e4dcf4; }
    .topbar-btn:disabled { opacity: 0.2; cursor: default; }

    /* Armed, it says so — an icon alone is too quiet for something that
       throws the run away. */
    .topbar-btn.armed {
      opacity: 1;
      color: #b03030;
      border-color: #e0b4b4;
      background: #fdf0f0;
    }
    .topbar-btn.armed::after {
      content: 'sure?';
      font-family: "Klee One", cursive;
      font-size: 0.72rem;
    }

    /* Circular nav button */
    .nav-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: 2px solid #3a6ea8;
      background: #3a6ea8;
      color: #fff;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
      line-height: 1;
      padding: 0;
    }
    .nav-btn:disabled {
      border-color: #bbb;
      background: #e0e0e0;
      color: #999;
      cursor: default;
    }
    .nav-btn:not(:disabled):hover { background: #2a5a90; border-color: #2a5a90; }

    /* Secondary (back) nav button */
    .nav-btn.outline { background: transparent; color: #3a6ea8; }
    .nav-btn.outline:not(:disabled):hover { background: #edf3fb; border-color: #3a6ea8; color: #3a6ea8; }
    .nav-btn.outline:disabled { background: transparent; border-color: #d0d0d0; color: #bbb; }

    #submitBtn        { display: inline-flex; }
    #submitBtn.hidden { display: none; }
    #nextBtn          { display: inline-flex; }

    /* Flag-for-review toggle */
    .nav-btn.flag {
      background: transparent;
      border-color: #c98a00;
      color: #c98a00;
      font-size: 1.05rem;
    }
    .nav-btn.flag:not(:disabled):hover { background: #fff7e6; border-color: #c98a00; color: #c98a00; }
    .nav-btn.flag.on { background: #c98a00; border-color: #c98a00; color: #fff; }

    /* ── Question navigator ──
       A persistent rail down the left: every question, always in reach. */
    .layout {
      flex: 1;
      display: flex;
      align-items: flex-start;
      width: 100%;
      min-height: 0;
    }

    .navigator {
      display: none;
      position: sticky;
      top: var(--topbar-h, 58px);
      align-self: flex-start;
      flex: 0 0 150px;
      width: 150px;
      height: calc(100vh - var(--topbar-h, 58px));
      flex-direction: column;
      gap: 0.55rem;
      padding: 0.9rem 0.75rem 1rem;
      background: #f0ecf8;
      border-right: 1px solid #c5bee0;
    }
    .navigator.visible { display: flex; }

    .nav-title {
      font-family: "Klee One", cursive;
      font-size: 0.78rem;
      color: #5c4f7a;
    }

    /* Redo / all — only there while a refinement is open. */
    .nav-scope {
      display: none;
      flex-shrink: 0;
      border: 1px solid #c5bee0;
      border-radius: 5px;
      overflow: hidden;
    }
    .nav-scope.visible { display: flex; }
    .nav-scope button {
      flex: 1 1 0;
      border: none;
      background: transparent;
      color: #5c4f7a;
      font-family: "Klee One", cursive;
      font-size: 0.68rem;
      padding: 0.28rem 0.35rem;
      white-space: nowrap;
      cursor: pointer;
    }
    .nav-scope button.on { background: #5c4f7a; color: #f0ecf8; }

    .nav-counts {
      font-size: 0.66rem;
      line-height: 1.6;
      color: #7b7488;
    }
    .nav-counts b { font-weight: 600; color: #4a4356; }

    .nav-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(30px, 1fr));
      grid-auto-rows: 30px;
      align-content: start;
      gap: 0.28rem;
      flex: 1 1 auto;
      min-height: 0;
      overflow-y: auto;
      padding: 0.15rem 0.15rem 0.15rem 0;
    }

    .nav-legend {
      display: flex;
      flex-direction: column;
      gap: 0.22rem;
      font-size: 0.62rem;
      color: #8a8496;
      border-top: 1px solid #d8d2e8;
      padding-top: 0.5rem;
    }
    .nav-legend span { display: inline-flex; align-items: center; gap: 0.3rem; }
    .nav-legend .flag-key { color: #c98a00; }

    .swatch {
      width: 9px; height: 9px;
      border-radius: 2px;
      border: 1px solid #c8c8c8;
      background: #fff;
      display: inline-block;
      flex-shrink: 0;
    }
    .swatch.correct   { background: #edf7f1; border-color: #2e7d4f; }
    .swatch.incorrect { background: #fdf0f0; border-color: #b03030; }
    .swatch.skipped   { background: #fff7e6; border-color: #c98a00; }

    .qchip {
      position: relative;
      height: 30px;
      border: 1px solid #c8c8c8;
      border-radius: 4px;
      background: #fff;
      color: #555;
      font-size: 0.72rem;
      font-family: inherit;
      cursor: pointer;
      transition: border-color 0.12s, background 0.12s;
    }
    .qchip:hover { border-color: #888; background: #f7f7f7; }
    .qchip.correct   { background: #edf7f1; border-color: #2e7d4f; color: #2e7d4f; }
    .qchip.incorrect { background: #fdf0f0; border-color: #b03030; color: #b03030; }
    .qchip.skipped   { background: #fff7e6; border-color: #c98a00; color: #8a6100; }
    /* Ring only — the border keeps saying correct / incorrect / skipped */
    .qchip.current   { box-shadow: 0 0 0 2px rgba(58,110,168,0.5); }
    .qchip.current:not(.correct):not(.incorrect):not(.skipped) { border-color: #3a6ea8; }
    .qchip.flagged::after {
      content: "\2691";
      position: absolute;
      top: 1px; right: 2px;
      font-size: 0.62rem;
      line-height: 1;
      color: #c98a00;
    }

    /* Narrow screens: the rail lies down across the top and scrolls sideways */
    @media (max-width: 760px) {
      /* The reset button costs the topbar width — take it back off the
         progress bar rather than out of the lecture title. */
      .topbar-right { gap: 0.5rem; }
      .progress-wrap { min-width: 0; }
      .progress-bar-bg { width: 92px; }

      .layout { flex-direction: column; }
      .navigator {
        position: static;
        flex: 0 0 auto;
        width: 100%;
        height: auto;
        flex-direction: row;
        align-items: center;
        gap: 0.75rem;
        padding: 0.55rem 0.9rem;
        border-right: none;
        border-bottom: 1px solid #c5bee0;
      }
      .nav-title { display: none; }
      .nav-counts { flex-shrink: 0; }
      .nav-grid {
        grid-template-columns: none;
        grid-auto-flow: column;
        grid-auto-columns: 30px;
        overflow-x: auto;
        overflow-y: hidden;
      }
      .nav-legend { display: none; }
    }

    /* ── Results ── */
    #results {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 1.75rem;
      padding: 2.5rem 1rem;
      width: 100%;
      max-width: 520px;
      text-align: center;
    }
    #results.visible { display: flex; }

    .results-title { font-size: 1.4rem; color: #1a1a1a; }

    .donut-wrap {
      position: relative;
      width: 148px;
      height: 148px;
    }
    .donut-wrap svg { transform: rotate(-90deg); }

    .donut-label {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .donut-pct { font-size: 1.9rem; color: #1a1a1a; }
    .donut-sub { font-size: 0.72rem; color: #777; margin-top: 0.1rem; }

    .results-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(84px, 1fr));
      gap: 0.6rem;
      width: 100%;
    }

    .res-stat {
      background: #fff;
      border: 1px solid #d0d0d0;
      border-radius: 6px;
      padding: 0.85rem 0.5rem;
    }

    .res-stat .val { font-size: 1.35rem; color: #1a1a1a; }
    .res-stat .lbl { font-size: 0.75rem; color: #777; margin-top: 0.15rem; }
    .val.green { color: #2e7d4f; }
    .val.red   { color: #b03030; }

    .results-actions { display: flex; gap: 0.65rem; flex-wrap: wrap; justify-content: center; }

    .res-btn {
      padding: 0.5rem 1.25rem;
      border-radius: 4px;
      border: 1px solid #3a6ea8;
      background: #3a6ea8;
      color: #fff;
      font-size: 0.88rem;
      cursor: pointer;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      transition: background 0.15s;
    }
    .res-btn:hover { background: #2a5a90; }
    .res-btn.outline { background: transparent; color: #3a6ea8; }
    .res-btn.outline:hover { background: #edf3fb; }

    /* ── Refinement ──
       The chips lift off the navigator rail and get filed into the tray; the
       ones you missed refuse to go, and become the redo. */
    .refine-veil {
      position: fixed; inset: 0; z-index: 200;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 1.5rem; padding: 2rem 1.5rem;
      background: #eae6f0;
      opacity: 0;
      transition: opacity 0.4s ease;
      cursor: pointer;
    }
    .refine-veil.on { opacity: 1; }

    .refine-head {
      font-family: "Klee One", cursive;
      font-size: 0.95rem;
      color: #5c4f7a;
    }

    .refine-grid {
      --chip: 30px;
      display: flex; flex-wrap: wrap;
      justify-content: center; align-content: center;
      gap: 0.28rem;
      width: 100%; max-width: 560px; max-height: 50vh;
      overflow: hidden;
    }

    /* Each cell is a navigator chip, lifted off the rail. */
    .rnum {
      transition: transform 0.55s cubic-bezier(0.45, 0, 0.7, 0.25),
                  opacity 0.55s ease;
      will-change: transform, opacity;
    }
    .rnum > i {
      display: inline-flex; align-items: center; justify-content: center;
      width: var(--chip); height: var(--chip);
      border: 1px solid #c8c8c8; border-radius: 4px;
      background: #fff; color: #555;
      font-size: 0.72rem; font-style: normal;
    }
    .rnum.ok  > i { background: #edf7f1; border-color: #2e7d4f; color: #2e7d4f; }
    .rnum.bad > i { background: #fdf0f0; border-color: #b03030; color: #b03030; }

    .rnum > i.wiggle { animation: rwiggle 1.15s ease-in-out infinite; }
    @keyframes rwiggle {
      0%, 100% { transform: translate(0, 0)     rotate(0deg); }
      25%      { transform: translate(0, -1.5px) rotate(-1.5deg); }
      50%      { transform: translate(0, 1px)    rotate(1deg); }
      75%      { transform: translate(0, -1px)   rotate(1.5deg); }
    }

    /* An open-topped bucket: chips drop in over the rim and the level rises. */
    .refine-bin {
      position: relative;
      width: 128px; height: 84px;
      border: 2px solid #c5bee0;
      border-top: none;
      border-radius: 0 0 16px 16px;
      background: #f0ecf8;
      overflow: hidden;
    }
    .refine-bin::before {
      content: '';
      position: absolute; top: 0; left: -2px; right: -2px;
      height: 4px; border-radius: 2px;
      background: #c5bee0;
    }
    .refine-bin-fill {
      position: absolute; left: 0; right: 0; bottom: 0;
      height: 0%;
      background: #c5bee0;
      transition: height 0.3s ease;
    }
    .refine-bin-label {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.1rem; color: #5c4f7a;
    }

    .refine-note {
      font-size: 0.78rem; color: #5c4f7a; opacity: 0.75;
      min-height: 1em;
    }
  </style>
</head>

<script src="firebase-config.js"></script>
<script src="gate.js"></script>
<script src="store.js"></script>
<script src="share.js"></script>
<script>
  // Files in a block folder that describe it rather than hold questions.
  const MANIFESTS = ['index.json', 'weeks.json', 'gate.json'];

  const params  = new URLSearchParams(location.search);
  const block   = params.get('block') || '';
  const lecture = params.get('lecture') || '';
  const week    = params.get('week') || '';

  // A custom set: lectures picked by hand on the home page, each as
  // block/file-name-without-.json, so a set can reach across blocks.
  const set = (params.get('set') || '').split(',').filter(Boolean).map(s => {
    const cut = s.indexOf('/');
    return cut === -1 ? { block, name: s } : { block: s.slice(0, cut), name: s.slice(cut + 1) };
  });

  // Questions picked one by one, by their short ids, from any lecture. They
  // are played in the order given.
  const ids = [...new Set((params.get('q') || '').toLowerCase().split(/[^a-z0-9]+/).filter(Boolean))];

  // Narrow whatever was asked for by your history with it: 'due' (missed
  // before and back for review), 'missed' (wrong the last time you tried it),
  // 'unseen' (never tried) or 'flagged'.
  const only = ['due', 'missed', 'unseen', 'flagged'].includes(params.get('only')) ? params.get('only') : '';

  let questions = [];   // every question in the lecture, in its own order

  // Which of them are in play, as indices into `questions`, and where we are
  // within that list.
  let view = [], current = 0;

  // A refinement leaves a redo: the questions you missed, cleared to answer
  // again. It narrows the view without dropping anything — the rest of the
  // lecture keeps its answers, and `showAll` widens the view back onto it.
  let redo = null, showAll = false;

  function syncView() {
    view = redo && !showAll ? redo.slice() : questions.map((q, i) => i);
  }

  // The question on screen, by its real index.
  function cur() { return view[current]; }

  // One record per question, kept for the whole session so you can walk back
  // and forward without losing what you picked.
  // { selected, answered, struck, flagged, skipped, highlights }
  // The answer half belongs to this run. The flag and the highlights are the
  // question's marks: they live in the store and outlast any reset.
  let responses = [];

  // True while the results screen is up, so navigation knows to leave it.
  let resultsOpen = false;

  function response(i) {
    if (!responses[i]) responses[i] = { selected: null, answered: false, struck: [], flagged: false, skipped: false, highlights: {} };
    if (!responses[i].highlights) responses[i].highlights = {};
    return responses[i];
  }

  // ── Session persistence ──
  // The run is saved through the store: on this device at once, and to the
  // signed-in account, so a refresh, a new tab, or another device tomorrow all
  // resume where you left off. One saved run per quiz.
  // What this page was asked for, as a key. Every test of the same thing
  // shares it; RUN_KEY is the one test being played, settled once loaded.
  const SCOPE = STORE.runId(block || 'mixed',
    (lecture ? lecture.replace(/\.json$/, '')
      : set.length ? 'set-' + hash(set.map(s => s.block + '/' + s.name).sort().join(','))
      : ids.length ? 'q-' + hash(ids.slice().sort().join(','))
      : week ? 'week-' + week
      : 'all') + (only ? '-' + only : ''));

  let RUN_KEY = SCOPE;
  let started = Date.now();

  // The query that reopens this scope, kept on the test so the history page
  // can link back to it.
  const SCOPE_QUERY = ['block', 'lecture', 'set', 'week', 'q', 'only']
    .filter(k => params.get(k))
    .map(k => `${k}=${encodeURIComponent(params.get(k))}`).join('&');

  // Carry on with the test named in the URL, else the unfinished one for this
  // scope, else begin a new one. A run saved before tests were kept apart
  // lives under the scope's own key and is picked up as it is.
  async function settleTest() {
    await STORE.pullTests(PATIENCE);
    const asked = params.get('test');
    if (asked) RUN_KEY = asked.replace(/[^\w-]/g, '_');
    else {
      const open = STORE.openTest(SCOPE);
      if (open) RUN_KEY = open;
      else if (!STORE.test(SCOPE)) {
        await STORE.pullRun(SCOPE, PATIENCE);
        RUN_KEY = STORE.readRun(SCOPE) ? SCOPE : newTestId();
      } else RUN_KEY = newTestId();
    }
    await STORE.pullRun(RUN_KEY, PATIENCE);
    const line = STORE.test(RUN_KEY);
    if (line && line.started) started = line.started;
  }

  const newTestId = () => `${SCOPE}-${Date.now().toString(36)}`;

  // How long to wait on the account. Starting without it would deal a test
  // begun on another device a fresh shuffle and then save that over it, so
  // this is long; with no connection at all it is known at once and not
  // waited for.
  let PATIENCE = 20000;

  // Short and stable — only there to tell one custom set's run from another's.
  function hash(text) {
    let h = 5381;
    for (let i = 0; i < text.length; i++) h = ((h * 33) ^ text.charCodeAt(i)) >>> 0;
    return h.toString(36);
  }

  function qKey(q) {
    return q.id || `${q._lecture || lecture || block}|${(q.question || '').slice(0, 120)}`;
  }

  // A question's short id: its long one, hashed and stirred so neighbours do
  // not look alike. build_index.py computes the same for qids.json.
  function qidOf(q) {
    let h = parseInt(hash(q.id || ''), 36);
    h = Math.imul(h ^ (h >>> 16), 0x45d9f3b) >>> 0;
    return ((h ^ (h >>> 16)) >>> 0).toString(36);
  }

  // The store document a question's history and marks are filed in.
  function docOf(q) { return STORE.docId(q._block || block, q._file); }

  function saveSession() {
    const byKey = {};
    responses.forEach((r, i) => {
      if (touched(r)) byKey[qKey(questions[i])] =
        { selected: r.selected, answered: r.answered, struck: r.struck, skipped: r.skipped };
    });
    // A test nobody has touched isn't worth keeping; one that has been is
    // kept from then on, even reset back to blank.
    if (!Object.keys(byKey).length && !STORE.test(RUN_KEY)) return;

    let right = 0, wrong = 0;
    responses.forEach((r, i) => {
      if (r && r.answered) r.selected === questions[i].correct ? right++ : wrong++;
    });
    STORE.saveRun(RUN_KEY, {
      v: 2,
      current,
      all: showAll,
      order: questions.map(qKey),
      redo: redo && redo.map(i => qKey(questions[i])),
      responses: byKey
    }, {
      scope: SCOPE,
      q: SCOPE_QUERY,
      where: document.getElementById('topTitle').textContent,
      label: document.getElementById('topSubtitle').textContent,
      n: questions.length,
      right,
      wrong,
      done: right + wrong === questions.length,
      started
    });
  }

  function saveMark(i) {
    const r = response(i);
    STORE.setMark(docOf(questions[i]), qKey(questions[i]), r.flagged, r.highlights);
  }

  function readSession() {
    const saved = STORE.readRun(RUN_KEY);
    return saved && saved.v === 2 && Array.isArray(saved.order) ? saved : importOldSession();
  }

  // Runs saved before there was a history kept one answer per question and
  // nothing else. Bring one forward: its answers become undated attempts, its
  // flags and highlights become marks, and the run itself carries on.
  function importOldSession() {
    const oldKey = `jeff-quiz:${block}:${lecture || (week ? 'week-' + week : '*')}`;
    let old = null;
    if (set.length || ids.length || only || params.get('test')) return null;   // none of these existed then
    try { old = JSON.parse(localStorage.getItem(oldKey) || 'null'); } catch (e) {}
    if (!old || old.v !== 1 || !Array.isArray(old.order)) return null;

    const byKey = new Map(questions.map(q => [qKey(q), q]));
    Object.entries(old.responses || {}).forEach(([key, r]) => {
      const q = byKey.get(key);
      if (!q || !r) return;
      if (r.answered && r.selected) STORE.addAttempt(docOf(q), key, r.selected, r.selected === q.correct, 0);
      if (r.flagged || (r.highlights && Object.keys(r.highlights).length)) {
        STORE.setMark(docOf(q), key, r.flagged, r.highlights);
      }
    });
    try { localStorage.removeItem(oldKey); } catch (e) {}

    return {
      v: 2,
      current: old.current,
      all: false,
      order: old.order,
      redo: old.subset && Array.isArray(old.view) ? old.view : null,
      responses: old.responses || {}
    };
  }

  // Put the questions back in their saved order and reattach the saved answers.
  // Questions added to the block since the session started are kept at the end
  // rather than throwing the whole session away.
  function restoreSession() {
    const saved = readSession();
    if (!saved) return false;

    const pos = new Map(saved.order.map((k, i) => [k, i]));
    const known = [], fresh = [];
    questions.forEach(q => (pos.has(qKey(q)) ? known : fresh).push(q));
    if (!known.length) return false;

    known.sort((a, b) => pos.get(qKey(a)) - pos.get(qKey(b)));
    questions = known.concat(fresh);

    responses = questions.map(q => {
      const r = saved.responses && saved.responses[qKey(q)];
      if (!r) return null;
      return {
        selected: r.selected || null,
        answered: !!r.answered,
        struck: Array.isArray(r.struck) ? r.struck : [],
        flagged: false,
        skipped: !!r.skipped,
        highlights: {}
      };
    });

    // A redo replays exactly what it kept; anything else plays the whole
    // lecture, absorbing questions added since it started.
    const at = new Map(questions.map((q, i) => [qKey(q), i]));
    redo = Array.isArray(saved.redo)
      ? saved.redo.map(k => at.get(k)).filter(i => i !== undefined)
      : null;
    if (redo && !redo.length) redo = null;
    showAll = !!(redo && saved.all);
    syncView();

    current = Math.min(Math.max(parseInt(saved.current, 10) || 0, 0), view.length);

    // If the pass had finished but new questions showed up, resume on the
    // first one still unanswered instead of dropping straight to results.
    if (current >= view.length) {
      const firstOpen = view.findIndex(i => !responses[i] || !responses[i].answered);
      if (firstOpen !== -1) current = firstOpen;
    }
    return true;
  }

  // Lay each question's flag and highlights over its record.
  function applyMarks() {
    questions.forEach((q, i) => {
      const m = STORE.mark(docOf(q), qKey(q));
      if (!m) return;
      const r = response(i);
      r.flagged = m.flagged;
      r.highlights = m.highlights;
    });
  }

  function tally() {
    let correct = 0, wrong = 0, flagged = 0, skipped = 0;
    view.forEach(i => {
      const r = responses[i];
      if (!r) return;
      if (r.flagged) flagged++;
      if (r.answered) r.selected === questions[i].correct ? correct++ : wrong++;
      else if (r.skipped) skipped++;
    });
    return { correct, wrong, total: correct + wrong, flagged, skipped };
  }

  const blockNames = { neuro: 'Neurology', endorepro: 'Endo / Repro', msk: 'MSK' };

  async function load() {
    if (!block && !set.length && !ids.length) { show('no block specified.'); return; }
    const title = from => {
      document.getElementById('topTitle').textContent =
        from.length === 1 ? (blockNames[from[0]] || from[0]) : 'Mixed';
    };
    title(block ? [block] : [...new Set(set.map(s => s.block))]);

    try {
      if (lecture) {
        const r = await fetch(`${block}/${lecture}?t=${Date.now()}`);
        if (!r.ok) throw new Error('not found');
        const data = await r.json();
        questions = (data.questions || []).map(q => ({ ...q, _file: lecture }));
        document.getElementById('topSubtitle').textContent = data.lecture || lecture;
      } else {
        let files, label;
        const here = name => ({ block, name });

        if (ids.length) {
          // qids.json says which lecture each short id is in.
          const qr = await fetch(`qids.json?t=${Date.now()}`);
          if (!qr.ok) throw new Error('no question ids to look up');
          const where = await qr.json();
          files = Object.keys(where).filter(f => where[f].some(id => ids.includes(id))).map(f => {
            const cut = f.indexOf('/');
            return { block: f.slice(0, cut), name: f.slice(cut + 1) };
          });
          title([...new Set(files.map(f => f.block))]);
        } else if (set.length) {
          files = set.map(s => ({ block: s.block, name: s.name + '.json' }));
          label = `${files.length} lecture${files.length !== 1 ? 's' : ''}, shuffled`;
        } else if (week) {
          // A week names its own lectures.
          const wr = await fetch(`${block}/weeks.json?t=${Date.now()}`);
          if (!wr.ok) throw new Error('this block has no weeks');
          const wd = await wr.json();
          const w = (wd.weeks || []).find(x => String(x.id) === week);
          if (!w) throw new Error(`no week "${week}" in this block`);
          files = (w.lectures || []).map(here);
          label = `${w.name}${w.dates ? ', ' + w.dates : ''}, shuffled`;
        } else {
          files = (await listBlock()).map(here);
          label = 'all lectures, shuffled';
        }

        if (!files.length) { show(ids.length ? 'no questions with those ids.' : `no questions in this ${week ? 'week' : 'block'} yet.`); return; }
        const all = await Promise.all(files.map(async f => {
          const r = await fetch(`${f.block}/${f.name}?t=${Date.now()}`);
          if (!r.ok) return [];
          const d = await r.json();
          return (d.questions || []).map(q => ({ ...q, _lecture: d.lecture, _file: f.name, _block: f.block }));
        }));
        questions = all.flat();
        if (ids.length) {
          const at = new Map(ids.map((id, i) => [id, i]));
          questions = questions.filter(q => at.has(qidOf(q))).sort((a, b) => at.get(qidOf(a)) - at.get(qidOf(b)));
          label = `${questions.length} question${questions.length !== 1 ? 's' : ''} by id`;
        }
        document.getElementById('topSubtitle').textContent = label;
      }
      if (only) document.getElementById('topSubtitle').textContent += ', ' + only;
    } catch(e) {
      show('failed to load questions: ' + e.message); return;
    }

    if (!questions.length) { show('no questions found.'); return; }

    // Catch up with the account before deciding where to resume. With no
    // connection the test on this device is used as it is.
    if (await STORE.online(PATIENCE) === false) PATIENCE = 0;
    await Promise.all([
      STORE.pull([...new Set(questions.map(docOf))], PATIENCE),
      settleTest(),
      loadPdfs([...new Set(questions.map(q => q._block || block))])
    ]);

    // A test this account is known to have, whose answers could not be
    // fetched, is not one to start over.
    if (STORE.test(RUN_KEY) && !readSession()) {
      show("couldn't load this test. check your connection and reload.");
      return;
    }

    // A narrowed test, or one opened from the history page, is a snapshot: it
    // keeps exactly the questions it started with, even ones you have since
    // got right or that were added later. A new narrowed test takes a fresh
    // cut of your history.
    if (only || params.get('test')) {
      const saved = readSession();
      if (saved) {
        const kept = new Set(saved.order);
        questions = questions.filter(q => kept.has(qKey(q)));
      } else if (only) {
        questions = questions.filter(wanted);
      }
      if (!questions.length) { show(only ? `nothing ${only} here.` : 'that test is gone.'); return; }
    }

    const resumed = restoreSession();
    if (!resumed) {
      if (!lecture && !ids.length) shuffle(questions);
      syncView();
    }
    applyMarks();

    document.getElementById('stateMsg').style.display = 'none';
    syncTopbarHeight();

    // A session that had already finished comes back on the results screen
    if (resumed && current >= view.length) { showResults(); return; }

    document.getElementById('quizCard').style.display = 'flex';
    render();
  }

  function show(msg) { document.getElementById('stateMsg').textContent = msg; }

  // Whether a question belongs in an `only` run.
  function wanted(q) {
    if (only === 'flagged') {
      const m = STORE.mark(docOf(q), qKey(q));
      return !!(m && m.flagged);
    }
    const tries = STORE.attempts(docOf(q), qKey(q));
    if (only === 'due') return STORE.due(tries);
    return only === 'unseen' ? !tries.length : !!tries.length && !tries[tries.length - 1].ok;
  }

  // Each lecture's notes and slides, as its block's index.json lists them
  // (build_index.py matches them up from the names in /pdfs).
  const lecturePdfs = {};   // 'block/file.json' -> [{ label, file }]

  async function loadPdfs(blocks) {
    await Promise.all(blocks.map(async b => {
      try {
        const r = await fetch(`${b}/index.json?t=${Date.now()}`);
        if (!r.ok) return;
        ((await r.json()).lectures || []).forEach(l => {
          if (l.pdfs) lecturePdfs[`${b}/${l.file}`] = l.pdfs;
        });
      } catch (e) { /* no links, nothing else lost */ }
    }));
  }

  // The block's lecture files, from its index.json. The GitHub API is only a
  // fallback: it is rate-limited per IP, which a shared network runs through.
  async function listBlock() {
    try {
      const r = await fetch(`${block}/index.json?t=${Date.now()}`);
      if (r.ok) return ((await r.json()).lectures || []).map(l => l.file);
    } catch (e) { /* fall through */ }
    const apiUrl = `https://api.github.com/repos/bananasrlowkeygood/bananasrlowkeygood.github.io/contents/jeff/${block}`;
    const dirRes = await fetch(apiUrl);
    if (!dirRes.ok) throw new Error('could not list block');
    const entries = await dirRes.json();
    return entries.filter(e => e.type === 'file' && e.name.endsWith('.json') && !MANIFESTS.includes(e.name)).map(e => e.name);
  }

  function shuffle(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
  }

  function renderTable(rows) {
    if (!rows || !rows.length) return '';
    const head = rows[0];
    const body = rows.slice(1);
    const ths = head.map(h => `<th>${h}</th>`).join('');
    const trs = body.map(r => `<tr>${r.map(c => `<td>${c}</td>`).join('')}</tr>`).join('');
    return `<table class="lab-table"><thead><tr>${ths}</tr></thead><tbody>${trs}</tbody></table>`;
  }

  // A question may carry an image: "image" sits under the stem, "explanationImage"
  // under the explanations. Either is a path relative to the lecture's block
  // folder (or a full URL), or { src, caption, credit }.
  function renderFigure(img, q) {
    if (typeof img === 'string') img = { src: img };
    if (!img || !img.src) return null;
    const src = /^(https?:)?\/\//.test(img.src) ? img.src
              : `${q._block || block}/${img.src.replace(/^\.?\//, '')}`;
    const fig = document.createElement('figure');
    fig.className = 'q-figure';
    const a = document.createElement('a');
    a.href = src;
    a.target = '_blank';
    a.rel = 'noopener';
    const el = document.createElement('img');
    el.src = src;
    el.alt = img.alt || img.caption || '';
    el.loading = 'lazy';
    a.appendChild(el);
    fig.appendChild(a);
    const note = [img.caption, img.credit].filter(Boolean).join(', ');
    if (note) {
      const cap = document.createElement('figcaption');
      cap.textContent = note;
      fig.appendChild(cap);
    }
    return fig;
  }

  function parseMarkdownTable(text) {
    const lines = text.split('\n');
    const tableLines = [];
    let inTable = false;
    const remaining = [];
    for (const line of lines) {
      if (/^\|/.test(line.trim())) {
        inTable = true;
        if (!/^[\|\s\-:]+$/.test(line)) {
          tableLines.push(line.trim().replace(/^\||\|$/g, '').split('|').map(c => c.trim()));
        }
      } else {
        inTable = false;
        remaining.push(line);
      }
    }
    return { tableRows: tableLines, rest: remaining.join('\n').trim() };
  }


  // ── Highlighting ──
  // Highlightable blocks (the stem, each explanation) are painted from their
  // plain source text plus a sorted, non-overlapping list of [start, end]
  // character offsets. Selections are converted back to offsets the same way,
  // so highlights never depend on the DOM that happens to be on screen.
  const hlPop = document.getElementById('hlPop');
  const hlAdd = document.getElementById('hlAdd');
  const hlDel = document.getElementById('hlDel');

  let hlSources = {};   // block key -> plain text of the block, this question
  let hlPending = null; // { key, start, end, fromClick } the popup will act on
  let hlTimer   = null;

  function highlightsOf(i) { return response(i).highlights; }

  function esc(t) {
    return t.replace(/[&<>]/g, c => (c === '&' ? '&amp;' : c === '<' ? '&lt;' : '&gt;'));
  }

  // Paint `text` into `el`, wrapping the stored ranges in <mark>. Ranges are
  // clamped to the text so an edited question degrades instead of breaking.
  function paint(el, text, key) {
    hlSources[key] = text;
    el.dataset.hlKey = key;

    const ranges = (highlightsOf(cur())[key] || [])
      .map(([a, b]) => [Math.min(a, text.length), Math.min(b, text.length)])
      .filter(([a, b]) => b > a);

    if (!ranges.length) { el.textContent = text; return; }

    let html = '', pos = 0;
    ranges.forEach(([a, b]) => {
      if (a > pos) html += esc(text.slice(pos, a));
      html += '<mark class="hl" data-r="' + a + ',' + b + '">' + esc(text.slice(a, b)) + '</mark>';
      pos = Math.max(pos, b);
    });
    html += esc(text.slice(pos));
    el.innerHTML = html;
  }

  function repaint(key) {
    const el = document.querySelector('[data-hl-key="' + key + '"]');
    if (el && hlSources[key] != null) paint(el, hlSources[key], key);
  }

  function mergeRanges(list) {
    const out = [];
    list.slice().sort((x, y) => x[0] - y[0]).forEach(([a, b]) => {
      const last = out[out.length - 1];
      if (last && a <= last[1]) last[1] = Math.max(last[1], b);
      else out.push([a, b]);
    });
    return out;
  }

  function subtractRange(list, start, end) {
    const out = [];
    list.forEach(([a, b]) => {
      if (b <= start || a >= end) { out.push([a, b]); return; }
      if (a < start) out.push([a, start]);
      if (b > end)   out.push([end, b]);
    });
    return out;
  }

  function overlaps(key, start, end) {
    return (highlightsOf(cur())[key] || []).some(([a, b]) => a < end && b > start);
  }

  function hlBlock(node) {
    const el = node && (node.nodeType === 3 ? node.parentElement : node);
    return el && el.closest ? el.closest('[data-hl-key]') : null;
  }

  // Character offset of (node, offset) within a block, counting only text.
  function offsetIn(block, node, offset) {
    const walk = document.createTreeWalker(block, NodeFilter.SHOW_TEXT);
    let n, total = 0;
    while ((n = walk.nextNode())) {
      if (n === node) return total + offset;
      total += n.nodeValue.length;
    }
    return total;
  }

  // The live selection as block-relative offsets, or null when it is collapsed
  // or touches no highlightable block at all.
  //
  // A drag rarely stops neatly at a block's edge — it starts on an answer's
  // letter circle, or runs off the end of the stem into the choices below. So
  // the rule is: take the first highlightable block the selection touches, and
  // highlight the part of the selection that lands inside it.
  function selectionRange() {
    const sel = window.getSelection();
    if (!sel || sel.isCollapsed || !sel.rangeCount) return null;

    const range = sel.getRangeAt(0);
    const block = hlBlock(range.startContainer) || hlBlock(range.endContainer);
    if (!block) return null;

    const key  = block.dataset.hlKey;
    const text = hlSources[key];
    if (text == null) return null;

    let start = block.contains(range.startContainer)
      ? offsetIn(block, range.startContainer, range.startOffset) : 0;
    let end = block.contains(range.endContainer)
      ? offsetIn(block, range.endContainer, range.endOffset) : text.length;
    if (end < start) { const t = start; start = end; end = t; }

    // Trailing whitespace picked up by a drag shouldn't get a yellow tail.
    while (start < end && /\s/.test(text[start]))  start++;
    while (end > start && /\s/.test(text[end - 1])) end--;

    return end > start ? { key, start, end } : null;
  }

  function hidePop() {
    hlPop.classList.remove('visible');
    hlPending = null;
  }

  function showPop(rect, canAdd, canDel) {
    hlAdd.hidden = !canAdd;
    hlDel.hidden = !canDel;
    const below = rect.top < 52;
    hlPop.classList.toggle('below', below);
    hlPop.style.left = Math.round(rect.left + rect.width / 2 + window.scrollX) + 'px';
    hlPop.style.top  = Math.round((below ? rect.bottom : rect.top) + window.scrollY) + 'px';
    hlPop.classList.add('visible');
  }

  function syncPop() {
    const sel = selectionRange();
    if (!sel) {
      if (!(hlPending && hlPending.fromClick)) hidePop();
      return;
    }
    hlPending = sel;
    showPop(window.getSelection().getRangeAt(0).getBoundingClientRect(),
            true, overlaps(sel.key, sel.start, sel.end));
  }

  function applyHighlight(sel, remove) {
    const store = highlightsOf(cur());
    const had   = store[sel.key] || [];
    const next  = remove ? subtractRange(had, sel.start, sel.end)
                         : mergeRanges(had.concat([[sel.start, sel.end]]));
    if (next.length) store[sel.key] = next;
    else delete store[sel.key];

    repaint(sel.key);
    const live = window.getSelection();
    if (live) live.removeAllRanges();
    hidePop();
    saveMark(cur());
  }

  hlPop.addEventListener('mousedown', e => e.preventDefault()); // keep the selection
  hlAdd.onclick = () => { if (hlPending) applyHighlight(hlPending, false); };
  hlDel.onclick = () => { if (hlPending) applyHighlight(hlPending, true); };

  document.addEventListener('selectionchange', () => {
    clearTimeout(hlTimer);
    hlTimer = setTimeout(syncPop, 80);
  });

  document.addEventListener('mousedown', e => {
    if (!hlPop.contains(e.target)) hidePop();
  });

  // A plain click on a highlight offers to take just that one off.
  document.addEventListener('click', e => {
    const mark = e.target.closest && e.target.closest('mark.hl');
    if (!mark) return;
    const sel = window.getSelection();
    if (sel && !sel.isCollapsed) return;

    const block = hlBlock(mark);
    const [a, b] = (mark.dataset.r || '').split(',').map(Number);
    if (!block || !isFinite(a) || !isFinite(b)) return;

    hlPending = { key: block.dataset.hlKey, start: a, end: b, fromClick: true };
    showPop(mark.getBoundingClientRect(), false, true);
  });

  window.addEventListener('scroll', hidePop, { passive: true });
  window.addEventListener('resize', hidePop);

  // ── Receipts ──
  // The questions someone sent you: short id -> { whoSentIt: when }. Opening
  // one, and the first answer to it since it was sent, is reported back.
  let sentBy = null;
  let shown = false;
  const told = new Set();

  async function watchInbox() {
    const mail = await STORE.inbox(15000);
    sentBy = {};
    mail.forEach(m => m.from && m.qids.forEach(id => {
      const by = sentBy[id] || (sentBy[id] = {});
      by[m.from] = Math.max(by[m.from] || 0, m.t || 0);
    }));
    tellOpened();
  }

  function tellOpened() {
    if (!sentBy || !shown) return;
    const id = qidOf(questions[cur()]);
    Object.keys(sentBy[id] || {}).forEach(from => {
      if (told.has(`${from} ${id}`)) return;
      told.add(`${from} ${id}`);
      STORE.receipt(from, id, { opened: Date.now() });
    });
  }

  // Call before the answer is filed, so an earlier one can be told apart.
  function tellDone(q, ok) {
    const by = (sentBy || {})[qidOf(q)] || {};
    const before = STORE.attempts(docOf(q), qKey(q));
    Object.keys(by).forEach(from => {
      if (!before.some(a => a.t >= by[from])) STORE.receipt(from, qidOf(q), { done: Date.now(), ok });
    });
  }

  function render() {
    const q = questions[cur()];
    const resp = response(cur());
    shown = true;
    tellOpened();
    resetTimer();

    document.getElementById('qMeta').textContent = `question ${cur() + 1} of ${questions.length}`;
    const idBtn = document.getElementById('qIdBtn');
    clearTimeout(idBtn._flash);
    idBtn.textContent = idBtn.dataset.label = qidOf(q);

    hidePop();
    hlSources = {};

    const qTextEl = document.getElementById('qText');
    qTextEl.innerHTML = '';

    const { tableRows, rest } = parseMarkdownTable(q.question);
    const questionText = tableRows.length ? rest : q.question;

    // Question text first
    const p = document.createElement('p');
    p.style.cssText = 'line-height:1.75;white-space:pre-wrap;';
    paint(p, questionText, 'q');
    qTextEl.appendChild(p);

    // Table below (structured field takes priority, then markdown). Appended as
    // its own node so building it can't re-parse the highlighted stem.
    const tableHtml = q.table ? renderTable(q.table)
                    : tableRows.length ? renderTable(tableRows) : '';
    if (tableHtml) {
      const wrap = document.createElement('div');
      wrap.innerHTML = tableHtml;
      qTextEl.appendChild(wrap);
    }

    const fig = renderFigure(q.image, q);
    if (fig) qTextEl.appendChild(fig);

    const answersEl = document.getElementById('answers');
    answersEl.innerHTML = '';
    Object.entries(q.answers).forEach(([letter, text]) => {
      const btn = document.createElement('button');
      btn.className = 'answer-btn';
      btn.dataset.letter = letter;

      const tag = document.createElement('span');
      tag.className = 'answer-letter';
      tag.textContent = letter;

      const body = document.createElement('span');
      body.className = 'answer-text';
      paint(body, text, 'ans:' + letter);

      const hint = document.createElement('span');
      hint.className = 'strike-hint';
      hint.textContent = 'right-click to strike';

      btn.appendChild(tag);
      btn.appendChild(body);
      btn.appendChild(hint);
      btn.classList.toggle('struck', resp.struck.includes(letter));

      // Dragging across the words is a highlight gesture, not a pick — so is
      // the second click of a double-click. Anything else picks the choice.
      btn.onclick = (e) => {
        if (e.detail >= 2) return;
        const sel = window.getSelection();
        if (sel && !sel.isCollapsed && btn.contains(sel.anchorNode)) return;
        selectAnswer(letter);
      };
      btn.oncontextmenu = (e) => {
        e.preventDefault();
        if (response(cur()).answered) return;
        btn.classList.toggle('struck');
        const s = resp.struck.filter(l => l !== letter);
        if (btn.classList.contains('struck')) s.push(letter);
        resp.struck = s;
        saveSession();
      };
      answersEl.appendChild(btn);
    });

    document.getElementById('explanations').classList.remove('visible');
    document.getElementById('expItems').innerHTML = '';

    // Restore whatever this question already had this session
    if (resp.answered) {
      reveal();
    } else if (resp.selected) {
      document.querySelectorAll('.answer-btn').forEach(btn =>
        btn.classList.toggle('selected', btn.dataset.letter === resp.selected));
    }

    renderHistory();
    updateActionButtons();
    updateScore();
    updateProgress();
    renderNavigator();
    saveSession();
  }

  // ── Timer ──
  // Each question gets 1:30, counted only if you click the card. Click again
  // to pause; once it runs out, a click sets it back to 1:30.
  const TIMER_MS = 90 * 1000;
  const timer = { left: TIMER_MS, end: 0, tick: 0 };

  function paintTimer() {
    const el = document.getElementById('qTimer');
    const s = Math.ceil(timer.left / 1000);
    el.textContent = `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
    el.classList.toggle('running', !!timer.tick);
    el.classList.toggle('done', timer.left <= 0);
    el.title = timer.left <= 0 ? 'Reset the timer'
             : timer.tick ? 'Pause the timer' : 'Start a 1:30 timer';
  }

  function stopTimer() {
    if (timer.tick) timer.left = Math.max(timer.end - Date.now(), 0);
    clearInterval(timer.tick);
    timer.tick = 0;
  }

  function resetTimer() {
    clearInterval(timer.tick);
    timer.tick = 0;
    timer.left = TIMER_MS;
    paintTimer();
  }

  function toggleTimer() {
    if (timer.left <= 0) { resetTimer(); return; }
    if (timer.tick) { stopTimer(); paintTimer(); return; }
    timer.end = Date.now() + timer.left;
    timer.tick = setInterval(() => {
      timer.left = Math.max(timer.end - Date.now(), 0);
      if (timer.left <= 0) stopTimer();
      paintTimer();
    }, 200);
    paintTimer();
  }

  // ── The question's id ──
  function copyId() {
    const btn = document.getElementById('qIdBtn');
    const id = qidOf(questions[cur()]);
    const done = () => SHARE.flash(btn, 'copied');
    if (navigator.clipboard) navigator.clipboard.writeText(id).then(done, () => {});
  }

  function sendQuestion() {
    SHARE.pick(document.getElementById('qSendBtn'), [qidOf(questions[cur()])]);
  }

  // ── History ──
  // Every earlier try at this question, dated. Whether each was right shows
  // from the start; what was picked waits until this try is answered, so the
  // history can't give the question away.
  function when(t) {
    if (!t) return 'earlier';
    const d = new Date(t);
    const opts = { month: 'short', day: 'numeric' };
    if (d.getFullYear() !== new Date().getFullYear()) opts.year = 'numeric';
    return d.toLocaleDateString(undefined, opts);
  }

  function renderHistory() {
    const q = questions[cur()];
    const open = response(cur()).answered;
    const el = document.getElementById('qHistory');
    el.innerHTML = '';
    STORE.attempts(docOf(q), qKey(q)).forEach(a => {
      const chip = document.createElement('span');
      chip.className = 'try ' + (a.ok ? 'ok' : 'bad');
      chip.textContent = when(a.t) + ' ';
      if (open) {
        const pick = document.createElement('b');
        pick.textContent = a.p + ' ';
        chip.appendChild(pick);
      }
      chip.appendChild(document.createTextNode(a.ok ? '\u2713' : '\u2717'));
      if (a.t) chip.title = new Date(a.t).toLocaleString();
      el.appendChild(chip);
    });
  }

  // ── Resets ──
  // Put a question, or the whole pass, back to untouched. Only the answer
  // goes: highlights and the flag are notes you made, and the attempt stays in
  // the question's history.
  function clearAnswer(i) {
    const r = responses[i];
    if (!r) return;
    r.selected = null;
    r.answered = false;
    r.skipped  = false;
    r.struck   = [];
  }

  function resetQuestion() {
    if (resultsOpen || !view.length) return;
    if (!touched(responses[cur()])) return;
    clearAnswer(cur());
    render();
  }

  // Replays whatever is in play — the whole lecture, or the redo if you are
  // part-way through a refinement — with every answer cleared.
  let resetArmed = null;

  function resetTest() {
    if (resultsOpen || !view.length) return;
    const btn = document.getElementById('resetTestBtn');
    if (!resetArmed) {                       // ask once; it throws work away
      btn.classList.add('armed');
      btn.title = 'Click again to clear every answer in this test';
      resetArmed = setTimeout(disarmReset, 3000);
      return;
    }
    disarmReset();
    view.forEach(clearAnswer);
    replay();
  }

  function disarmReset() {
    if (resetArmed) { clearTimeout(resetArmed); resetArmed = null; }
    const btn = document.getElementById('resetTestBtn');
    btn.classList.remove('armed');
    btn.title = 'Reset this test';
  }

  // Nothing to reset on an untouched question, or on a pass nobody has
  // started; both greyed out rather than doing nothing when clicked.
  function touched(r) {
    return !!(r && (r.selected || r.answered || r.skipped || r.struck.length));
  }

  function updateResetButtons() {
    const q = document.getElementById('resetQBtn');
    q.disabled = resultsOpen || !touched(responses[cur()]);
    q.title = q.disabled ? 'Nothing to reset on this question' : 'Reset this question';

    // The results screen has restart; a second way to wipe it would only
    // muddle things.
    document.getElementById('resetTestBtn').disabled =
      resultsOpen || !view.some(i => touched(responses[i]));
  }

  // Submit / next / back / flag all reflect the current question's state.
  // Before it is answered the arrow is a skip: it moves on and leaves the
  // question marked unanswered so you can come back to it.
  function updateActionButtons() {
    disarmReset();
    const resp = response(cur());
    const last = current + 1 >= view.length;
    const submitBtn = document.getElementById('submitBtn');
    const nextBtn   = document.getElementById('nextBtn');
    const flagBtn   = document.getElementById('flagBtn');

    submitBtn.classList.toggle('hidden', resp.answered);
    submitBtn.disabled = resp.answered || !resp.selected;

    nextBtn.classList.toggle('outline', !resp.answered);
    nextBtn.innerHTML = (resp.answered && last) ? '&#10003;' : '&#8594;';
    nextBtn.title = resp.answered
      ? (last ? 'Finish' : 'Next question (\u2192)')
      : (last ? 'Skip to results (S)' : 'Skip this question (S)');

    flagBtn.classList.toggle('on', !!resp.flagged);
    flagBtn.setAttribute('aria-pressed', resp.flagged ? 'true' : 'false');
    flagBtn.title = resp.flagged ? 'Unflag (F)' : 'Flag for review (F)';

    document.getElementById('backBtn').disabled = current === 0 && !resultsOpen;

    updateResetButtons();
  }

  function updateProgress() {
    const done = tally().total;
    const pct = view.length ? (done / view.length * 100).toFixed(1) : 0;
    document.getElementById('progressLabel').textContent = `${done} / ${view.length}`;
    document.getElementById('progressFill').style.width = pct + '%';
  }

  function updateScore() {
    const { correct, total } = tally();
    const si = document.getElementById('scoreInline');
    if (total === 0) { si.innerHTML = ''; return; }
    const pct = Math.round(correct / total * 100);
    si.innerHTML = `score: <strong>${correct}/${total} (${pct}%)</strong>`;
  }

  function selectAnswer(letter) {
    const resp = response(cur());
    if (resp.answered) return;
    resp.selected = letter;
    document.querySelectorAll('.answer-btn').forEach(btn =>
      btn.classList.toggle('selected', btn.dataset.letter === letter));
    updateActionButtons();
    saveSession();
  }

  // Lock the choices, mark right/wrong and show the explanations for the
  // current question. Used both on submit and when revisiting via back.
  function reveal() {
    const q = questions[cur()];
    const resp = response(cur());

    document.querySelectorAll('.answer-btn').forEach(btn => {
      btn.classList.add('locked');
      btn.classList.remove('selected');
      if (btn.dataset.letter === q.correct)          btn.classList.add('correct');
      else if (btn.dataset.letter === resp.selected) btn.classList.add('incorrect');
    });

    const expItems = document.getElementById('expItems');
    expItems.innerHTML = '';
    Object.entries(q.explanations || {}).forEach(([letter, text]) => {
      const div = document.createElement('div');
      div.className = 'exp-item' + (letter === q.correct ? ' correct-exp' : '');
      const tag = document.createElement('span');
      tag.className = 'exp-letter';
      tag.textContent = letter + '.';
      const body = document.createElement('span');
      paint(body, text, 'exp:' + letter);
      div.appendChild(tag);
      div.appendChild(body);
      expItems.appendChild(div);
    });
    const expFig = renderFigure(q.explanationImage, q);
    if (expFig) expItems.appendChild(expFig);
    const links = document.getElementById('expLinks');
    links.innerHTML = '';
    (lecturePdfs[`${q._block || block}/${q._file}`] || []).forEach(p => {
      const a = document.createElement('a');
      a.className = 'exp-link';
      a.href = `../pdfs/${encodeURIComponent(p.file)}`;
      a.target = '_blank';
      a.rel = 'noopener';
      a.textContent = p.label;
      links.appendChild(a);
    });

    document.getElementById('explanations').classList.add('visible');

    updateActionButtons();
  }

  function submitAnswer() {
    const resp = response(cur());
    if (!resp.selected || resp.answered) return;
    resp.answered = true;
    resp.skipped = false;
    stopTimer();
    paintTimer();
    const q = questions[cur()];
    tellDone(q, resp.selected === q.correct);
    STORE.addAttempt(docOf(q), qKey(q), resp.selected, resp.selected === q.correct, undefined, RUN_KEY);
    reveal();
    renderHistory();
    updateScore();
    updateProgress();
    renderNavigator();
    saveSession();
    STORE.flush();   // an answer goes to the account now, not in a moment
  }

  function nextQuestion() {
    if (resultsOpen) return;
    const resp = response(cur());
    if (!resp.answered) resp.skipped = true;   // moved past without answering
    current++;
    if (current >= view.length) { saveSession(); showResults(); }
    else render();
  }

  function prevQuestion() {
    if (resultsOpen) { reviewAnswers(); return; }
    if (current === 0) return;
    current--;
    render();
  }

  // Jump straight to any question from the navigator (or from the results screen).
  function goTo(n) {
    if (n < 0 || n >= view.length) return;
    if (n === current && !resultsOpen) return;
    if (!resultsOpen) {
      const resp = response(cur());
      if (!resp.answered && n > current) resp.skipped = true;
    }
    resultsOpen = false;
    current = n;
    document.getElementById('results').classList.remove('visible');
    document.getElementById('quizCard').style.display = 'flex';
    render();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function toggleFlag() {
    if (resultsOpen || !questions.length) return;
    const resp = response(cur());
    resp.flagged = !resp.flagged;
    updateActionButtons();
    renderNavigator();
    saveMark(cur());
  }

  // ── Question navigator ──
  // A chip per question: colour is what happened to it, the corner flag is
  // yours. Click one to go there, answered or not.
  function renderNavigator() {
    const nav = document.getElementById('navigator');
    if (!view.length) { nav.classList.remove('visible'); return; }
    nav.classList.add('visible');

    const grid = document.getElementById('navGrid');
    grid.innerHTML = '';
    view.forEach((qi, n) => {
      const q = questions[qi];
      const r = responses[qi];
      const chip = document.createElement('button');
      chip.className = 'qchip';
      chip.textContent = qi + 1;
      const bits = [];
      if (r && r.answered) {
        const ok = r.selected === q.correct;
        chip.classList.add(ok ? 'correct' : 'incorrect');
        bits.push(ok ? 'correct' : 'incorrect');
      } else if (r && r.skipped) {
        chip.classList.add('skipped');
        bits.push('skipped');
      } else {
        bits.push('not seen yet');
      }
      if (r && r.flagged) { chip.classList.add('flagged'); bits.push('flagged'); }
      if (n === current && !resultsOpen) chip.classList.add('current');
      chip.title = `question ${qi + 1} — ${bits.join(', ')}`;
      chip.onclick = () => goTo(n);
      grid.appendChild(chip);
    });

    document.getElementById('navScope').classList.toggle('visible', !!redo);
    if (redo) {
      const redoBtn = document.getElementById('scopeRedo');
      const allBtn  = document.getElementById('scopeAll');
      redoBtn.textContent = `redo ${redo.length}`;
      allBtn.textContent  = `all ${questions.length}`;
      redoBtn.classList.toggle('on', !showAll);
      allBtn.classList.toggle('on', showAll);
    }

    updateNavCounts();
    keepCurrentChipInView();
  }

  // Switch between the redo and the whole lecture. Nothing is cleared either
  // way, and the question on screen stays put if the other view has it.
  function setScope(all) {
    if (!redo || showAll === all) return;
    const here = resultsOpen ? -1 : cur();
    showAll = all;
    syncView();
    if (resultsOpen) { current = view.length; showResults(); return; }
    current = Math.max(view.indexOf(here), 0);
    render();
  }

  // Total and answered already live in the topbar progress, so the rail only
  // mentions the two things it alone tracks — and only when there are any.
  function updateNavCounts() {
    const { flagged, skipped } = tally();
    const bits = [];
    if (skipped) bits.push(`<b>${skipped}</b> skipped`);
    if (flagged) bits.push(`<b>${flagged}</b> flagged`);
    const el = document.getElementById('navCounts');
    el.innerHTML = bits.join('<br>');
    el.style.display = bits.length ? '' : 'none';
  }

  // Scroll the rail itself — never the page — so the question you are on stays
  // visible even in a 400-question shuffle.
  function keepCurrentChipInView() {
    const grid = document.getElementById('navGrid');
    const chip = grid.querySelector('.qchip.current');
    if (!chip) return;
    if (grid.scrollHeight > grid.clientHeight) {
      const top = chip.offsetTop, bottom = top + chip.offsetHeight;
      if (top < grid.scrollTop || bottom > grid.scrollTop + grid.clientHeight) {
        grid.scrollTop = top - grid.clientHeight / 2 + chip.offsetHeight / 2;
      }
    }
    // Narrow screens lay the rail out sideways, so it scrolls that way instead
    if (grid.scrollWidth > grid.clientWidth) {
      const left = chip.offsetLeft, right = left + chip.offsetWidth;
      if (left < grid.scrollLeft || right > grid.scrollLeft + grid.clientWidth) {
        grid.scrollLeft = left - grid.clientWidth / 2 + chip.offsetWidth / 2;
      }
    }
  }

  // The rail hangs off the sticky topbar, whose height depends on the title.
  function syncTopbarHeight() {
    const bar = document.querySelector('.topbar');
    if (bar) document.documentElement.style.setProperty('--topbar-h', bar.offsetHeight + 'px');
  }
  window.addEventListener('resize', syncTopbarHeight);
  syncTopbarHeight();

  function showResults() {
    hidePop();
    stopTimer();
    document.getElementById('quizCard').style.display = 'none';
    updateProgress();

    const { correct, wrong, total, flagged, skipped } = tally();
    const pct = total ? Math.round(correct / total * 100) : 0;

    document.getElementById('rCorrect').textContent = correct;
    document.getElementById('rWrong').textContent   = wrong;
    document.getElementById('rSkipped').textContent = skipped;
    document.getElementById('rFlagged').textContent = flagged;
    document.getElementById('rTotal').textContent   = total;
    document.getElementById('donutPct').textContent = pct + '%';

    document.getElementById('reviewFlaggedBtn').style.display = flagged ? 'inline-block' : 'none';
    document.getElementById('reviewSkippedBtn').style.display = skipped ? 'inline-block' : 'none';
    document.getElementById('refineBtn').style.display = wrong ? 'inline-block' : 'none';

    const circ = 2 * Math.PI * 60;
    const arc = document.getElementById('donutArc');
    arc.style.transition = 'stroke-dashoffset 0.8s ease';
    arc.style.strokeDashoffset = circ * (1 - pct / 100);

    document.getElementById('resultsTitle').textContent = 'quiz complete';
    document.getElementById('results').classList.add('visible');
    resultsOpen = true;
    disarmReset();
    updateResetButtons();
    renderNavigator();
    saveSession();
  }

  // ── Refinement ──
  // Severance's macrodata refinement, borrowed. Every question you answered
  // goes up on the wall; the ones you got right are filed into the bin, and
  // whatever refuses to go becomes the redo — unanswered, so you meet them
  // cold. The rest keep their answers, one switch away in the rail. Click
  // anywhere to cut it short.
  function refine() {
    const missed = view.filter(i => {
      const r = responses[i];
      return r && r.answered && r.selected !== questions[i].correct;
    });
    if (!missed.length) return;

    const veil = document.createElement('div');
    veil.className = 'refine-veil';
    veil.innerHTML =
      '<div class="refine-head">refining</div>' +
      '<div class="refine-grid"></div>' +
      '<div class="refine-bin"><div class="refine-bin-fill"></div>' +
      '<div class="refine-bin-label">0</div></div>' +
      '<div class="refine-note"></div>';
    document.body.appendChild(veil);

    const grid  = veil.querySelector('.refine-grid');
    const bin   = veil.querySelector('.refine-bin');
    const fill  = veil.querySelector('.refine-bin-fill');
    const label = veil.querySelector('.refine-bin-label');
    const note  = veil.querySelector('.refine-note');

    // A long shuffle would spill off the screen at full chip size.
    grid.style.setProperty('--chip', view.length > 150 ? '20px'
                                   : view.length > 80  ? '25px' : '30px');

    const cells = view.map(qi => {
      const r  = responses[qi];
      const ok = !!(r && r.answered && r.selected === questions[qi].correct);
      const el = document.createElement('span');
      el.className = 'rnum ' + (ok ? 'ok' : 'bad');
      el.innerHTML = '<i>' + (qi + 1) + '</i>';   // its own number, kept
      grid.appendChild(el);
      return { el, ok };
    });

    // Everything twitches, out of step with itself.
    cells.forEach(c => {
      const inner = c.el.firstChild;
      inner.classList.add('wiggle');
      inner.style.animationDelay = (-Math.random() * 1.15).toFixed(2) + 's';
    });
    void veil.offsetHeight;      // settle the start of the transition — rAF
    veil.classList.add('on');    // never fires while the tab is hidden

    const keep = cells.filter(c => c.ok);
    const step = keep.length ? Math.min(30, 1500 / keep.length) : 0;
    const timers = [];
    let filed = 0, ended = false;

    function file(c) {
      const from = c.el.getBoundingClientRect();
      const to   = bin.getBoundingClientRect();
      c.el.firstChild.classList.remove('wiggle');
      // aim for the mouth, not the middle, so they read as dropping in
      c.el.style.transform =
        'translate(' + (to.left + to.width / 2 - (from.left + from.width / 2)) + 'px,' +
                       (to.top  + 10 - (from.top + from.height / 2)) + 'px) scale(0.2)';
      c.el.style.opacity = '0';

      filed++;
      fill.style.height = Math.round(filed / keep.length * 100) + '%';
      label.textContent = filed;
    }

    function after(ms, fn) { timers.push(setTimeout(fn, ms)); }

    function finish() {
      if (ended) return;
      ended = true;
      timers.forEach(clearTimeout);

      // Anything not yet filed belongs to the next run — settle it and stop.
      cells.forEach(c => {
        if (c.ok && c.el.style.opacity !== '0') file(c);
        c.el.firstChild.classList.remove('wiggle');
      });
      if (keep.length) { fill.style.height = '100%'; label.textContent = keep.length; }
      note.textContent = missed.length + ' left to redo';

      setTimeout(() => {
        veil.classList.remove('on');
        setTimeout(() => { veil.remove(); restartWith(missed, true); }, 450);
      }, 1100);
    }

    veil.addEventListener('click', finish);

    after(850, () => {
      keep.forEach((c, n) => after(n * step, () => file(c)));
      after(keep.length * step + 850, finish);
    });
  }

  // Play these questions (real indices) again, with their answers cleared —
  // as a redo, leaving the rest of the lecture answered behind it, or as the
  // whole run. Kept in numeric order so the chips read 4, 12, 19 rather than
  // jumping.
  function restartWith(list, asRedo) {
    const sorted = list.slice().sort((a, b) => a - b);
    sorted.forEach(clearAnswer);
    redo = asRedo ? sorted : null;
    showAll = false;
    syncView();
    replay();
  }

  // Back to the first question in view, off the results screen.
  function replay() {
    current = 0;
    resultsOpen = false;
    document.getElementById('results').classList.remove('visible');
    document.getElementById('quizCard').style.display = 'flex';
    render();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  // Restart always comes back to the whole lecture, refined or not, in the
  // order you just played it — the shuffle happens once, when the run loads.
  // The test you just played is put aside, as it stands, and a new one begins.
  function restartQuiz() {
    saveSession();
    STORE.endTest(RUN_KEY);
    RUN_KEY = newTestId();
    started = Date.now();
    restartWith(questions.map((q, i) => i), false);
  }

  // Straight to the first question you flagged / skipped, from the results screen.
  function reviewFlagged() { const n = view.findIndex(i => responses[i] && responses[i].flagged); if (n !== -1) goTo(n); }
  function reviewSkipped() { const n = view.findIndex(i => { const r = responses[i]; return r && r.skipped && !r.answered; }); if (n !== -1) goTo(n); }

  // Leave the results screen and go back to the last question, answers intact.
  function reviewAnswers() {
    document.getElementById('results').classList.remove('visible');
    document.getElementById('quizCard').style.display = 'flex';
    resultsOpen = false;
    current = view.length - 1;
    render();
  }

  // ── Keyboard ──
  // A–E (or 1–5) picks, Enter submits then advances, arrows move, S skips,
  // F flags, N opens the question list.
  document.addEventListener('keydown', e => {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    const t = e.target;
    if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable)) return;
    if (!questions.length) return;

    const key = e.key;
    const k = key.length === 1 ? key.toLowerCase() : key;

    if (key === 'ArrowLeft')  { e.preventDefault(); prevQuestion(); return; }
    if (key === 'ArrowRight') { e.preventDefault(); nextQuestion(); return; }
    if (resultsOpen) {
      if (k === 'f') { e.preventDefault(); reviewFlagged(); }
      return;
    }

    // H highlights whatever is selected (and un-highlights an already-yellow
    // selection). With nothing selected it falls through, so a question with an
    // H answer choice still works.
    if (k === 'h') {
      const sel = selectionRange();
      if (sel) { e.preventDefault(); applyHighlight(sel, overlaps(sel.key, sel.start, sel.end)); return; }
    }

    if (k === 'f') { e.preventDefault(); toggleFlag(); return; }
    if (k === 's') { e.preventDefault(); nextQuestion(); return; }

    if (key === 'Enter' || key === ' ') {
      e.preventDefault();
      const resp = response(cur());
      if (resp.answered) nextQuestion();
      else if (resp.selected) submitAnswer();
      return;
    }

    const letters = Object.keys(questions[cur()].answers || {});
    const idx = /^[1-9]$/.test(key) ? parseInt(key, 10) - 1 : letters.indexOf(key.toUpperCase());
    if (idx >= 0 && idx < letters.length) { e.preventDefault(); selectAnswer(letters[idx]); }
  });

  GATE.ready().then(user => {
    STORE.open(user, GATE.cloud());
    load();
    if (user) SHARE.able().then(ok => { document.getElementById('qSendBtn').hidden = !ok; });
    if (user) watchInbox();
  });
</script>
</body>
</html>

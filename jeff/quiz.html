<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>jeff — quiz</title>
  <link rel="icon" type="image/x-icon" href="../static/assets/favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Klee+One&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after {
      margin: 0; padding: 0; box-sizing: border-box;
    }

    /* Topbar keeps Klee One */
    .topbar, .topbar * {
      font-family: "Klee One", cursive;
    }

    /* Everything else: clean system font */
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      background-color: #eae6f0;
      color: #1a1a1a;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    a { color: inherit; text-decoration: none; }

    /* ── Topbar (unchanged) ── */
    .topbar {
      background: #f0ecf8;
      border-bottom: 1px solid #c5bee0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.7rem 1.5rem;
      position: sticky;
      top: 0;
      z-index: 10;
      gap: 1rem;
    }

    .topbar-left { display: flex; align-items: center; gap: 1rem; }

    .back-link {
      font-size: 0.85rem;
      color: #5c4f7a;
      opacity: 0.7;
      transition: opacity 0.15s;
      white-space: nowrap;
    }
    .back-link:hover { opacity: 1; }

    .quiz-title   { font-size: 0.95rem; color: #14111a; }
    .quiz-subtitle { font-size: 0.75rem; color: #5c4f7a; opacity: 0.7; }

    .progress-wrap {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 0.3rem;
      min-width: 160px;
    }

    .progress-label { font-size: 0.75rem; color: #5c4f7a; opacity: 0.7; }

    .progress-bar-bg {
      width: 160px;
      height: 5px;
      background: #c5bee0;
      border-radius: 99px;
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 100%;
      background: #5c4f7a;
      border-radius: 99px;
      transition: width 0.3s ease;
    }

    /* ── Main ── */
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1rem 4rem;
    }

    .state-msg {
      color: #555;
      font-size: 0.95rem;
      text-align: center;
      padding: 4rem 2rem;
    }

    /* ── Card ── */
    .card {
      background: #fff;
      border: 1px solid #d0d0d0;
      border-radius: 6px;
      width: 100%;
      max-width: 820px;
      padding: 1.75rem 2rem;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }

    .q-meta {
      font-size: 0.72rem;
      color: #777;
      letter-spacing: 0.03em;
      text-transform: uppercase;
    }

    .q-text {
      font-size: 0.97rem;
      line-height: 1.75;
      color: #1a1a1a;
    }

    /* ── Lab table ── */
    .lab-table {
      width: auto;
      border-collapse: collapse;
      font-size: 0.82rem;
      margin-top: 0.75rem;
    }
    .lab-table th, .lab-table td {
      padding: 0.3rem 0.85rem;
      border: 1px solid #bbb;
      text-align: left;
      color: #1a1a1a;
    }
    .lab-table th {
      background: #f0f0f0;
      font-weight: 600;
    }
    .lab-table tr:nth-child(even) td { background: #fafafa; }

    /* ── Answers ── */
    .answers {
      display: flex;
      flex-direction: column;
      gap: 0.45rem;
    }

    .answer-btn {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      background: #fff;
      border: 1px solid #c8c8c8;
      border-radius: 4px;
      padding: 0.6rem 0.9rem;
      cursor: pointer;
      text-align: left;
      color: #1a1a1a;
      font-size: 0.93rem;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      line-height: 1.5;
      transition: border-color 0.12s, background 0.12s;
      width: 100%;
      position: relative;
    }

    .answer-btn:not(.locked):hover {
      border-color: #888;
      background: #f7f7f7;
    }

    .answer-btn.selected {
      border-color: #3a6ea8;
      background: #edf3fb;
    }

    .answer-btn.correct {
      border-color: #2e7d4f;
      background: #edf7f1;
    }

    .answer-btn.incorrect {
      border-color: #b03030;
      background: #fdf0f0;
    }

    .answer-btn.struck .answer-text {
      text-decoration: line-through;
      opacity: 0.45;
    }

    .answer-letter {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 26px;
      height: 26px;
      border-radius: 50%;
      background: #e0e0e0;
      color: #333;
      font-size: 0.78rem;
      font-weight: 700;
      flex-shrink: 0;
      transition: background 0.12s, color 0.12s;
    }

    .answer-btn.selected  .answer-letter { background: #3a6ea8; color: #fff; }
    .answer-btn.correct   .answer-letter { background: #2e7d4f; color: #fff; }
    .answer-btn.incorrect .answer-letter { background: #b03030; color: #fff; }

    .strike-hint {
      font-size: 0.68rem;
      color: #aaa;
      margin-left: auto;
      flex-shrink: 0;
      display: none;
    }
    .answer-btn:hover .strike-hint { display: block; }

    /* ── Explanations ── */
    .explanations {
      display: none;
      flex-direction: column;
      gap: 0.4rem;
      border-top: 1px solid #ddd;
      padding-top: 1rem;
    }
    .explanations.visible { display: flex; }

    .exp-title {
      font-size: 0.72rem;
      color: #777;
      text-transform: uppercase;
      letter-spacing: 0.03em;
      margin-bottom: 0.1rem;
    }

    .exp-item {
      display: flex;
      gap: 0.6rem;
      padding: 0.55rem 0.8rem;
      border-radius: 3px;
      font-size: 0.85rem;
      line-height: 1.55;
      background: #f8f8f8;
      border: 1px solid #e0e0e0;
      color: #1a1a1a;
    }

    .exp-item.correct-exp {
      border-color: #2e7d4f;
      background: #edf7f1;
    }

    .exp-letter {
      font-weight: 700;
      min-width: 16px;
      color: #888;
      flex-shrink: 0;
    }
    .exp-item.correct-exp .exp-letter { color: #2e7d4f; }

    /* ── Actions ── */
    .actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid #e0e0e0;
      padding-top: 0.9rem;
    }

    .score-inline { font-size: 0.82rem; color: #555; }
    .score-inline strong { color: #2e7d4f; }

    /* Circular nav button */
    .nav-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: 2px solid #3a6ea8;
      background: #3a6ea8;
      color: #fff;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
      line-height: 1;
      padding: 0;
    }
    .nav-btn:disabled {
      border-color: #bbb;
      background: #e0e0e0;
      color: #999;
      cursor: default;
    }
    .nav-btn:not(:disabled):hover { background: #2a5a90; border-color: #2a5a90; }

    /* Secondary (back) nav button */
    .nav-btn.outline { background: transparent; color: #3a6ea8; }
    .nav-btn.outline:not(:disabled):hover { background: #edf3fb; border-color: #3a6ea8; color: #3a6ea8; }
    .nav-btn.outline:disabled { background: transparent; border-color: #d0d0d0; color: #bbb; }

    #submitBtn        { display: inline-flex; }
    #submitBtn.hidden { display: none; }
    #nextBtn          { display: inline-flex; }

    /* Flag-for-review toggle */
    .nav-btn.flag {
      background: transparent;
      border-color: #c98a00;
      color: #c98a00;
      font-size: 1.05rem;
    }
    .nav-btn.flag:not(:disabled):hover { background: #fff7e6; border-color: #c98a00; color: #c98a00; }
    .nav-btn.flag.on { background: #c98a00; border-color: #c98a00; color: #fff; }

    /* ── Question navigator ──
       A persistent rail down the left: every question, always in reach. */
    .layout {
      flex: 1;
      display: flex;
      align-items: flex-start;
      width: 100%;
      min-height: 0;
    }

    .navigator {
      display: none;
      position: sticky;
      top: var(--topbar-h, 58px);
      align-self: flex-start;
      flex: 0 0 150px;
      width: 150px;
      height: calc(100vh - var(--topbar-h, 58px));
      flex-direction: column;
      gap: 0.55rem;
      padding: 0.9rem 0.75rem 1rem;
      background: #f0ecf8;
      border-right: 1px solid #c5bee0;
    }
    .navigator.visible { display: flex; }

    .nav-title {
      font-family: "Klee One", cursive;
      font-size: 0.78rem;
      color: #5c4f7a;
    }

    .nav-counts {
      font-size: 0.66rem;
      line-height: 1.6;
      color: #7b7488;
    }
    .nav-counts b { font-weight: 600; color: #4a4356; }

    .nav-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(30px, 1fr));
      grid-auto-rows: 30px;
      align-content: start;
      gap: 0.28rem;
      flex: 1 1 auto;
      min-height: 0;
      overflow-y: auto;
      padding: 0.15rem 0.15rem 0.15rem 0;
    }

    .nav-legend {
      display: flex;
      flex-direction: column;
      gap: 0.22rem;
      font-size: 0.62rem;
      color: #8a8496;
      border-top: 1px solid #d8d2e8;
      padding-top: 0.5rem;
    }
    .nav-legend span { display: inline-flex; align-items: center; gap: 0.3rem; }
    .nav-legend .flag-key { color: #c98a00; }

    .swatch {
      width: 9px; height: 9px;
      border-radius: 2px;
      border: 1px solid #c8c8c8;
      background: #fff;
      display: inline-block;
      flex-shrink: 0;
    }
    .swatch.correct   { background: #edf7f1; border-color: #2e7d4f; }
    .swatch.incorrect { background: #fdf0f0; border-color: #b03030; }
    .swatch.skipped   { background: #fff7e6; border-color: #c98a00; }

    .qchip {
      position: relative;
      height: 30px;
      border: 1px solid #c8c8c8;
      border-radius: 4px;
      background: #fff;
      color: #555;
      font-size: 0.72rem;
      font-family: inherit;
      cursor: pointer;
      transition: border-color 0.12s, background 0.12s;
    }
    .qchip:hover { border-color: #888; background: #f7f7f7; }
    .qchip.correct   { background: #edf7f1; border-color: #2e7d4f; color: #2e7d4f; }
    .qchip.incorrect { background: #fdf0f0; border-color: #b03030; color: #b03030; }
    .qchip.skipped   { background: #fff7e6; border-color: #c98a00; color: #8a6100; }
    /* Ring only — the border keeps saying correct / incorrect / skipped */
    .qchip.current   { box-shadow: 0 0 0 2px rgba(58,110,168,0.5); }
    .qchip.current:not(.correct):not(.incorrect):not(.skipped) { border-color: #3a6ea8; }
    .qchip.flagged::after {
      content: "\2691";
      position: absolute;
      top: 1px; right: 2px;
      font-size: 0.62rem;
      line-height: 1;
      color: #c98a00;
    }

    /* Narrow screens: the rail lies down across the top and scrolls sideways */
    @media (max-width: 760px) {
      .layout { flex-direction: column; }
      .navigator {
        position: static;
        flex: 0 0 auto;
        width: 100%;
        height: auto;
        flex-direction: row;
        align-items: center;
        gap: 0.75rem;
        padding: 0.55rem 0.9rem;
        border-right: none;
        border-bottom: 1px solid #c5bee0;
      }
      .nav-title { display: none; }
      .nav-counts { flex-shrink: 0; }
      .nav-grid {
        grid-template-columns: none;
        grid-auto-flow: column;
        grid-auto-columns: 30px;
        overflow-x: auto;
        overflow-y: hidden;
      }
      .nav-legend { display: none; }
    }

    /* ── Results ── */
    #results {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 1.75rem;
      padding: 2.5rem 1rem;
      width: 100%;
      max-width: 520px;
      text-align: center;
    }
    #results.visible { display: flex; }

    .results-title { font-size: 1.4rem; color: #1a1a1a; }

    .donut-wrap {
      position: relative;
      width: 148px;
      height: 148px;
    }
    .donut-wrap svg { transform: rotate(-90deg); }

    .donut-label {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .donut-pct { font-size: 1.9rem; color: #1a1a1a; }
    .donut-sub { font-size: 0.72rem; color: #777; margin-top: 0.1rem; }

    .results-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(84px, 1fr));
      gap: 0.6rem;
      width: 100%;
    }

    .res-stat {
      background: #fff;
      border: 1px solid #d0d0d0;
      border-radius: 6px;
      padding: 0.85rem 0.5rem;
    }

    .res-stat .val { font-size: 1.35rem; color: #1a1a1a; }
    .res-stat .lbl { font-size: 0.75rem; color: #777; margin-top: 0.15rem; }
    .val.green { color: #2e7d4f; }
    .val.red   { color: #b03030; }

    .results-actions { display: flex; gap: 0.65rem; flex-wrap: wrap; justify-content: center; }

    .res-btn {
      padding: 0.5rem 1.25rem;
      border-radius: 4px;
      border: 1px solid #3a6ea8;
      background: #3a6ea8;
      color: #fff;
      font-size: 0.88rem;
      cursor: pointer;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      transition: background 0.15s;
    }
    .res-btn:hover { background: #2a5a90; }
    .res-btn.outline { background: transparent; color: #3a6ea8; }
    .res-btn.outline:hover { background: #edf3fb; }
  </style>
</head>
<body>

<div class="topbar">
  <div class="topbar-left">
    <a class="back-link" href="index.html">← jeff</a>
    <div>
      <div class="quiz-title" id="topTitle">loading…</div>
      <div class="quiz-subtitle" id="topSubtitle"></div>
    </div>
  </div>
  <div class="progress-wrap">
    <div class="progress-label" id="progressLabel">0 / 0</div>
    <div class="progress-bar-bg">
      <div class="progress-bar-fill" id="progressFill" style="width:0%"></div>
    </div>
  </div>
</div>

<div class="layout">

<aside class="navigator" id="navigator">
  <div class="nav-title">questions</div>
  <div class="nav-counts" id="navCounts"></div>
  <div class="nav-grid" id="navGrid"></div>
  <div class="nav-legend">
    <span><i class="swatch correct"></i>correct</span>
    <span><i class="swatch incorrect"></i>incorrect</span>
    <span><i class="swatch skipped"></i>skipped</span>
    <span><i class="flag-key">&#9873;</i>flagged</span>
  </div>
</aside>

<div class="main" id="mainArea">
  <p class="state-msg" id="stateMsg">loading questions…</p>

  <div class="card" id="quizCard" style="display:none">
    <div>
      <div class="q-meta" id="qMeta"></div>
      <div class="q-text" id="qText"></div>
    </div>

    <div class="answers" id="answers"></div>

    <div class="explanations" id="explanations">
      <div class="exp-title">answer explanations</div>
      <div id="expItems"></div>
    </div>

    <div class="actions">
      <div class="score-inline" id="scoreInline"></div>
      <div style="display:flex;align-items:center;gap:0.5rem">
        <button class="nav-btn flag" id="flagBtn" onclick="toggleFlag()" title="Flag for review (F)" aria-pressed="false">&#9873;</button>
        <button class="nav-btn outline" id="backBtn" onclick="prevQuestion()" disabled title="Previous (&#8592;)">&#8592;</button>
        <button class="nav-btn" id="submitBtn" onclick="submitAnswer()" disabled title="Submit (Enter)">&#10003;</button>
        <button class="nav-btn" id="nextBtn" onclick="nextQuestion()" title="Next (&#8594;)">&#8594;</button>
      </div>
    </div>
  </div>

  <div id="results">
    <div class="results-title" id="resultsTitle">quiz complete</div>
    <div class="donut-wrap">
      <svg width="148" height="148" viewBox="0 0 148 148">
        <circle cx="74" cy="74" r="60" fill="none" stroke="#c5bee0" stroke-width="14"/>
        <circle cx="74" cy="74" r="60" fill="none" stroke="#4a7a5c" stroke-width="14"
          stroke-dasharray="376.99" stroke-dashoffset="376.99"
          id="donutArc" stroke-linecap="round"/>
      </svg>
      <div class="donut-label">
        <div class="donut-pct" id="donutPct">0%</div>
        <div class="donut-sub">score</div>
      </div>
    </div>
    <div class="results-grid">
      <div class="res-stat"><div class="val green" id="rCorrect">0</div><div class="lbl">correct</div></div>
      <div class="res-stat"><div class="val red"   id="rWrong">0</div><div class="lbl">incorrect</div></div>
      <div class="res-stat"><div class="val"       id="rSkipped">0</div><div class="lbl">skipped</div></div>
      <div class="res-stat"><div class="val"       id="rFlagged">0</div><div class="lbl">flagged</div></div>
      <div class="res-stat"><div class="val"       id="rTotal">0</div><div class="lbl">answered</div></div>
    </div>
    <div class="results-actions">
      <button class="res-btn outline" onclick="reviewAnswers()">← review answers</button>
      <button class="res-btn outline" id="reviewFlaggedBtn" onclick="reviewFlagged()" style="display:none">&#9873; review flagged</button>
      <button class="res-btn outline" id="reviewSkippedBtn" onclick="reviewSkipped()" style="display:none">→ first skipped</button>
      <button class="res-btn" onclick="restartQuiz()">restart</button>
    </div>
  </div>

</div>

</div>

<script>
  const params  = new URLSearchParams(location.search);
  const block   = params.get('block') || '';
  const lecture = params.get('lecture') || '';

  let questions = [], current = 0;

  // One record per question, kept for the whole session so you can walk back
  // and forward without losing what you picked.
  // { selected, answered, struck, flagged, skipped }
  let responses = [];

  // True while the results screen is up, so navigation knows to leave it.
  let resultsOpen = false;

  function response(i) {
    if (!responses[i]) responses[i] = { selected: null, answered: false, struck: [], flagged: false, skipped: false };
    return responses[i];
  }

  // ── Session persistence ──
  // Kept in sessionStorage so a refresh (or an accidental navigation) resumes
  // where you left off. Per tab, per quiz, and gone when the tab closes.
  const STORE_KEY = `jeff-quiz:${block}:${lecture || '*'}`;

  function qKey(q) {
    return q.id || `${q._lecture || lecture || block}|${(q.question || '').slice(0, 120)}`;
  }

  function saveSession() {
    try {
      const byKey = {};
      responses.forEach((r, i) => {
        if (r && (r.selected || r.answered || r.flagged || r.skipped || r.struck.length)) byKey[qKey(questions[i])] = r;
      });
      sessionStorage.setItem(STORE_KEY, JSON.stringify({
        v: 1,
        current,
        order: questions.map(qKey),
        responses: byKey
      }));
    } catch (e) { /* storage full or blocked — carry on without persistence */ }
  }

  function readSession() {
    try {
      const saved = JSON.parse(sessionStorage.getItem(STORE_KEY) || 'null');
      return saved && saved.v === 1 && Array.isArray(saved.order) ? saved : null;
    } catch (e) { return null; }
  }

  // Put the questions back in their saved order and reattach the saved answers.
  // Questions added to the block since the session started are kept at the end
  // rather than throwing the whole session away.
  function restoreSession() {
    const saved = readSession();
    if (!saved) return false;

    const pos = new Map(saved.order.map((k, i) => [k, i]));
    const known = [], fresh = [];
    questions.forEach(q => (pos.has(qKey(q)) ? known : fresh).push(q));
    if (!known.length) return false;

    known.sort((a, b) => pos.get(qKey(a)) - pos.get(qKey(b)));
    questions = known.concat(fresh);

    responses = questions.map(q => {
      const r = saved.responses && saved.responses[qKey(q)];
      if (!r) return null;
      return {
        selected: r.selected || null,
        answered: !!r.answered,
        struck: Array.isArray(r.struck) ? r.struck : [],
        flagged: !!r.flagged,
        skipped: !!r.skipped
      };
    });

    current = Math.min(Math.max(parseInt(saved.current, 10) || 0, 0), questions.length);

    // If the session had finished but new questions showed up, resume on the
    // first one still unanswered instead of dropping straight to results.
    if (current >= questions.length) {
      const firstOpen = responses.findIndex(r => !r || !r.answered);
      if (firstOpen !== -1) current = firstOpen;
    }
    return true;
  }

  function tally() {
    let correct = 0, wrong = 0, flagged = 0, skipped = 0;
    responses.forEach((r, i) => {
      if (!r) return;
      if (r.flagged) flagged++;
      if (r.answered) r.selected === questions[i].correct ? correct++ : wrong++;
      else if (r.skipped) skipped++;
    });
    return { correct, wrong, total: correct + wrong, flagged, skipped };
  }

  const blockNames = { neuro: 'Neurology', endorepro: 'Endo / Repro', msk: 'MSK' };

  async function load() {
    if (!block) { show('no block specified.'); return; }
    document.getElementById('topTitle').textContent = blockNames[block] || block;

    try {
      if (lecture) {
        const r = await fetch(`${block}/${lecture}?t=${Date.now()}`);
        if (!r.ok) throw new Error('not found');
        const data = await r.json();
        questions = data.questions || [];
        document.getElementById('topSubtitle').textContent = data.lecture || lecture;
      } else {
        const apiUrl = `https://api.github.com/repos/bananasrlowkeygood/bananasrlowkeygood.github.io/contents/jeff/${block}`;
        const dirRes = await fetch(apiUrl);
        if (!dirRes.ok) throw new Error('could not list block');
        const entries = await dirRes.json();
        const files = entries.filter(e => e.type === 'file' && e.name.endsWith('.json') && e.name !== 'index.json').map(e => e.name);
        if (!files.length) { show('no questions in this block yet.'); return; }
        const all = await Promise.all(files.map(async name => {
          const r = await fetch(`${block}/${name}?t=${Date.now()}`);
          if (!r.ok) return [];
          const d = await r.json();
          return (d.questions || []).map(q => ({ ...q, _lecture: d.lecture }));
        }));
        questions = all.flat();
        document.getElementById('topSubtitle').textContent = 'all lectures · shuffled';
      }
    } catch(e) {
      show('failed to load questions: ' + e.message); return;
    }

    if (!questions.length) { show('no questions found.'); return; }

    const resumed = restoreSession();
    if (!lecture && !resumed) shuffle(questions);

    document.getElementById('stateMsg').style.display = 'none';
    syncTopbarHeight();

    // A session that had already finished comes back on the results screen
    if (resumed && current >= questions.length) { showResults(); return; }

    document.getElementById('quizCard').style.display = 'flex';
    render();
  }

  function show(msg) { document.getElementById('stateMsg').textContent = msg; }

  function shuffle(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
  }

  function renderTable(rows) {
    if (!rows || !rows.length) return '';
    const head = rows[0];
    const body = rows.slice(1);
    const ths = head.map(h => `<th>${h}</th>`).join('');
    const trs = body.map(r => `<tr>${r.map(c => `<td>${c}</td>`).join('')}</tr>`).join('');
    return `<table class="lab-table"><thead><tr>${ths}</tr></thead><tbody>${trs}</tbody></table>`;
  }

  function parseMarkdownTable(text) {
    const lines = text.split('\n');
    const tableLines = [];
    let inTable = false;
    const remaining = [];
    for (const line of lines) {
      if (/^\|/.test(line.trim())) {
        inTable = true;
        if (!/^[\|\s\-:]+$/.test(line)) {
          tableLines.push(line.trim().replace(/^\||\|$/g, '').split('|').map(c => c.trim()));
        }
      } else {
        inTable = false;
        remaining.push(line);
      }
    }
    return { tableRows: tableLines, rest: remaining.join('\n').trim() };
  }

  function render() {
    const q = questions[current];
    const resp = response(current);

    document.getElementById('qMeta').textContent = `question ${current + 1} of ${questions.length}`;

    const qTextEl = document.getElementById('qText');
    qTextEl.innerHTML = '';

    const { tableRows, rest } = parseMarkdownTable(q.question);
    const questionText = tableRows.length ? rest : q.question;

    // Question text first
    const p = document.createElement('p');
    p.style.cssText = 'line-height:1.75;white-space:pre-wrap;';
    p.textContent = questionText;
    qTextEl.appendChild(p);

    // Table below (structured field takes priority, then markdown)
    if (q.table) {
      qTextEl.innerHTML += renderTable(q.table);
    } else if (tableRows.length) {
      qTextEl.innerHTML += renderTable(tableRows);
    }

    const answersEl = document.getElementById('answers');
    answersEl.innerHTML = '';
    Object.entries(q.answers).forEach(([letter, text]) => {
      const btn = document.createElement('button');
      btn.className = 'answer-btn';
      btn.dataset.letter = letter;
      btn.innerHTML = `<span class="answer-letter">${letter}</span><span class="answer-text">${text}</span><span class="strike-hint">right-click to strike</span>`;
      btn.classList.toggle('struck', resp.struck.includes(letter));
      btn.onclick = () => selectAnswer(letter);
      btn.oncontextmenu = (e) => {
        e.preventDefault();
        if (response(current).answered) return;
        btn.classList.toggle('struck');
        const s = resp.struck.filter(l => l !== letter);
        if (btn.classList.contains('struck')) s.push(letter);
        resp.struck = s;
        saveSession();
      };
      answersEl.appendChild(btn);
    });

    document.getElementById('explanations').classList.remove('visible');
    document.getElementById('expItems').innerHTML = '';

    // Restore whatever this question already had this session
    if (resp.answered) {
      reveal();
    } else if (resp.selected) {
      document.querySelectorAll('.answer-btn').forEach(btn =>
        btn.classList.toggle('selected', btn.dataset.letter === resp.selected));
    }

    updateActionButtons();
    updateScore();
    updateProgress();
    renderNavigator();
    saveSession();
  }

  // Submit / next / back / flag all reflect the current question's state.
  // Before it is answered the arrow is a skip: it moves on and leaves the
  // question marked unanswered so you can come back to it.
  function updateActionButtons() {
    const resp = response(current);
    const last = current + 1 >= questions.length;
    const submitBtn = document.getElementById('submitBtn');
    const nextBtn   = document.getElementById('nextBtn');
    const flagBtn   = document.getElementById('flagBtn');

    submitBtn.classList.toggle('hidden', resp.answered);
    submitBtn.disabled = resp.answered || !resp.selected;

    nextBtn.classList.toggle('outline', !resp.answered);
    nextBtn.innerHTML = (resp.answered && last) ? '&#10003;' : '&#8594;';
    nextBtn.title = resp.answered
      ? (last ? 'Finish' : 'Next question (\u2192)')
      : (last ? 'Skip to results (S)' : 'Skip this question (S)');

    flagBtn.classList.toggle('on', !!resp.flagged);
    flagBtn.setAttribute('aria-pressed', resp.flagged ? 'true' : 'false');
    flagBtn.title = resp.flagged ? 'Unflag (F)' : 'Flag for review (F)';

    document.getElementById('backBtn').disabled = current === 0 && !resultsOpen;
  }

  function updateProgress() {
    const done = tally().total;
    const pct = questions.length ? (done / questions.length * 100).toFixed(1) : 0;
    document.getElementById('progressLabel').textContent = `${done} / ${questions.length}`;
    document.getElementById('progressFill').style.width = pct + '%';
  }

  function updateScore() {
    const { correct, total } = tally();
    const si = document.getElementById('scoreInline');
    if (total === 0) { si.innerHTML = ''; return; }
    const pct = Math.round(correct / total * 100);
    si.innerHTML = `score: <strong>${correct}/${total} (${pct}%)</strong>`;
  }

  function selectAnswer(letter) {
    const resp = response(current);
    if (resp.answered) return;
    resp.selected = letter;
    document.querySelectorAll('.answer-btn').forEach(btn =>
      btn.classList.toggle('selected', btn.dataset.letter === letter));
    updateActionButtons();
    saveSession();
  }

  // Lock the choices, mark right/wrong and show the explanations for the
  // current question. Used both on submit and when revisiting via back.
  function reveal() {
    const q = questions[current];
    const resp = response(current);

    document.querySelectorAll('.answer-btn').forEach(btn => {
      btn.classList.add('locked');
      btn.classList.remove('selected');
      if (btn.dataset.letter === q.correct)          btn.classList.add('correct');
      else if (btn.dataset.letter === resp.selected) btn.classList.add('incorrect');
    });

    const expItems = document.getElementById('expItems');
    expItems.innerHTML = '';
    Object.entries(q.explanations || {}).forEach(([letter, text]) => {
      const div = document.createElement('div');
      div.className = 'exp-item' + (letter === q.correct ? ' correct-exp' : '');
      div.innerHTML = `<span class="exp-letter">${letter}.</span><span>${text}</span>`;
      expItems.appendChild(div);
    });
    document.getElementById('explanations').classList.add('visible');

    updateActionButtons();
  }

  function submitAnswer() {
    const resp = response(current);
    if (!resp.selected || resp.answered) return;
    resp.answered = true;
    resp.skipped = false;
    reveal();
    updateScore();
    updateProgress();
    renderNavigator();
    saveSession();
  }

  function nextQuestion() {
    if (resultsOpen) return;
    const resp = response(current);
    if (!resp.answered) resp.skipped = true;   // moved past without answering
    current++;
    if (current >= questions.length) { saveSession(); showResults(); }
    else render();
  }

  function prevQuestion() {
    if (resultsOpen) { reviewAnswers(); return; }
    if (current === 0) return;
    current--;
    render();
  }

  // Jump straight to any question from the navigator (or from the results screen).
  function goTo(i) {
    if (i < 0 || i >= questions.length) return;
    if (i === current && !resultsOpen) return;
    if (!resultsOpen) {
      const resp = response(current);
      if (!resp.answered && i > current) resp.skipped = true;
    }
    resultsOpen = false;
    current = i;
    document.getElementById('results').classList.remove('visible');
    document.getElementById('quizCard').style.display = 'flex';
    render();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function toggleFlag() {
    if (resultsOpen || !questions.length) return;
    const resp = response(current);
    resp.flagged = !resp.flagged;
    updateActionButtons();
    renderNavigator();
    saveSession();
  }

  // ── Question navigator ──
  // A chip per question: colour is what happened to it, the corner flag is
  // yours. Click one to go there, answered or not.
  function renderNavigator() {
    const nav = document.getElementById('navigator');
    if (!questions.length) { nav.classList.remove('visible'); return; }
    nav.classList.add('visible');

    const grid = document.getElementById('navGrid');
    grid.innerHTML = '';
    questions.forEach((q, i) => {
      const r = responses[i];
      const chip = document.createElement('button');
      chip.className = 'qchip';
      chip.textContent = i + 1;
      const bits = [];
      if (r && r.answered) {
        const ok = r.selected === q.correct;
        chip.classList.add(ok ? 'correct' : 'incorrect');
        bits.push(ok ? 'correct' : 'incorrect');
      } else if (r && r.skipped) {
        chip.classList.add('skipped');
        bits.push('skipped');
      } else {
        bits.push('not seen yet');
      }
      if (r && r.flagged) { chip.classList.add('flagged'); bits.push('flagged'); }
      if (i === current && !resultsOpen) chip.classList.add('current');
      chip.title = `question ${i + 1} — ${bits.join(', ')}`;
      chip.onclick = () => goTo(i);
      grid.appendChild(chip);
    });

    updateNavCounts();
    keepCurrentChipInView();
  }

  function updateNavCounts() {
    const { total, flagged, skipped } = tally();
    const bits = [`<b>${questions.length}</b> total`, `<b>${total}</b> answered`];
    if (skipped) bits.push(`<b>${skipped}</b> skipped`);
    if (flagged) bits.push(`<b>${flagged}</b> flagged`);
    document.getElementById('navCounts').innerHTML = bits.join('<br>');
  }

  // Scroll the rail itself — never the page — so the question you are on stays
  // visible even in a 400-question shuffle.
  function keepCurrentChipInView() {
    const grid = document.getElementById('navGrid');
    const chip = grid.querySelector('.qchip.current');
    if (!chip) return;
    if (grid.scrollHeight > grid.clientHeight) {
      const top = chip.offsetTop, bottom = top + chip.offsetHeight;
      if (top < grid.scrollTop || bottom > grid.scrollTop + grid.clientHeight) {
        grid.scrollTop = top - grid.clientHeight / 2 + chip.offsetHeight / 2;
      }
    }
    // Narrow screens lay the rail out sideways, so it scrolls that way instead
    if (grid.scrollWidth > grid.clientWidth) {
      const left = chip.offsetLeft, right = left + chip.offsetWidth;
      if (left < grid.scrollLeft || right > grid.scrollLeft + grid.clientWidth) {
        grid.scrollLeft = left - grid.clientWidth / 2 + chip.offsetWidth / 2;
      }
    }
  }

  // The rail hangs off the sticky topbar, whose height depends on the title.
  function syncTopbarHeight() {
    const bar = document.querySelector('.topbar');
    if (bar) document.documentElement.style.setProperty('--topbar-h', bar.offsetHeight + 'px');
  }
  window.addEventListener('resize', syncTopbarHeight);
  syncTopbarHeight();

  function showResults() {
    document.getElementById('quizCard').style.display = 'none';
    updateProgress();

    const { correct, wrong, total, flagged, skipped } = tally();
    const pct = total ? Math.round(correct / total * 100) : 0;

    document.getElementById('rCorrect').textContent = correct;
    document.getElementById('rWrong').textContent   = wrong;
    document.getElementById('rSkipped').textContent = skipped;
    document.getElementById('rFlagged').textContent = flagged;
    document.getElementById('rTotal').textContent   = total;
    document.getElementById('donutPct').textContent = pct + '%';

    document.getElementById('reviewFlaggedBtn').style.display = flagged ? 'inline-block' : 'none';
    document.getElementById('reviewSkippedBtn').style.display = skipped ? 'inline-block' : 'none';

    const circ = 2 * Math.PI * 60;
    const arc = document.getElementById('donutArc');
    arc.style.transition = 'stroke-dashoffset 0.8s ease';
    arc.style.strokeDashoffset = circ * (1 - pct / 100);

    document.getElementById('resultsTitle').textContent = 'quiz complete';
    document.getElementById('results').classList.add('visible');
    resultsOpen = true;
    renderNavigator();
    saveSession();
  }

  function restartQuiz() {
    current = 0;
    responses = [];
    resultsOpen = false;
    shuffle(questions);
    document.getElementById('results').classList.remove('visible');
    document.getElementById('quizCard').style.display = 'flex';
    render();
  }

  // Straight to the first question you flagged / skipped, from the results screen.
  function reviewFlagged() { const i = responses.findIndex(r => r && r.flagged); if (i !== -1) goTo(i); }
  function reviewSkipped() { const i = responses.findIndex(r => r && r.skipped && !r.answered); if (i !== -1) goTo(i); }

  // Leave the results screen and go back to the last question, answers intact.
  function reviewAnswers() {
    document.getElementById('results').classList.remove('visible');
    document.getElementById('quizCard').style.display = 'flex';
    resultsOpen = false;
    current = questions.length - 1;
    render();
  }

  // ── Keyboard ──
  // A–E (or 1–5) picks, Enter submits then advances, arrows move, S skips,
  // F flags, N opens the question list.
  document.addEventListener('keydown', e => {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    const t = e.target;
    if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable)) return;
    if (!questions.length) return;

    const key = e.key;
    const k = key.length === 1 ? key.toLowerCase() : key;

    if (key === 'ArrowLeft')  { e.preventDefault(); prevQuestion(); return; }
    if (key === 'ArrowRight') { e.preventDefault(); nextQuestion(); return; }
    if (resultsOpen) {
      if (k === 'f') { e.preventDefault(); reviewFlagged(); }
      return;
    }

    if (k === 'f') { e.preventDefault(); toggleFlag(); return; }
    if (k === 's') { e.preventDefault(); nextQuestion(); return; }

    if (key === 'Enter' || key === ' ') {
      e.preventDefault();
      const resp = response(current);
      if (resp.answered) nextQuestion();
      else if (resp.selected) submitAnswer();
      return;
    }

    const letters = Object.keys(questions[current].answers || {});
    const idx = /^[1-9]$/.test(key) ? parseInt(key, 10) - 1 : letters.indexOf(key.toUpperCase());
    if (idx >= 0 && idx < letters.length) { e.preventDefault(); selectAnswer(letters[idx]); }
  });

  load();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<link rel="icon" type="image/x-icon" href="../static/assets/favicon.ico">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px/1.4 -apple-system,system-ui,sans-serif}img{max-width:100%}</style>
<title>Bony Pelvis Atlas</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&family=Newsreader:opsz,wght@6..72,500;6..72,600&display=swap">
<style>
/* Layout: specimen viewer fills the stage; a quiet index of structures sits beside it (below it on phones). */
:root {
  --bg: #e7ebe9;
  --panel: #f5f7f6;
  --ink: #1b2321;
  --muted: #5a6864;
  --line: #c6cfcb;
  --accent: #23617f;
  --accent-ink: #ffffff;
  --label-bg: rgba(250, 252, 251, 0.92);
  --label-ink: #1b2321;
  --leader: rgba(27, 35, 33, 0.55);
  --off: #9aa3a0;
  --stage: #dfe4e2;
  --f-display: "Newsreader", "Iowan Old Style", Georgia, serif;
  --f-body: "IBM Plex Sans", -apple-system, "Segoe UI", sans-serif;
  --f-label: "IBM Plex Sans Condensed", "Arial Narrow", -apple-system, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111615; --panel: #171d1c; --ink: #e2e8e5; --muted: #8f9d99; --line: #2a3432;
    --accent: #79b3cf; --accent-ink: #0c1416; --label-bg: rgba(20, 27, 26, 0.9); --label-ink: #e8eeeb;
    --leader: rgba(226, 232, 229, 0.5); --off: #4a5451; --stage: #0d1211; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111615; --panel: #171d1c; --ink: #e2e8e5; --muted: #8f9d99; --line: #2a3432;
  --accent: #79b3cf; --accent-ink: #0c1416; --label-bg: rgba(20, 27, 26, 0.9); --label-ink: #e8eeeb;
  --leader: rgba(226, 232, 229, 0.5); --off: #4a5451; --stage: #0d1211; color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
button { font: inherit; color: inherit; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.app {
  height: 100%;
  display: grid;
  grid-template-columns: 320px minmax(0, 1fr);
  gap: 0;
}
aside {
  background: var(--panel);
  border-right: 1px solid var(--line);
  display: flex; flex-direction: column; min-height: 0; min-width: 0;
}
.head { padding: 20px 20px 14px; display: grid; gap: 4px; border-bottom: 1px solid var(--line); }
.head h1 { margin: 0; font-family: var(--f-display); font-weight: 600; font-size: 26px; letter-spacing: -0.01em; text-wrap: balance; }
.head p { margin: 0; color: var(--muted); font-size: 12.5px; }

.index { overflow-y: auto; flex: 1; min-height: 0; padding: 8px 0 16px; }
.group { padding: 10px 20px 4px; }
.group-row { display: flex; align-items: center; gap: 10px; }
.swatch { width: 12px; height: 12px; border-radius: 3px; flex: none; border: 1px solid rgba(0,0,0,0.15); }
.group-name { font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; font-weight: 600; color: var(--muted); flex: 1; }
.toggle {
  border: 1px solid var(--line); background: transparent; border-radius: 999px;
  font-size: 11px; padding: 2px 9px; cursor: pointer; color: var(--muted);
}
.toggle[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.items { list-style: none; margin: 6px 0 0; padding: 0; display: grid; }
.items button {
  width: 100%; text-align: left; background: none; border: 0; padding: 5px 8px; margin-left: -8px;
  border-radius: 6px; cursor: pointer; font-size: 13.5px; display: flex; gap: 8px; align-items: baseline;
}
.items button:hover { background: color-mix(in srgb, var(--accent) 10%, transparent); }
.items button.sel { background: var(--accent); color: var(--accent-ink); }
.items .num { font-family: var(--f-label); font-size: 11.5px; color: var(--muted); min-width: 20px; font-variant-numeric: tabular-nums; }
.items button.sel .num { color: inherit; }
.items.off button { color: var(--off); }
.quiz-hidden .items .nm { filter: blur(5px); user-select: none; }
.quiz-hidden .items button.revealed .nm { filter: none; }

.credit { padding: 12px 20px; border-top: 1px solid var(--line); font-size: 11px; color: var(--muted); line-height: 1.45; }
.credit a { color: inherit; }

.stage { position: relative; min-width: 0; min-height: 0; background: var(--stage); overflow: hidden; touch-action: none; }
.stage canvas { display: block; width: 100%; height: 100%; }
#leaders { position: absolute; inset: 0; pointer-events: none; width: 100%; height: 100%; }
#labels { position: absolute; inset: 0; pointer-events: none; }
.lbl {
  position: absolute; left: 0; top: 0; pointer-events: auto; cursor: pointer;
  font-family: var(--f-label); font-size: 12.5px; font-weight: 500; line-height: 1;
  color: var(--label-ink); background: var(--label-bg);
  border: 1px solid var(--line); border-radius: 5px; padding: 4px 7px; white-space: nowrap;
  transition: opacity 160ms ease; will-change: transform;
}
.lbl.sel { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); z-index: 2; }
.lbl.hide { opacity: 0; pointer-events: none; }
.lbl .n { color: var(--muted); margin-right: 5px; font-variant-numeric: tabular-nums; }
.lbl.sel .n { color: inherit; }

.bar {
  position: absolute; top: 12px; left: 12px; right: 12px;
  display: flex; flex-wrap: wrap; gap: 8px; justify-content: space-between; pointer-events: none;
}
.seg { min-width: 0; max-width: 100%; display: flex; flex-wrap: wrap; gap: 4px; pointer-events: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 9px; padding: 4px; }
.seg button { border: 0; background: transparent; padding: 6px 10px; border-radius: 6px; font-size: 12.5px; cursor: pointer; }
.seg button:hover { background: color-mix(in srgb, var(--accent) 12%, transparent); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }

.card {
  position: absolute; left: 12px; bottom: 12px; max-width: min(420px, calc(100% - 24px));
  background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px;
  display: grid; gap: 4px; box-shadow: 0 6px 24px rgba(0,0,0,0.12);
}
.card h2 { margin: 0; font-family: var(--f-display); font-size: 19px; font-weight: 600; }
.card .bone { font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.card p { margin: 0; font-size: 13.5px; line-height: 1.5; color: var(--ink); }
.loading { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); font-size: 13px; }

@media (max-width: 760px) {
  .app { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto 64vh auto; height: auto; }
  aside { display: contents; }
  .head { grid-row: 1; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); background: var(--panel); }
  .stage { grid-row: 2; }
  .index, .credit { grid-row: 3; background: var(--panel); }
  .index { overflow: visible; padding-left: max(0px, env(safe-area-inset-left, 0px)); padding-right: max(0px, env(safe-area-inset-right, 0px)); }
  .group { padding-left: 16px; padding-right: 16px; }
  .credit { grid-row: 4; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .lbl { font-size: 11px; padding: 3px 5px; }
  .card { right: 12px; }
}
@media (prefers-reduced-motion: reduce) { .lbl { transition: none; } }
</style>

</head>
<body>
<div class="app" id="app">
  <aside>
    <div class="head">
      <h1>Bony Pelvis</h1>
      <p>Hip bones, sacrum and coccyx</p>
    </div>
    <div class="index" id="index"></div>
    <div class="credit">
      Mesh from <a href="https://lifesciencedb.jp/bp3d/" target="_blank" rel="noopener">BodyParts3D</a>, © The Database Center for Life Science, CC BY-SA 2.1 JP. Adult male specimen. Ilium, ischium and pubis boundaries are drawn where the bones fuse in the adult and are approximate.
    </div>
  </aside>

  <div class="stage" id="stage">
    <div class="loading" id="loading">Loading specimen</div>
    <svg id="leaders"></svg>
    <div id="labels"></div>
    <div class="bar">
      <div class="seg" id="views">
        <button data-view="anterior" aria-pressed="true">Anterior</button>
        <button data-view="posterior">Posterior</button>
        <button data-view="superior">Superior</button>
        <button data-view="inferior">Inferior</button>
        <button data-view="left">Lateral</button>
        <button data-view="medial">Medial</button>
      </div>
      <div class="seg">
        <button id="t-color" aria-pressed="true">Color by bone</button>
        <button id="t-labels" aria-pressed="true">Labels</button>
        <button id="t-quiz" aria-pressed="false">Quiz</button>
      </div>
    </div>
    <div class="card" id="card" hidden>
      <div class="bone" id="card-bone"></div>
      <h2 id="card-name"></h2>
      <p id="card-desc"></p>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/controls/OrbitControls.js"></script>
<script>
const GROUPS = [{"id": "ilium", "name": "Ilium", "color": "#e6d3a6"}, {"id": "ischium", "name": "Ischium", "color": "#a9cbbd"}, {"id": "pubis", "name": "Pubis", "color": "#e2b3a6"}, {"id": "sacrum", "name": "Sacrum", "color": "#c3bde0"}, {"id": "coccyx", "name": "Coccyx", "color": "#a8c2e0"}, {"id": "hip", "name": "Hip bone as a whole", "color": "#d9d4c7"}, {"id": "pelvis", "name": "Pelvis as a whole", "color": "#b9b4a6"}];
const LANDMARKS = [{"id": "iliac_crest", "name": "Iliac crest", "group": "ilium", "desc": "Thickened superior border of the ilium from ASIS to PSIS. Attachment for the abdominal wall muscles, latissimus dorsi, quadratus lumborum and the iliac fascia. Top of the crest sits at about the L4 level, the landmark for lumbar puncture.", "p": [104.7, 101.7, -2.8], "n": [0.658, 0.507, -0.556], "p2": [-102.8, 102.4, -3.0], "n2": [-0.565, 0.713, -0.415]}, {"id": "tubercle_crest", "name": "Tubercle of iliac crest", "group": "ilium", "desc": "Widest point of the crest, about 5 cm behind the ASIS. Marks the L5 level and is a common bone marrow biopsy site.", "p": [131.0, 74.9, 34.5], "n": [0.924, 0.357, 0.138], "p2": [-130.1, 74.5, 35.1], "n2": [-0.904, 0.361, 0.229]}, {"id": "asis", "name": "Anterior superior iliac spine", "group": "ilium", "desc": "ASIS. Anterior end of the iliac crest. Origin of sartorius and attachment of the inguinal ligament; easily palpated.", "p": [121.5, 41.6, 70.6], "n": [0.769, -0.057, 0.636], "p2": [-121.4, 41.8, 69.8], "n2": [-0.91, -0.013, 0.414]}, {"id": "aiis", "name": "Anterior inferior iliac spine", "group": "ilium", "desc": "AIIS. Origin of the straight head of rectus femoris and attachment of the iliofemoral ligament.", "p": [100.1, -5.2, 46.0], "n": [0.769, -0.221, 0.6], "p2": [-99.2, -6.8, 45.7], "n2": [-0.809, -0.249, 0.532]}, {"id": "psis", "name": "Posterior superior iliac spine", "group": "ilium", "desc": "PSIS. Posterior end of the iliac crest, seen as the skin dimples over the sacroiliac joints at S2.", "p": [53.8, 54.0, -63.2], "n": [0.418, 0.016, -0.908], "p2": [-52.9, 53.9, -63.2], "n2": [-0.369, 0.044, -0.928]}, {"id": "piis", "name": "Posterior inferior iliac spine", "group": "ilium", "desc": "PIIS. Lies below the PSIS at the upper end of the greater sciatic notch, at the inferior end of the auricular surface.", "p": [41.8, 37.5, -58.2], "n": [-0.001, -0.78, -0.625], "p2": [-41.5, 38.5, -59.9], "n2": [-0.118, -0.71, -0.695]}, {"id": "iliac_fossa", "name": "Iliac fossa", "group": "ilium", "desc": "Smooth concave inner surface of the ala. Origin of iliacus.", "p": [99.8, 44.3, 18.3], "n": [-0.81, 0.356, 0.466], "p2": [-98.9, 44.2, 17.7], "n2": [0.788, 0.354, 0.504]}, {"id": "arcuate_line", "name": "Arcuate line", "group": "ilium", "desc": "Ridge on the inner ilium separating the iliac fossa above from the body below. Part of the pelvic brim (linea terminalis).", "p": [60.2, -3.4, 14.1], "n": [-0.868, 0.408, 0.283], "p2": [-60.8, -2.5, 16.1], "n2": [0.865, 0.358, 0.352]}, {"id": "iliac_tuberosity", "name": "Iliac tuberosity", "group": "ilium", "desc": "Rough area above and behind the auricular surface for the interosseous and posterior sacroiliac ligaments.", "p": [46.1, 55.7, -41.5], "n": [-0.588, 0.326, 0.74], "p2": [-47.0, 56.2, -40.6], "n2": [0.609, 0.325, 0.723]}, {"id": "auricular_ilium", "name": "Auricular surface of ilium", "group": "ilium", "desc": "Ear-shaped articular surface that meets the sacrum at the sacroiliac joint.", "p": [46.0, 25.5, -19.5], "n": [-0.719, 0.349, 0.602], "p2": [-45.3, 24.7, -19.2], "n2": [0.731, 0.298, 0.614]}, {"id": "gluteal_surface", "name": "Gluteal surface", "group": "ilium", "desc": "Outer surface of the ala. Origin of gluteus maximus, medius and minimus, separated by the gluteal lines.", "p": [107.0, 51.9, 13.3], "n": [0.679, -0.276, -0.681], "p2": [-109.0, 54.9, 14.4], "n2": [-0.668, -0.295, -0.683]}, {"id": "post_gluteal_line", "name": "Posterior gluteal line", "group": "ilium", "desc": "Shortest gluteal line. Gluteus maximus arises behind it.", "p": [63.9, 59.9, -43.0], "n": [0.997, 0.056, -0.044], "p2": [-63.2, 63.3, -41.7], "n2": [-0.995, 0.037, -0.09]}, {"id": "ant_gluteal_line", "name": "Anterior gluteal line", "group": "ilium", "desc": "Gluteus medius arises between the anterior and posterior gluteal lines.", "p": [79.5, 36.9, -6.4], "n": [0.743, -0.182, -0.644], "p2": [-79.3, 38.9, -6.5], "n2": [-0.723, -0.226, -0.653]}, {"id": "inf_gluteal_lin function readVar(name) { return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }

function parseBin(buf) {
  const parts = [];
  const dv = new DataView(buf);
  let off = 0;
  const count = dv.getUint32(off, true); off += 4;
  for (let p = 0; p < count; p++) {
    const nv = dv.getUint32(off, true), nt = dv.getUint32(off + 4, true); off += 8;
    const pos = new Float32Array(buf, off, nv * 3); off += nv * 12;
    const reg = new Uint8Array(buf, off, nv); off += Math.ceil(nv / 4) * 4;
    const idx = new Uint32Array(buf, off, nt * 3); off += nt * 12;
    parts.push({ pos, reg, idx });
  }
  return parts;
}

function regionColors(reg) {
  const cols = new Float32Array(reg.length * 3);
  const palette = GROUPS.map(g => new THREE.Color(g.color));
  const plain = new THREE.Color('#e3dac4');
  for (let i = 0; i < reg.length; i++) {
    const c = state.colorByBone ? (palette[reg[i]] || plain) : plain;
    cols[i * 3] = c.r; cols[i * 3 + 1] = c.g; cols[i * 3 + 2] = c.b;
  }
  return cols;
}

fetch('pelvis-mesh.txt').then(r => {
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return r.text();
}).then(b64 => {
  const bin = atob(b64.trim());
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  const buf = bytes.buffer;
  const parts = parseBin(buf);
  boneMaterial = new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.78, metalness: 0.0 });
  parts.forEach((p, i) => {
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.BufferAttribute(p.pos, 3));
    g.setIndex(new THREE.BufferAttribute(p.idx, 1));
    g.computeVertexNormals();
    g.computeBoundingSphere();
    if (i >= 3) {
      const pm = new THREE.Mesh(g, new THREE.MeshBasicMaterial({ side: THREE.DoubleSide }));
      pm.updateMatrixWorld();
      proxies.push(pm);
      return;
    }
    g.setAttribute('color', new THREE.BufferAttribute(regionColors(p.reg), 3));
    g.userData.reg = p.reg;
    const m = new THREE.Mesh(g, boneMaterial);
    scene.add(m);
    meshes.push(m);
  });
  buildLines();
  document.getElementById('loading').remove();
  setView('anterior', true);
  requestRender();
}).catch(err => {
  document.getElementById('loading').textContent = 'The specimen did not load (' + err.message + '). Reload the page to try again.';
});

  el.innerHTML = '<span class="n"></span><span class="t"></span>';
  el.querySelector('.n').textContent = lm.num;
  el.addEventListener('click', e => { e.stopPropagation(); select(lm, false); });
  labelsEl.appendChild(el);
  lm.el = el;
  const line = document.createElementNS(SVGNS, 'line');
  line.setAttribute('stroke', 'var(--leader)');
  line.setAttribute('stroke-width', '1');
  const dot = document.createElementNS(SVGNS, 'circle');
  dot.setAttribute('r', '2.6');
  dot.setAttribute('fill', 'var(--leader)');
  leaders.append(line, dot);
  lm.line = line; lm.dot = dot;
  lm.vis = false; lm.side = 0;
});

function buildLines() {
  const mat = new THREE.MeshBasicMaterial({ color: new THREE.Color(readVar('--accent')), depthTest: false, transparent: true, opacity: 0.9 });
  Object.entries(LINES).forEach(([key, pts]) => {
    const closed = key !== 'arch';
    const curve = new THREE.CatmullRomCurve3(pts.map(p => new THREE.Vector3(...p)), closed, 'centripetal');
    const m = new THREE.Mesh(new THREE.TubeGeometry(curve, 160, 1.3, 6, closed), mat);
    m.renderOrder = 10;
    m.visible = false;
    scene.add(m);
    lineMeshes[key] = m;
  });
}

function updateLines() {
  const key = state.selected && state.selected.outline;
  Object.entries(lineMeshes).forEach(([k, m]) => { m.visible = k === key && !state.hideLeft; });
  Object.values(lineMeshes).forEach(m => m.material.color.set(readVar('--accent')));
}

function labelText(lm) {
  if (state.quiz && !state.revealed.has(lm.id) && state.selected !== lm) return '?';
  return lm.name;
}

// ---------- index ----------
function buildIndex() {
  indexEl.innerHTML = '';
  GROUPS.forEach(g => {
    const sec = document.createElement('section');
    sec.className = 'group';
    const row = document.createElement('div');
    row.className = 'group-row';
    const sw = document.createElement('span');
    sw.className = 'swatch';
    sw.style.background = g.color;
    const nm = document.createElement('span');
    nm.className = 'group-name';
    nm.textContent = g.name;
    const tg = document.createElement('button');
    tg.className = 'toggle';
    tg.setAttribute('aria-pressed', String(state.groupOn[g.id]));
    tg.textContent = state.groupOn[g.id] ? 'Shown' : 'Hidden';
    tg.addEventListener('click', () => {
      state.groupOn[g.id] = !state.groupOn[g.id];
      buildIndex();
      scheduleVis();
    });
    row.append(sw, nm, tg);
    const ul = document.createElement('ul');
    ul.className = 'items' + (state.groupOn[g.id] ? '' : ' off');
    LANDMARKS.filter(l => l.group === g.id).forEach(lm => {
      const li = document.createElement('li');
      const b = document.createElement('button');
      b.className = (state.selected === lm ? 'sel ' : '') + (state.revealed.has(lm.id) ? 'revealed' : '');
      b.innerHTML = '<span class="num"></span><span class="nm"></span>';
      b.querySelector('.num').textContent = lm.num;
      b.querySelector('.nm').textContent = lm.name;
      b.addEventListener('click', () => select(lm, true));
      li.appendChild(b);
      ul.appendChild(li);
    });
    sec.append(row, ul);
    indexEl.appendChild(sec);
  });
  document.getElementById('app').classList.toggle('quiz-hidden', state.quiz);
}

function select(lm, fly) {
  if (state.quiz && !state.revealed.has(lm.id)) state.revealed.add(lm.id);
  state.selected = lm;
  if (!state.groupOn[lm.group]) state.groupOn[lm.group] = true;
  const card = document.getElementById('card');
  card.hidden = false;
  document.getElementById('card-bone').textContent = groupById[lm.group].name;
  document.getElementById('card-name').textContent = lm.name;
  document.getElementById('card-desc').textContent = lm.desc;
  buildIndex();
  if (fly) flyTo(lm);
  updateLines();
  scheduleVis();
}

stage.addEventListener('pointerdown', e => { stage._down = [e.clientX, e.clientY]; });
stage.addEventListener('click', e => {
  if (e.target.closest('.lbl, .seg, .card')) return;
  const d = stage._down;
  if (d && Math.hypot(e.clientX - d[0], e.clientY - d[1]) > 4) return;
  state.selected = null;
  document.getElementById('card').hidden = true;
  buildIndex();
  updateLines();
  scheduleVis();
});

// ---------- views ----------
const VIEWS = {
  anterior: [0, 0.08, 1],
  posterior: [0, 0.08, -1],
  superior: [0, 1, 0.12],
  inferior: [0, -1, 0.35],
  left: [1, 0.05, 0.05],
  medial: [1, 0.12, 0.22],
};
const CENTER = new THREE.Vector3(0, 0, 0);
const DIST = 600;
function fitDist(d) { return d / Math.min(1, camera.aspect * 0.95); }
let anim = null;

function setView(name, instant) {
  document.querySelectorAll('#views button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.view === name)));
  const dir = new THREE.Vector3(...VIEWS[name]).normalize();
  let target = CENTER.clone();
  // Medial view: the inner face of the right hip bone, with the left hip bone and sacrum out of the way.
  if (name === 'medial') target = new THREE.Vector3(-68, 0, 0);
  animateTo(target, target.clone().addScaledVector(dir, fitDist(name === 'medial' ? 560 : DIST)), instant);
  medialMode(name === 'medial');
}

const MEDIAL_GROUPS = new Set(['ilium', 'ischium', 'pubis', 'hip']);
function medialMode(on) {
  if (meshes.length) { meshes[0].visible = !on; meshes[2].visible = !on; }
  state.hideLeft = on;
  updateLines();
  scheduleVis();
}

function flyTo(lm) {
  medialMode(false);
  document.querySelectorAll('#views button').forEach(b => b.setAttribute('aria-pressed', 'false'));
  // Choose the copy (left or right) nearest the current camera.
  let best = lm.copies[0];
  if (lm.copies.length > 1) {
    const c = camera.position;
    if (lm.copies[1].p.distanceTo(c) < best.p.distanceTo(c)) best = lm.copies[1];
  }
  const dir = (lm.view ? new THREE.Vector3(...lm.view) : best.n.clone());
  if (lm.view && best === lm.copies[1]) dir.x = -dir.x;
  dir.normalize();
  const target = best.p.clone().multiplyScalar(0.55);
  animateTo(target, target.clone().addScaledVector(dir, fitDist(560)), false);
}

function animateTo(target, pos, instant) {
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (instant || reduce) {
    controls.target.copy(target);
    camera.position.copy(pos);
    camera.up.set(0, 1, 0);
    controls.update();
    scheduleVis(); requestRender();
    return;
  }
  anim = { t0: performance.now(), dur: 650, fromT: controls.target.clone(), toT: target, fromP: camera.position.clone(), toP: pos };
  requestRender();
}

document.getElementById('views').addEventListener('click', e => {
  const b = e.target.closest('button');
  if (b) setView(b.dataset.view, false);
});

function pressed(id, v) { document.getElementById(id).setAttribute('aria-pressed', String(v)); }
document.getElementById('t-color').addEventListener('click', () => {
  state.colorByBone = !state.colorByBone;
  pressed('t-color', state.colorByBone);
  meshes.forEach(m => { m.geometry.attributes.color.array.set(regionColors(m.geometry.userData.reg)); m.geometry.attributes.color.needsUpdate = true; });
  requestRender();
});
document.getElementById('t-labels').addEventListener('click', () => {
  state.showLabels = !state.showLabels;
  pressed('t-labels', state.showLabels);
  scheduleVis();
});
document.getElementById('t-quiz').addEventListener('click', () => {
  state.quiz = !state.quiz;
  state.revealed.clear();
  pressed('t-quiz', state.quiz);
  if (state.quiz) { state.selected = null; document.getElementById('card').hidden = true; }
  buildIndex();
  scheduleVis();
});

// ---------- visibility (occlusion) ----------
const ray = new THREE.Raycaster();
let visTimer = 0;
function scheduleVis() { visTimer = 0; requestRender(); }

function computeVisibility() {
  if (!proxies.length) return;
  const cam = camera.position;
  const occluders = state.hideLeft ? [proxies[1]] : proxies;
  LANDMARKS.forEach(lm => {
    lm.vis = false;
    if (!state.showLabels || !state.groupOn[lm.group]) return;
    if (state.hideLeft && !MEDIAL_GROUPS.has(lm.group)) return;
    let best = -1, bestScore = -Infinity;
    lm.copies.forEach((c, i) => {
      if (state.hideLeft && c.p.x > -3) return;
      const toCam = cam.clone().sub(c.p);
      const dist = toCam.length();
      toCam.divideScalar(dist);
      const facing = lm.both ? Math.abs(c.n.dot(toCam)) : c.n.dot(toCam);
      if (facing < (lm.free ? 0 : -0.15)) return;
      ray.set(c.p.clone().addScaledVector(toCam, 3), toCam);
      ray.far = dist;
      const hits = ray.intersectObjects(occluders, false);
      if (hits.length && hits[0].distance > 1.5) return;
      const score = facing - dist * 0.001;
      if (score > bestScore) { bestScore = score; best = i; }
    });
    if (best >= 0) { lm.vis = true; lm.side = best; }
  });
  if (state.selected && state.groupOn[state.selected.group] && state.showLabels && !state.selected.vis) {
    // Keep the selected structure labeled even when it is around a corner.
    state.selected.vis = true;
    const cp = camera.position;
    state.selected.side = state.selected.copies.length > 1 && state.selected.copies[1].p.distanceTo(cp) < state.selected.copies[0].p.distanceTo(cp) ? 1 : 0;
    state.selected.ghost = true;
  } else if (state.selected) state.selected.ghost = false;
}

// ---------- label layout ----------
const tmp = new THREE.Vector3();
function layoutLabels() {
  const w = stage.clientWidth, h = stage.clientHeight;
  const cs = tmp.copy(controls.target).project(camera);
  const cx = (cs.x + 1) / 2 * w, cy = (1 - cs.y) / 2 * h;
  const items = [];
  LANDMARKS.forEach(lm => {
    const el = lm.el;
    const txt = labelText(lm);
    const t = el.querySelector('.t');
    if (t.textContent !== txt) t.textContent = txt;
    el.classList.toggle('sel', state.selected === lm);
    if (!lm.vis) { el.classList.add('hide'); lm.line.style.display = 'none'; lm.dot.style.display = 'none'; return; }
    const c = lm.copies[lm.side];
    const s = tmp.copy(c.p).project(camera);
    const ax = (s.x + 1) / 2 * w, ay = (1 - s.y) / 2 * h;
    let dx = ax - cx, dy = ay - cy;
    const len = Math.hypot(dx, dy) || 1;
    dx /= len; dy /= len;
    const reach = w < 600 ? 26 : 44;
    const right = dx >= 0;
    if (!lm.size || lm.sizeTxt !== txt) { lm.size = [el.offsetWidth, el.offsetHeight]; lm.sizeTxt = txt; }
    items.push({ lm, ax, ay, right, lx: ax + dx * reach, ly: ay + dy * reach * 0.8, wdt: lm.size[0], hgt: lm.size[1] });
  });
  // Push overlapping labels apart vertically.
  const box = i => [i.right ? i.lx : i.lx - i.wdt, i.ly - i.hgt / 2];
  for (let iter = 0; iter < 24; iter++) {
    let moved = false;
    for (let a = 0; a < items.length; a++) {
      for (let b = a + 1; b < items.length; b++) {
        const A = items[a], B = items[b];
        const [ax0, ay0] = box(A), [bx0, by0] = box(B);
        if (ax0 >= bx0 + B.wdt + 4 || bx0 >= ax0 + A.wdt + 4) continue;
        const need = (A.hgt + B.hgt) / 2 + 3;
        const gap = B.ly - A.ly;
        if (Math.abs(gap) >= need) continue;
        const push = (need - Math.abs(gap)) / 2 + 0.5;
        const dir = gap > 0 || (gap === 0 && b > a) ? 1 : -1;
        A.ly -= push * dir; B.ly += push * dir;
        moved = true;
      }
    }
    if (!moved) break;
  }
  items.forEach(i => {
    const x = Math.max(6, Math.min(w - i.wdt - 6, i.right ? i.lx : i.lx - i.wdt));
    const y = i.ly - i.hgt / 2;
    i.lm.el.style.transform = `translate(${Math.round(x)}px, ${Math.round(y)}px)`;
    i.lm.el.classList.remove('hide');
    i.lm.el.style.opacity = i.lm.ghost ? '0.85' : '';
    const L = i.lm.line, D = i.lm.dot;
    L.style.display = ''; D.style.display = '';
    L.setAttribute('x1', i.ax); L.setAttribute('y1', i.ay);
    L.setAttribute('x2', i.ax > x + i.wdt / 2 ? x + i.wdt : x); L.setAttribute('y2', i.ly);
    D.setAttribute('cx', i.ax); D.setAttribute('cy', i.ay);
    const selCol = state.selected === i.lm ? 'var(--accent)' : 'var(--leader)';
    L.setAttribute('stroke', selCol); D.setAttribute('fill', selCol);
    L.setAttribute('stroke-dasharray', i.lm.ghost ? '3 3' : '');
  });
}

// ---------- render loop ----------
let needsRender = true;
function requestRender() { needsRender = true; }
controls.addEventListener('change', () => { requestRender(); visTimer = Math.min(visTimer, 90); });
controls.addEventListener('end', scheduleVis);

function resize() {
  const w = stage.clientWidth, h = stage.clientHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  leaders.setAttribute('viewBox', `0 0 ${w} ${h}`);
  requestRender();
}
new ResizeObserver(resize).observe(stage);

let last = performance.now();
function tick(now) {
  const dt = now - last; last = now;
  if (anim) {
    const k = Math.min(1, (now - anim.t0) / anim.dur);
    const e = k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
    controls.target.lerpVectors(anim.fromT, anim.toT, e);
    camera.position.lerpVectors(anim.fromP, anim.toP, e);
    if (k >= 1) { anim = null; scheduleVis(); }
    needsRender = true;
  }
  const changed = controls.update();
  if (changed) needsRender = true;
  else if (tick.moving) { visTimer = 0; needsRender = true; }
  tick.moving = changed || !!anim;
  if (needsRender) {
    visTimer -= dt;
    if (visTimer <= 0) { computeVisibility(); visTimer = 120; }
    renderer.render(scene, camera);
    layoutLabels();
    needsRender = false;
  }
  requestAnimationFrame(tick);
}

buildIndex();
resize();
applyTheme();
requestAnimationFrame(tick);
</script>

</body>
</html>

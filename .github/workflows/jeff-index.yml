name: jeff index

# Keeps each block's index.json in step with its lecture files and the PDFs
# that go with them, however they were added — a push, an upload through the
# website, or the Anki add-on.
on:
  push:
    branches: [main]
    paths:
      - 'jeff/**.json'
      - 'jeff/build_index.py'
      - 'pdfs/**'

permissions:
  contents: write

jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 jeff/build_index.py
      - name: Commit if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add jeff/*/index.json
          git diff --cached --quiet || (git commit -m "Rebuild jeff lecture index" && git push)

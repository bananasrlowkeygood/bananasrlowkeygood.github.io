name: jeff index

# Keeps each block's index.json in step with its lecture files, however they
# were added — a push or an upload through the website.
on:
  push:
    branches: [main]
    paths:
      - 'jeff/**.json'
      - 'jeff/build_index.py'

permissions:
  contents: write

jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 jeff/build_index.py
      - name: Commit if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add jeff/*/index.json
          git diff --cached --quiet || (git commit -m "Rebuild jeff lecture index" && git push)

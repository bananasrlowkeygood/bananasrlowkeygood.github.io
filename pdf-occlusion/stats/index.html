<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>stats</title>
  <link rel="icon" href="../icon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Klee+One:wght@400;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg: #eae6f0;
      --ink: #14111a;
      --ink-2: #4a4256;
      --accent: #5c4f7a;
      --accent-hi: #6e5f90;
      --accent-lo: #3e3456;
      --bar: #7c6ca8;
      --bar-hi: #5c4f7a;
      --light: #f0ecf8;
      --muted: #8a83a3;
      --card: rgba(255, 255, 255, 0.55);
      --line: rgba(92, 79, 122, 0.18);
      --good: #2f7d55;
      --bad: #b23a48;
      --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
    }
    body {
      font-family: "Klee One", cursive;
      background: var(--bg);
      color: var(--ink);
      min-height: 100vh;
      overflow-x: hidden;
      padding: 28px 16px 60px;
    }
    body::before {
      content: "";
      position: fixed;
      inset: -25%;
      z-index: -1;
      pointer-events: none;
      background:
        radial-gradient(34% 40% at 18% 22%, rgba(124, 108, 168, 0.26), transparent 62%),
        radial-gradient(32% 38% at 84% 26%, rgba(170, 150, 210, 0.22), transparent 62%),
        radial-gradient(40% 46% at 62% 86%, rgba(150, 170, 214, 0.18), transparent 64%);
    }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }
    main { max-width: 1440px; margin: 0 auto; }
    .num, td.n, .mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }

    /* gate */
    #gate { max-width: 420px; margin: 18vh auto 0; text-align: center; }
    #gate h1 { font-size: 1.8rem; font-weight: 600; margin-bottom: 18px; }
    .cmd {
      display: flex; align-items: center; gap: 10px; height: 48px;
      padding: 0 6px 0 14px; background: var(--card); border: 1px solid var(--line);
      border-radius: 12px; box-shadow: 0 10px 30px rgba(70, 50, 110, 0.10);
    }
    .cmd:focus-within { border-color: var(--accent); }
    .cmd span { font-family: var(--mono); font-size: 0.86rem; color: var(--accent); white-space: nowrap; }
    .cmd input {
      flex: 1; min-width: 0; border: none; outline: none; background: transparent;
      font-family: var(--mono); font-size: 0.92rem; color: var(--ink);
    }
    button {
      font-family: "Klee One", cursive; background: var(--accent); color: var(--light);
      border: none; height: 34px; padding: 0 14px; border-radius: 9px; cursor: pointer; font-size: 0.9rem;
    }
    button:hover { background: var(--accent-hi); }
    button:active { background: var(--accent-lo); }
    button:disabled { background: #b9b6bf; color: #f4f3f6; cursor: default; }
    .msg { min-height: 1.3em; margin-top: 12px; color: var(--bad); font-size: 0.9rem; }

    /* header */
    header { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 18px; }
    header .left { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
    h1 { font-size: 1.7rem; font-weight: 600; }
    .sub { color: var(--muted); font-size: 0.85rem; }
    .chips { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
    .chip {
      height: 30px; padding: 0 12px; border-radius: 15px; font-size: 0.85rem;
      background: var(--card); color: var(--accent); border: 1px solid var(--line);
    }
    .chip:hover { background: #fff; }
    .chip.on { background: var(--accent); color: var(--light); border-color: var(--accent); }

    section { margin-top: 28px; }
    h2 { font-size: 1.15rem; font-weight: 600; margin-bottom: 10px; }
    .card {
      background: var(--card); border: 1px solid var(--line); border-radius: 14px;
      padding: 14px 16px; box-shadow: 0 8px 24px rgba(70, 50, 110, 0.06);
    }

    /* tiles */
    .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(140px, 100%), 1fr)); gap: 10px; }
    .tile .k { font-size: 0.82rem; color: var(--ink-2); }
    .tile .v { font-family: var(--mono); font-size: 1.45rem; font-weight: 500; margin-top: 2px; }
    .tile .d { font-size: 0.78rem; color: var(--muted); margin-top: 2px; }
    .v.good { color: var(--good); }
    .v.bad { color: var(--bad); }

    /* charts */
    .charts { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(320px, 100%), 1fr)); gap: 10px; }
    .chart .top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
    .chart .t { font-size: 0.9rem; color: var(--ink-2); }
    .chart .tot { font-family: var(--mono); font-size: 0.95rem; }
    .chart svg { display: block; width: 100%; height: 110px; margin-top: 8px; overflow: visible; }
    .chart .axis { display: flex; justify-content: space-between; font-family: var(--mono); font-size: 0.68rem; color: var(--muted); margin-top: 4px; }
    .chart rect.b { fill: var(--bar); }
    .chart rect.hit { fill: transparent; }
    .chart g:hover rect.b { fill: var(--bar-hi); }
    .chart line.base { stroke: var(--line); stroke-width: 1; }

    /* horizontal bars (funnel, versions) */
    .hbars { display: grid; grid-template-columns: max-content minmax(40px, 1fr) max-content; gap: 6px 10px; align-items: center; }
    .hrow { display: contents; font-size: 0.88rem; }
    .hrow > span:first-child { font-size: 0.88rem; }
    .hrow .track { height: 14px; border-radius: 4px; background: rgba(92, 79, 122, 0.08); overflow: hidden; }
    .hrow .fill { height: 100%; background: var(--bar); border-radius: 0 4px 4px 0; min-width: 2px; }
    .hrow .val { font-family: var(--mono); font-size: 0.8rem; text-align: right; color: var(--ink-2); }
    .two { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(330px, 100%), 1fr)); gap: 10px; }

    /* tables */
    .tablewrap { overflow-x: auto; max-height: 520px; overflow-y: auto; padding-top: 0; }
    table { width: 100%; border-collapse: collapse; font-size: 0.82rem; }
    th {
      position: sticky; top: 0; background: #f3f0f8; text-align: left; font-weight: 600;
      color: var(--ink-2); padding: 7px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; cursor: pointer;
    }
    th.n, td.n { text-align: right; }
    td { padding: 5px 8px; border-bottom: 1px solid rgba(92, 79, 122, 0.08); white-space: normal; overflow-wrap: anywhere; vertical-align: top; }
    td.n, td.nw { white-space: nowrap; overflow-wrap: normal; }
    table { table-layout: auto; }
    @media (max-width: 1000px) { .lo { display: none; } }
    @media (max-width: 600px) { .xs { display: none; } td, th { padding-left: 5px; padding-right: 5px; } }
    td.wrap { white-space: normal; min-width: 220px; max-width: 420px; word-break: break-word; }
    tr.click { cursor: pointer; }
    tr.click:hover td { background: rgba(255, 255, 255, 0.6); }
    .props { font-family: var(--mono); font-size: 0.74rem; color: var(--ink-2); }
    .tag { display: inline-block; padding: 1px 7px; border-radius: 6px; font-size: 0.74rem; background: rgba(92, 79, 122, 0.12); color: var(--accent-lo); }
    .tag.server { background: rgba(47, 125, 85, 0.12); color: var(--good); }
    .tag.web { background: rgba(178, 120, 30, 0.14); color: #7a5410; }
    .tag.err { background: rgba(178, 58, 72, 0.12); color: var(--bad); }
    .empty { color: var(--muted); font-size: 0.88rem; padding: 6px 0; }
    .filterbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 10px; }
    .filterbar input, .filterbar select {
      height: 30px; border: 1px solid var(--line); border-radius: 8px; background: #fbfaff;
      padding: 0 10px; font-family: var(--mono); font-size: 0.8rem; color: var(--ink); min-width: 0;
    }
    .filterbar input { flex: 1 1 200px; }
    .note { color: var(--muted); font-size: 0.8rem; margin-top: 8px; }

    #tip {
      position: fixed; pointer-events: none; z-index: 10; background: #1f1a29; color: #f3effa;
      font-family: var(--mono); font-size: 0.75rem; padding: 6px 9px; border-radius: 7px;
      white-space: pre; opacity: 0; transition: opacity 0.08s;
    }
    .four { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(250px, 100%), 1fr)); gap: 10px; align-items: start; }
    @media (max-width: 560px) {
      .tile .v { font-size: 1.2rem; }
    }

    /* status pills */
    .pill { display: inline-block; padding: 1px 8px; border-radius: 9px; font-size: 0.76rem; background: rgba(92, 79, 122, 0.10); color: var(--ink-2); }
    .pill.good { background: rgba(47, 125, 85, 0.13); color: var(--good); }
    .pill.bad { background: rgba(178, 58, 72, 0.12); color: var(--bad); }
    .pill.warm { background: rgba(178, 120, 30, 0.14); color: #7a5410; }
    .pill.paid { background: var(--accent); color: var(--light); }
    span.wrap { white-space: normal; }

    /* person drawer */
    #shade { position: fixed; inset: 0; background: rgba(20, 17, 26, 0.18); z-index: 19; opacity: 0; pointer-events: none; transition: opacity 0.15s; }
    #shade.open { opacity: 1; pointer-events: auto; }
    #drawer {
      position: fixed; top: 0; right: 0; bottom: 0; width: min(600px, 100%); z-index: 20;
      background: #f5f2fa; border-left: 1px solid var(--line); box-shadow: -18px 0 40px rgba(70, 50, 110, 0.14);
      overflow-y: auto; padding: 22px 22px 60px; transform: translateX(105%); transition: transform 0.18s ease;
    }
    #drawer.open { transform: none; }
    #drawer .top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
    #drawer h3 { font-size: 1.3rem; font-weight: 600; word-break: break-word; }
    #drawer .facts { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(130px, 100%), 1fr)); gap: 8px; margin: 14px 0 6px; }
    #drawer .fact { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 7px 10px; }
    #drawer .fact .k { font-size: 0.74rem; color: var(--muted); }
    #drawer .fact .v { font-family: var(--mono); font-size: 0.86rem; margin-top: 1px; word-break: break-word; }
    .tl .day { font-weight: 600; margin: 18px 0 6px; color: var(--ink-2); }
    .tl .ev { display: grid; grid-template-columns: 70px 1fr; gap: 10px; padding: 3px 0; font-size: 0.86rem; align-items: baseline; }
    .tl .t { font-family: var(--mono); font-size: 0.74rem; color: var(--muted); text-align: right; }
    .tl .ev.good .w { color: var(--good); font-weight: 600; }
    .tl .ev.bad .w { color: var(--bad); font-weight: 600; }
    .tl .ev.key .w { font-weight: 600; }
    .tl .ev.web .w::before { content: "website: "; color: #7a5410; }
    .tl .ev.server .w::before { content: "server: "; color: var(--good); }
    .tl .gap { margin: 4px 0 4px 80px; font-size: 0.74rem; color: var(--muted); border-left: 2px dotted var(--line); padding: 4px 0 4px 10px; }
    .tl .x { color: var(--muted); font-family: var(--mono); font-size: 0.74rem; }

    details.raw > summary { cursor: pointer; font-size: 1.15rem; font-weight: 600; list-style: none; }
    details.raw > summary::-webkit-details-marker { display: none; }
    details.raw > summary::before { content: "▸ "; color: var(--accent); }
    details.raw[open] > summary::before { content: "▾ "; }
    details.raw section { margin-top: 18px; }
  </style>
</head>
<body>
  <main>
    <div id="gate" hidden>
      <h1>stats</h1>
      <form class="cmd" id="gateForm" autocomplete="off">
        <span>password:</span>
        <input type="password" id="pw" autocomplete="current-password" autofocus>
        <button type="submit">go</button>
      </form>
      <div class="msg" id="gateMsg"></div>
    </div>

    <div id="app" hidden>
      <header>
        <div class="left">
          <a href="../">pdf occlusion</a>
          <h1>stats</h1>
          <span class="sub" id="asof"></span>
        </div>
        <div class="chips">
          <button class="chip on" id="hideMe">hide me</button>
          <button class="chip" id="refresh">refresh</button>
          <button class="chip" id="signout">sign out</button>
        </div>
      </header>

      <section>
        <div class="tiles" id="tiles"></div>
      </section>

      <section>
        <h2>auto-occlude runs</h2>
        <div class="card tablewrap" id="runs"></div>
      </section>

      <section>
        <h2>people</h2>
        <div class="card">
          <div class="filterbar">
            <select id="pStatus"><option value="">everyone</option></select>
            <input id="pWho" placeholder="search">
          </div>
          <div class="tablewrap" id="people"></div>
        </div>
      </section>

      <section class="four">
        <div>
          <h2>auto-occlude</h2>
          <div class="card hbars" id="autoFunnel"></div>
        </div>
        <div>
          <h2>add-on</h2>
          <div class="card hbars" id="addonFunnel"></div>
        </div>
        <div>
          <h2>sign-in</h2>
          <div class="card hbars" id="signinFunnel"></div>
        </div>
        <div>
          <h2>website</h2>
          <div class="card hbars" id="webFunnel"></div>
        </div>
      </section>

      <section>
        <h2>problems</h2>
        <div class="card tablewrap" id="problems"></div>
      </section>

      <section>
        <h2>money</h2>
        <div class="tiles" id="money"></div>
      </section>

      <section>
        <h2>per day</h2>
        <div class="charts" id="charts"></div>
      </section>

      <section class="two">
        <div>
          <h2>versions</h2>
          <div class="card hbars" id="versions"></div>
        </div>
        <div>
          <h2>updates</h2>
          <div class="card tablewrap" id="updates"></div>
        </div>
      </section>

      <section>
        <h2>accounts</h2>
        <div class="card tablewrap" id="accounts"></div>
      </section>

      <section>
        <h2>payments</h2>
        <div class="card tablewrap" id="payments"></div>
      </section>

      <section>
        <details class="raw">
          <summary>raw data</summary>
          <section>
            <h2>clicks</h2>
            <div class="card tablewrap" id="clicks"></div>
          </section>
          <section>
            <h2>activity</h2>
            <div class="card">
              <div class="filterbar">
                <select id="fSource">
                  <option value="">all sources</option>
                  <option value="addon">add-on</option>
                  <option value="web">website</option>
                  <option value="server">server</option>
                </select>
                <select id="fName"><option value="">all events</option></select>
                <input id="fWho" placeholder="search">
                <button class="chip" id="fClear">clear</button>
              </div>
              <div class="tablewrap" id="feed"></div>
            </div>
          </section>
          <section>
            <h2>all events</h2>
            <div class="card tablewrap" id="events"></div>
          </section>
        </details>
      </section>
    </div>
  </main>

  <div id="shade"></div>
  <aside id="drawer" aria-hidden="true">
    <div class="top">
      <div>
        <h3 id="dWho"></h3>
        <div class="sub" id="dSub"></div>
      </div>
      <button class="chip" id="dClose">close</button>
    </div>
    <div class="facts" id="dFacts"></div>
    <div class="tl" id="dTimeline"></div>
  </aside>
  <div id="tip"></div>

  <script>
    const params = new URLSearchParams(location.search);
    const API = params.get("api") || "https://pdf-occlusion-api.pdf-occlusion.workers.dev";
    const KEY = "po-stats-key";
    let data = null;
    let range = 30;
    // what the page shows: everything, or everything but the owner's own accounts
    let V = { jobs: [], clients: [], accounts: [] };
    let hideMe = true;
    try { hideMe = localStorage.getItem("po-stats-hide-me") !== "0"; } catch {}
    function applyView() {
      const keep = (r) => !(hideMe && r.me);
      V = { jobs: data.jobs.filter(keep), clients: data.clients.filter(keep), accounts: data.accounts.filter(keep) };
    }

    const $ = (id) => document.getElementById(id);
    const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
    const fmt = (n) => (n == null ? "" : Number(n).toLocaleString("en-US"));
    const usd = (n, d = 2) => (n == null ? "" : (n < 0 ? "-$" : "$") + Math.abs(n).toLocaleString("en-US", { minimumFractionDigits: d, maximumFractionDigits: d }));
    const pct = (a, b) => (b ? Math.round((100 * a) / b) + "%" : "");
    const plural = (n, one, many = one + "s") => `${fmt(n)} ${Number(n) === 1 ? one : many}`;
    const dayKey = (ms) => new Date(ms).toLocaleDateString("en-CA");
    const clock = (ms) => new Date(ms).toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit" }).toLowerCase();
    const when = (ms) => {
      if (!ms) return "";
      const d = new Date(ms);
      return (d.toLocaleDateString("en-US", { month: "short", day: "numeric" }) + ", " + clock(ms)).toLowerCase();
    };
    const dur = (ms) => {
      const s = Math.max(0, Math.round(ms / 1000));
      if (s < 60) return `${s} s`;
      const m = Math.round(s / 60);
      if (m < 60) return `${m} min`;
      const h = Math.floor(m / 60);
      if (h < 48) return m % 60 ? `${h} h ${m % 60} min` : `${h} h`;
      return `${Math.round(h / 24)} days`;
    };
    const ago = (ms) => (!ms ? "" : Date.now() - ms < 90e3 ? "just now" : dur(Date.now() - ms) + " ago");
    const short = (dev) => (!dev ? "" : dev.startsWith("w:") ? "browser " + dev.slice(2, 8) : "computer " + dev.slice(0, 6));
    const who = (email, dev) => email || short(dev);
    const parse = (p) => { try { return p ? JSON.parse(p) : null; } catch { return null; } };
    const pill = (text, cls = "") => ({ html: `<span class="pill ${cls}">${esc(text)}</span>` });
    const store = {
      get() { try { return localStorage.getItem(KEY) || ""; } catch { return ""; } },
      set(v) { try { v ? localStorage.setItem(KEY, v) : localStorage.removeItem(KEY); } catch {} },
    };

    // ---------------------------------------------------------------- load

    async function get(path, pw) {
      const res = await fetch(API + path, { headers: { authorization: `Bearer ${pw}` } });
      if (res.status === 401) throw new Error("wrong password");
      if (!res.ok) { const e = new Error(`server said ${res.status}`); e.status = res.status; throw e; }
      return res.json();
    }

    async function start(pw) {
      $("gateMsg").textContent = "";
      try {
        data = await get(`/v1/admin/stats?tz=${new Date().getTimezoneOffset()}`, pw);
      } catch (e) {
        store.set("");
        $("app").hidden = true;
        $("gate").hidden = false;
        $("gateMsg").textContent = e.message === "Failed to fetch" ? "could not reach the server" : e.message;
        $("pw").focus();
        return;
      }
      store.set(pw);
      $("gate").hidden = true;
      $("app").hidden = false;
      render();
    }

    $("gateForm").addEventListener("submit", (e) => {
      e.preventDefault();
      const pw = $("pw").value.trim();
      if (pw) start(pw);
    });
    $("signout").addEventListener("click", () => {
      store.set("");
      data = null;
      closePerson();
      $("pw").value = "";
      $("app").hidden = true;
      $("gate").hidden = false;
      $("pw").focus();
    });
    $("hideMe").classList.toggle("on", hideMe);
    $("hideMe").addEventListener("click", () => {
      hideMe = !hideMe;
      try { localStorage.setItem("po-stats-hide-me", hideMe ? "1" : "0"); } catch {}
      $("hideMe").classList.toggle("on", hideMe);
      render();
    });
    $("refresh").addEventListener("click", async () => {
      $("refresh").disabled = true;
      await start(store.get());
      $("refresh").disabled = false;
    });

    // ---------------------------------------------------------------- derived

    // per computer: its runs, and whether any run was later turned into cards
    function runsByDevice() {
      const m = new Map();
      for (const j of V.jobs) {
        if (!j.device) continue;
        const r = m.get(j.device) || { runs: 0, first: Infinity, made: false };
        r.runs++;
        r.first = Math.min(r.first, j.created_at);
        if (j.cards_at) r.made = true;
        m.set(j.device, r);
      }
      return m;
    }

    const STATUSES = [
      ["paying", "paid"],
      ["ran auto-occlude, made cards", "good"],
      ["ran auto-occlude, no cards yet", "bad"],
      ["signed in, never ran", "warm"],
      ["gave up signing in", "bad"],
      ["opened auto-occlude", ""],
      ["makes cards by hand", "good"],
      ["opened a pdf", ""],
      ["installed only", ""],
    ];

    function status(c, rb) {
      const r = rb.get(c.device);
      const runs = c.runs ?? r?.runs ?? 0;
      const made = c.last_cards && c.first_run ? c.last_cards >= c.first_run : !!r?.made;
      if (c.customer) return STATUSES[0];
      if (runs && made) return STATUSES[1];
      if (runs) return STATUSES[2];
      if (c.email) return STATUSES[3];
      if (c.sign_in_tries) return STATUSES[4];
      if (c.auto_opens) return STATUSES[5];
      if (c.cards) return STATUSES[6];
      if (c.pdfs) return STATUSES[7];
      return STATUSES[8];
    }

    // ---------------------------------------------------------------- money

    const GROSS = new Set(["charge", "payment"]);
    const REFUND = new Set(["refund", "payment_refund", "payment_failure_refund"]);
    const PAYOUT = new Set(["payout", "payout_cancel", "payout_failure", "transfer", "transfer_cancel", "transfer_failure"]);

    // the owner's own purchases are tests: their money is not earned, but
    // what they cost (stripe's fee) still counts
    const real = (t) => (t.me ? { ...t, amount: 0, net: -t.fee } : t);
    const txList = () => ((data.stripe || {}).transactions || []).filter((t) => !PAYOUT.has(t.type)).map(real);

    function money(sinceMs = 0) {
      const txs = txList().filter((t) => t.at >= sinceMs);
      const gross = txs.filter((t) => GROSS.has(t.type)).reduce((a, t) => a + t.amount, 0);
      const refunds = txs.filter((t) => REFUND.has(t.type)).reduce((a, t) => a + t.amount, 0);
      const net = txs.reduce((a, t) => a + t.net, 0);
      return { gross, refunds, net, fees: gross + refunds - net, sales: txs.filter((t) => GROSS.has(t.type)).length };
    }

    function anthropic(sinceMs = 0) {
      if (!sinceMs) return data.totals.cost || 0;
      return data.jobs_daily.filter((r) => r.day >= dayKey(sinceMs)).reduce((a, r) => a + (r.cost || 0), 0);
    }

    // ---------------------------------------------------------------- tiles

    function tile(k, v, d = "", cls = "") {
      return `<div class="card tile"><div class="k">${esc(k)}</div><div class="v ${cls}">${v}</div><div class="d">${d}</div></div>`;
    }

    function renderTiles() {
      const t = data.totals;
      const week = Date.now() - 7 * 864e5;
      const runs = V.jobs;
      const made = runs.filter((j) => j.cards_at).length;
      const paying = data.accounts.filter((a) => a.customer && !a.me);
      const subscribed = paying.filter((a) => a.plan && ["active", "trialing"].includes(a.plan_status)).length;
      const all = money(0), wk = money(week);
      const aAll = anthropic(0), aWk = anthropic(week);
      const s = data.stripe || {};
      const profit = (s.error ? 0 : all.net) - aAll;
      $("tiles").innerHTML = [
        tile("computers", fmt(V.clients.length), `${fmt(t.computers_1d)} active today`),
        tile("auto-occlude runs", fmt(runs.length), `${fmt(runs.filter((j) => j.created_at >= week).length)} this week`),
        tile("runs turned into cards", runs.length ? `${made} of ${runs.length}` : "0", runs.length ? pct(made, runs.length) : "", runs.length && made < runs.length ? "bad" : ""),
        tile("accounts", fmt(V.accounts.length), `${fmt(V.accounts.filter((a) => a.created_at >= week).length)} this week`),
        tile("paying", fmt(paying.length), `${fmt(subscribed)} subscribed, ${fmt(paying.filter((a) => a.pack_credits > 0).length)} with packs`),
        tile("profit", usd(profit), `${usd((s.error ? 0 : wk.net) - aWk)} this week`, profit >= 0 ? "good" : "bad"),
      ].join("");

      const thisWeek = (n) => `${usd(n)} this week`;
      $("money").innerHTML = s.error
        ? tile("stripe", "off", "not connected", "bad") + tile("anthropic", usd(aAll), thisWeek(aWk))
        : [
            tile("earned", usd(all.gross), thisWeek(wk.gross)),
            tile("stripe fees", usd(all.fees), thisWeek(wk.fees)),
            tile("refunds", usd(-all.refunds), thisWeek(-wk.refunds)),
            tile("anthropic", usd(aAll), thisWeek(aWk)),
            tile("profit", usd(profit), thisWeek(wk.net - aWk), profit >= 0 ? "good" : "bad"),
            tile("stripe balance", usd(s.available ?? 0), `${usd(s.pending ?? 0)} pending`),
          ].join("");
    }

    // ---------------------------------------------------------------- charts

    function days() {
      const out = [];
      for (let i = range - 1; i >= 0; i--) out.push(dayKey(Date.now() - i * 864e5));
      return out;
    }

    function series(rows, pick) {
      const m = new Map();
      for (const r of rows) { const [k, v] = pick(r); if (k) m.set(k, (m.get(k) || 0) + (v || 0)); }
      return m;
    }

    function chart(title, m, f = fmt) {
      const ds = days();
      const vals = ds.map((d) => m.get(d) || 0);
      const max = Math.max(...vals, 0);
      const total = vals.reduce((a, b) => a + b, 0);
      const W = 100 / ds.length;
      const gap = ds.length > 40 ? 0.15 : 0.35;
      const bars = ds.map((d, i) => {
        const h = max ? (vals[i] / max) * 100 : 0;
        const label = new Date(d + "T12:00").toLocaleDateString("en-US", { weekday: "short", month: "short", day: "numeric" }).toLowerCase();
        return `<g data-tip="${esc(label)}\n${esc(f(vals[i]))}">
          <rect class="hit" x="${i * W}%" y="0" width="${W}%" height="100%"></rect>
          ${vals[i] ? `<rect class="b" x="${i * W + gap}%" y="${100 - h}%" width="${Math.max(W - 2 * gap, 0.3)}%" height="${h}%" rx="2"></rect>` : ""}
        </g>`;
      }).join("");
      const first = new Date(ds[0] + "T12:00").toLocaleDateString("en-US", { month: "short", day: "numeric" });
      return `<div class="card chart">
        <div class="top"><span class="t">${esc(title)}</span><span class="tot">${esc(f(total))}</span></div>
        <svg preserveAspectRatio="none">${bars}<line class="base" x1="0" y1="100%" x2="100%" y2="100%"></line></svg>
        <div class="axis"><span>${first.toLowerCase()}</span><span>today</span></div>
      </div>`;
    }

    function renderCharts() {
      const ev = (name, field = "n") => series(data.daily.filter((r) => r.name === name), (r) => [r.day, r[field]]);
      const act = (src) => series(data.active.filter((r) => r.source === src), (r) => [r.day, r.d]);
      const jd = (f) => series(data.jobs_daily, (r) => [r.day, r[f]]);
      const txs = txList();
      const rev = series(txs.filter((t) => GROSS.has(t.type)), (t) => [dayKey(t.at), t.amount]);
      const usd2 = (n) => usd(n);
      $("charts").innerHTML = [
        chart("computers", act("addon")),
        chart("new computers", series(data.new_clients.filter((r) => r.kind === "addon"), (r) => [r.day, r.n])),
        chart("pdfs opened", ev("pdf_open")),
        chart("cards made", ev("cards_created")),
        chart("auto-occlude runs", jd("runs")),
        chart("auto-occlude pages", jd("pages")),
        chart("new accounts", series(data.signups, (r) => [r.day, r.n])),
        chart("earned", rev, usd2),
        chart("anthropic", jd("cost"), usd2),
        chart("site visitors", act("web")),
        chart("problems", series(data.daily.filter((r) => /error|out_of_pages/.test(r.name)), (r) => [r.day, r.n])),
      ].join("");
    }

    // ---------------------------------------------------------------- funnels & versions

    function hbars(rows, top) {
      if (!rows.length) return `<div class="empty">nothing yet</div>`;
      const max = top ?? Math.max(...rows.map((r) => r[1] || 0), 1);
      return rows.map(([k, v, extra]) => `<div class="hrow" data-tip="${esc(k)}\n${esc(fmt(v))}${extra ? "\n" + esc(extra) : ""}">
        <span>${esc(k)}</span><div class="track"><div class="fill" style="width:${max ? (100 * (v || 0)) / max : 0}%"></div></div>
        <span class="val">${fmt(v)}${extra ? " " + esc(extra) : ""}</span></div>`).join("");
    }

    // each step as a share of the step before it
    function steps(list) {
      return list.map(([k, v], i) => [k, v ?? 0, i ? pct(v ?? 0, list[i - 1][1] ?? 0) : ""]);
    }

    function renderFunnels() {
      const f = data.funnel;
      const rb = runsByDevice();
      const opened = V.clients.filter((c) => c.auto_opens);
      const ran = V.clients.filter((c) => rb.get(c.device));
      $("autoFunnel").innerHTML = hbars(steps([
        ["opened it", opened.length],
        ["signed in", opened.filter((c) => c.email).length],
        ["ran it", ran.length],
        ["made the cards", ran.filter((c) => rb.get(c.device).made).length],
        ["ran it again", ran.filter((c) => rb.get(c.device).runs >= 2).length],
        ["paid", ran.filter((c) => c.customer).length],
      ]), opened.length);
      $("addonFunnel").innerHTML = hbars(steps([
        ["installed", f.seen], ["opened the add-on", f.opened_window], ["opened a pdf", f.opened_pdf], ["made cards", f.made_cards],
      ]), f.seen);
      $("signinFunnel").innerHTML = f.web_link == null ? `<div class="empty">nothing yet</div>` : hbars(steps([
        ["opened the link page", f.web_link], ["signed in with google", f.web_signed_in], ["linked anki", f.web_linked],
      ]), f.web_link);
      $("webFunnel").innerHTML = hbars(steps([
        ["visitors", f.web_visitors], ["saw pricing", f.web_pricing], ["started checkout", f.web_checkout], ["bought", f.web_paid],
      ]), f.web_visitors);

      $("versions").innerHTML = hbars(data.versions.map((r) => [
        r.version + (r.version === data.latest_version ? " (latest)" : ""), r.n, r.active ? `${r.active} active` : "",
      ]));
      $("updates").innerHTML = table(
        [["when"], ["who"], ["from"], ["to"]],
        data.updates.map((u) => { const p = parse(u.props) || {}; return [when(u.at), who(u.email, u.device), p.from, p.to]; }),
      );
    }

    // ---------------------------------------------------------------- tables

    // cols: [label, "n" for numbers]; rows: arrays of cell html/text
    function table(cols, rows, opts = {}) {
      if (!rows.length) return `<div class="empty">nothing yet</div>`;
      const cls = ([, k, x]) => [k || "", x || ""].join(" ").trim();
      const head = cols.map((col, i) => `<th class="${col[1] === "n" ? "n" : ""} ${col[2] || ""}" data-col="${i}">${esc(col[0])}</th>`).join("");
      const body = rows.map((r, ri) => `<tr${opts.keys ? ` class="click" data-key="${esc(opts.keys[ri])}"` : ""}>` +
        r.map((v, i) => {
          const k = cols[i][1];
          const cell = v && typeof v === "object" ? v.html : esc(k === "n" && typeof v === "number" ? fmt(v) : v);
          return `<td class="${cls(cols[i])}">${cell ?? ""}</td>`;
        }).join("") + "</tr>").join("");
      return `<table><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table>`;
    }

    function sortable(el) {
      el.querySelectorAll("th").forEach((th) => th.addEventListener("click", () => {
        const tb = el.querySelector("tbody");
        const i = Number(th.dataset.col);
        const dir = th.dataset.dir === "asc" ? "desc" : "asc";
        th.dataset.dir = dir;
        const num = (s) => { const n = parseFloat(s.replace(/[$,]/g, "")); return isNaN(n) ? null : n; };
        [...tb.rows].sort((a, b) => {
          const x = a.cells[i].textContent, y = b.cells[i].textContent;
          const nx = num(x), ny = num(y);
          const c = nx != null && ny != null ? nx - ny : x.localeCompare(y);
          return dir === "asc" ? c : -c;
        }).forEach((r) => tb.appendChild(r));
      }));
    }

    // rows whose data-key is a computer open that person
    function clickable(el) {
      el.querySelectorAll("tr.click").forEach((tr) => tr.addEventListener("click", () => tr.dataset.key && openPerson(tr.dataset.key)));
    }

    const DENSITY = { fewer: "fewer", balanced: "balanced", more: "more" };

    function renderRuns() {
      const rows = V.jobs.map((j) => {
        const asked = parse(j.asked) || {};
        const placed = parse(j.placed) || {};
        let outcome;
        if (j.cards_at) outcome = { html: `<span class="pill good" data-tip="${esc(dur(j.cards_at - j.created_at))} after the run">${esc(plural(j.cards, "card"))}</span>` };
        else if (placed.stage) outcome = pill("failed", "bad");
        else if (j.asked === undefined || j.created_at < (data.totals.tracking_since || 0)) outcome = "";
        else outcome = { html: `<span class="pill bad" data-tip="last seen ${esc(ago(j.device_last))}">not yet</span>` };
        return [
          when(j.created_at), who(j.email, j.device), { html: `<span class="wrap">${esc(j.lecture)}</span>` },
          j.slides_done === j.slides_total ? j.slides_total : `${j.slides_done} of ${j.slides_total}`,
          placed.cards ?? "", placed.dropped || "", j.asked_at ? dur(j.created_at - j.asked_at) : "", DENSITY[asked.density] || asked.density || "", asked.custom_chars ? "yes" : "",
          outcome, j.free_left ?? "", usd(j.cost_usd, 2),
        ];
      });
      $("runs").innerHTML = table(
        [["when", "nw"], ["who"], ["pdf"], ["pages", "n", "xs"], ["boxes", "n", "xs"], ["skipped", "n", "lo"], ["prep", "n", "lo"], ["density", "", "lo"], ["custom", "", "lo"], ["cards", "nw"], ["free left", "n", "lo"], ["cost", "n", "lo"]],
        rows, { keys: V.jobs.map((j) => j.device || "") },
      );
      clickable($("runs"));
    }

    function renderPeople() {
      const rb = runsByDevice();
      const sel = $("pStatus");
      if (sel.options.length === 1) sel.innerHTML += STATUSES.map(([s]) => `<option>${esc(s)}</option>`).join("");
      const want = sel.value, q = $("pWho").value.trim().toLowerCase();
      const list = V.clients.map((c) => ({ c, st: status(c, rb) })).filter(({ c, st }) =>
        (!want || st[0] === want) &&
        (!q || (c.email || "").toLowerCase().includes(q) || c.device.startsWith(q) || (c.os || "").toLowerCase().includes(q)));
      $("people").innerHTML = table(
        [["who"], ["status"], ["os", "", "lo"], ["version", "", "lo"], ["first seen", "nw", "lo"], ["last seen", "nw"], ["pdfs", "n", "xs"], ["cards", "n", "xs"], ["runs", "n", "xs"], ["pages", "n", "lo"], ["free left", "n", "lo"]],
        list.map(({ c, st }) => [who(c.email, c.device), pill(st[0], st[1]), c.os, c.version, when(c.first_seen), ago(c.last_seen),
          c.pdfs, c.cards, c.runs ?? rb.get(c.device)?.runs ?? 0, c.pages, c.email ? c.free_left ?? "" : ""]),
        { keys: list.map(({ c }) => c.device) },
      );
      sortable($("people"));
      clickable($("people"));
    }
    $("pStatus").addEventListener("change", renderPeople);
    $("pWho").addEventListener("input", renderPeople);

    function renderProblems() {
      const rows = data.problems || data.feed.filter((e) => /error|out_of_pages/.test(e.name) ||
        ((e.name === "sign_in_result" || e.name === "link_result") && (parse(e.props) || {}).result === "error"));
      $("problems").innerHTML = table(
        [["when", "nw"], ["where", "nw"], ["who"], ["what"]],
        rows.map((e) => [when(e.at), { html: tag(e) }, who(e.email, e.device), { html: `<span class="wrap">${esc(say(e))}</span>` }]),
        { keys: rows.map((e) => (e.device && !e.device.startsWith("w:") ? e.device : "")) },
      );
      clickable($("problems"));
    }

    function tag(e) {
      return `<span class="tag ${e.source}${/error/.test(e.name) ? " err" : ""}">${e.source === "addon" ? "add-on" : e.source === "web" ? "website" : "server"}</span>`;
    }

    function renderTables() {
      $("clicks").innerHTML = table(
        [["window"], ["button"], ["clicks", "n"], ["computers", "n"], ["last"]],
        data.clicks.map((c) => [c.win.replace("_", "-"), c.button, c.n, c.d, ago(c.last)]),
      );

      $("accounts").innerHTML = table(
        [["email"], ["joined", "nw"], ["plan", "", "lo"], ["pack pages", "n", "xs"], ["free pages", "n", "xs"], ["paid", "", "lo"], ["runs", "n"], ["pages", "n", "xs"], ["anthropic", "n", "lo"], ["last run", "nw", "lo"], ["linked", "n", "lo"], ["last seen", "nw"]],
        V.accounts.map((a) => [a.email, when(a.created_at),
          a.plan ? `${a.plan} (${a.plan_status})` : a.plan_status || "", a.pack_credits, a.free_left, a.customer ? "yes" : "",
          a.runs, a.pages, usd(a.cost, 3), ago(a.last_run), a.linked, ago(a.last_seen)]),
        { keys: V.accounts.map((a) => V.clients.find((c) => c.email === a.email)?.device || "") },
      );
      clickable($("accounts"));

      const s = data.stripe || {};
      $("payments").innerHTML = s.error
        ? `<div class="empty">stripe not connected</div>`
        : table(
            [["when", "nw"], ["type", "", "lo"], ["who"], ["what"], ["amount", "n"], ["fee", "n", "lo"], ["net", "n"], ["status", "nw"]],
            (s.transactions || []).map((t) => [when(t.at), t.type.replace(/_/g, " "), t.email || "", t.description,
              usd(t.amount), usd(t.fee), usd(t.net), t.me ? pill("test") : t.status]),
          );

      $("events").innerHTML = table(
        [["event"], ["source", "", "xs"], ["all time", "n"], ["30 days", "n", "xs"], ["computers", "n"], ["last", "nw", "xs"]],
        data.event_names.map((e) => [e.name.replace(/_/g, " "), e.source, e.n, e.n30, e.d, ago(e.last)]),
      );

      const names = [...new Set(data.feed.map((e) => e.name))].sort();
      $("fName").innerHTML = `<option value="">all events</option>` +
        names.map((n) => `<option value="${esc(n)}">${esc(n.replace(/_/g, " "))}</option>`).join("");
      ["clicks", "accounts", "payments", "events", "updates", "runs", "problems"].forEach((id) => sortable($(id)));
    }

    function renderFeed() {
      const src = $("fSource").value, name = $("fName").value, q = $("fWho").value.trim().toLowerCase();
      const rows = data.feed.filter((e) =>
        (!src || e.source === src) && (!name || e.name === name) &&
        (!q || (e.email || "").toLowerCase().includes(q) || (e.device || "").startsWith(q) || (e.device || "").startsWith("w:" + q)));
      $("feed").innerHTML = table(
        [["when", "nw"], ["source", "nw"], ["who"], ["what"]],
        rows.map((e) => [when(e.at), { html: tag(e) }, who(e.email, e.device), { html: `<span class="wrap">${esc(say(e))}</span>` }]),
        { keys: rows.map((e) => (e.device && !e.device.startsWith("w:") ? e.device : "")) },
      );
      clickable($("feed"));
    }
    ["fSource", "fName"].forEach((id) => $(id).addEventListener("change", renderFeed));
    $("fWho").addEventListener("input", renderFeed);
    $("fClear").addEventListener("click", () => { $("fSource").value = ""; $("fName").value = ""; $("fWho").value = ""; renderFeed(); });

    // ---------------------------------------------------------------- events in words

    const STAGE = { no_code: "no code", signed_out: "not signed in", signed_in: "signed in, not linked", linked: "linked" };

    function say(e) {
      const p = parse(e.props) || {};
      switch (e.name) {
        case "first_seen": return e.source === "web" ? "first visit" : "installed the add-on";
        case "anki_open": return "opened anki";
        case "anki_close": return "closed anki";
        case "announcement_shown": return "saw the announcement";
        case "announcement_choice": return p.opened ? "opened pdf occlusion from the announcement" : "dismissed the announcement";
        case "dialog_open": return "opened pdf occlusion";
        case "pdf_open": return `opened a pdf, ${plural(p.pages, "page")}${p.reopened ? ", reopened" : ""}`;
        case "click": return e.source === "web"
          ? `pressed “${p.button}” on ${p.page}`
          : `pressed “${p.button}”${p.window && p.window !== "main" ? " in " + String(p.window).replace(/_/g, "-") : ""}`;
        case "auto_occlude_open": return "opened auto-occlude";
        case "auto_occlude_closed": return "closed auto-occlude";
        case "auto_occlude_start": return `started auto-occlude on ${plural(p.pages, "page")}, ${p.density || "balanced"}${p.custom_chars ? ", own instructions" : ""}${p.use_notes ? ", with notes" : ""}`;
        case "auto_occlude_done": return `auto-occlude placed ${plural(p.cards, "box", "boxes")} on ${plural(p.slides, "slide")}${p.dropped ? `, ${fmt(p.dropped)} skipped` : ""}${p.complete === false ? ", stopped early" : ""}`;
        case "auto_occlude_error": return `auto-occlude failed at ${p.stage}${p.status ? ` (${p.status})` : ""}${p.message ? ": " + p.message : ""}`;
        case "cards_created": return `created ${plural(p.cards, "card")}${p.canceled ? ", stopped early" : ""}`;
        case "sign_in_start": return "pressed sign in";
        case "sign_in_done": return "anki is signed in";
        case "sign_in_cancel": return `gave up signing in after ${dur((p.seconds || 0) * 1000)}`;
        case "sign_out": return "signed out";
        case "update_started": return `started updating to ${p.to}`;
        case "update_finished": return p.ok === false ? `update to ${p.to} failed` : `updated to ${p.to}`;
        case "updated": return `now on ${p.to}${p.from ? ` (was ${p.from})` : ""}`;
        case "error": return `error in ${String(p.where || "").replace(/_/g, " ")}: ${p.message || ""}`;
        case "page_view": return `opened ${p.path}`;
        case "sign_in_result":
          if (p.result === "ok") return "signed in with google";
          if (p.result === "closed") return p.code === "auth/cancelled-popup-request" ? "google window replaced by a second one" : "closed the google window";
          if (p.result === "redirect") return "google sign-in switched to a full-page redirect";
          return `google sign-in failed: ${p.code || p.message}`;
        case "link_result": return p.result === "ok" ? "linked anki to the account" : `linking failed: ${p.message}`;
        case "link_left": return `left the link page after ${dur((p.seconds || 0) * 1000)}, ${STAGE[p.stage] || p.stage}`;
        case "signup": return "account created";
        case "addon_linked": return `account linked to ${p.label}`;
        case "job_start": return `run started, ${plural(p.pages, "page")}`;
        case "batch_done": return `finished ${plural(p.pages, "page")} (${usd(p.cost, 3)})`;
        case "out_of_pages": return `out of pages: needed ${fmt(p.pages)}, had ${fmt(p.pages_left)}`;
        case "api_error": return `refused ${p.path} (${p.status}): ${p.message}`;
        case "checkout_start": return `started checkout for ${p.product}`;
        case "purchase": return `bought ${p.product}${p.amount ? ` for ${usd(p.amount)}` : ""}`;
        case "subscription": return `subscription ${p.status}${p.product ? ` (${p.product})` : ""}`;
        default: return e.name.replace(/_/g, " ") + (e.props ? ": " + Object.entries(p).map(([k, v]) => `${k.replace(/_/g, " ")} ${typeof v === "object" ? JSON.stringify(v) : v}`).join(", ") : "");
      }
    }

    const GOOD = new Set(["cards_created", "auto_occlude_done", "purchase", "sign_in_done", "signup"]);
    const KEYEV = new Set(["auto_occlude_start", "pdf_open", "first_seen", "addon_linked", "checkout_start"]);
    const isBad = (e) => /error|out_of_pages|sign_in_cancel/.test(e.name) ||
      ((e.name === "sign_in_result" || e.name === "link_result") && (parse(e.props) || {}).result === "error");

    // ---------------------------------------------------------------- one person

    let personSeq = 0;

    async function openPerson(device) {
      const seq = ++personSeq;
      const c = V.clients.find((x) => x.device === device) || { device };
      $("dWho").textContent = who(c.email, device);
      $("dSub").textContent = [c.os, c.anki ? "anki " + c.anki : "", c.version ? "add-on " + c.version : ""].filter(Boolean).join(", ");
      $("dFacts").innerHTML = "";
      $("dTimeline").innerHTML = `<div class="empty">loading</div>`;
      $("drawer").classList.add("open");
      $("drawer").setAttribute("aria-hidden", "false");
      $("shade").classList.add("open");
      let events, jobs, client = c;
      try {
        const r = await get(`/v1/admin/person?device=${encodeURIComponent(device)}`, store.get());
        events = r.events; jobs = r.jobs; client = { ...c, ...r.client };
      } catch {
        // older server: only what the recent feed holds
        events = data.feed.filter((e) => e.device === device || (c.email && e.email === c.email)).sort((a, b) => a.at - b.at);
        jobs = V.jobs.filter((j) => j.device === device);
      }
      if (seq !== personSeq) return;
      const st = status({ ...c, ...client }, runsByDevice());
      const fact = (k, v) => (v === "" || v == null ? "" : `<div class="fact"><div class="k">${esc(k)}</div><div class="v">${esc(v)}</div></div>`);
      $("dFacts").innerHTML = [
        `<div class="fact" style="grid-column: span 2"><div class="k">status</div><div class="v"><span class="pill ${st[1]}">${esc(st[0])}</span></div></div>`,
        fact("first seen", when(client.first_seen)),
        fact("last seen", ago(client.last_seen)),
        fact("account", client.email ? "since " + when(client.joined || c.joined) : "none"),
        fact("free pages left", client.email ? client.free_left : ""),
        fact("plan", client.plan ? `${client.plan} (${client.plan_status})` : client.pack_credits ? `${client.pack_credits} pack pages` : ""),
        fact("runs", jobs.length ? `${jobs.length}, ${fmt(jobs.reduce((a, j) => a + (j.slides_done || 0), 0))} pages` : "0"),
        fact("anthropic", jobs.length ? usd(jobs.reduce((a, j) => a + (j.cost_usd || 0), 0), 2) : ""),
      ].join("");
      $("dTimeline").innerHTML = timeline(events);
    }

    function timeline(events) {
      if (!events.length) return `<div class="empty">no events</div>`;
      // merge each run's batches into one line, and repeats in the same second
      const lines = [];
      for (const e of events) {
        const p = parse(e.props) || {};
        const last = lines[lines.length - 1];
        if (e.name === "batch_done" && last?.e.name === "batch_done" && (parse(last.e.props) || {}).job === p.job) {
          last.batches++; last.pages += p.pages || 0; last.cost += p.cost || 0; last.end = e.at;
          continue;
        }
        if (last && last.e.name === e.name && last.e.props === e.props && last.e.source === e.source && e.at - last.e.at < 2000) { last.times++; continue; }
        lines.push({ e, times: 1, batches: 1, pages: p.pages || 0, cost: p.cost || 0, end: e.at });
      }
      let out = "", day = "", prev = 0;
      for (const l of lines) {
        const e = l.e;
        const d = new Date(e.at).toLocaleDateString("en-US", { weekday: "short", month: "short", day: "numeric" }).toLowerCase();
        if (d !== day) { out += `<div class="day">${esc(d)}</div>`; day = d; }
        else if (e.at - prev > 10 * 60e3) out += `<div class="gap">${esc(dur(e.at - prev))} later</div>`;
        prev = l.end;
        const text = e.name === "batch_done"
          ? `finished ${plural(l.pages, "page")} in ${plural(l.batches, "batch", "batches")} over ${dur(l.end - e.at + 1)} (${usd(l.cost, 2)})`
          : say(e);
        const cls = [e.source === "web" ? "web" : e.source === "server" ? "server" : "",
          isBad(e) ? "bad" : GOOD.has(e.name) ? "good" : KEYEV.has(e.name) ? "key" : ""].join(" ");
        out += `<div class="ev ${cls}"><span class="t">${esc(clock(e.at))}</span><span class="w">${esc(text)}${l.times > 1 ? ` <span class="x">×${l.times}</span>` : ""}</span></div>`;
      }
      return out;
    }

    function closePerson() {
      personSeq++;
      $("drawer").classList.remove("open");
      $("drawer").setAttribute("aria-hidden", "true");
      $("shade").classList.remove("open");
    }
    $("dClose").addEventListener("click", closePerson);
    $("shade").addEventListener("click", closePerson);
    document.addEventListener("keydown", (e) => { if (e.key === "Escape") closePerson(); });

    function render() {
      applyView();
      // charts cover every day since tracking began
      range = Math.min(90, Math.max(7, Math.ceil((data.now - (data.totals.tracking_since || data.now)) / 864e5) + 1));
      $("asof").textContent = "updated " + when(data.now);
      renderTiles();
      renderRuns();
      renderPeople();
      renderFunnels();
      renderProblems();
      renderCharts();
      renderTables();
      renderFeed();
    }

    // ---------------------------------------------------------------- tooltip

    const tip = $("tip");
    document.addEventListener("mousemove", (e) => {
      const t = e.target.closest && e.target.closest("[data-tip]");
      if (!t) { tip.style.opacity = 0; return; }
      tip.textContent = t.dataset.tip;
      const x = Math.min(e.clientX + 14, innerWidth - tip.offsetWidth - 8);
      tip.style.left = x + "px";
      tip.style.top = e.clientY - tip.offsetHeight - 10 + "px";
      tip.style.opacity = 1;
    });

    const saved = store.get();
    if (saved) start(saved);
    else { $("gate").hidden = false; $("pw").focus(); }
  </script>
</body>
</html>
